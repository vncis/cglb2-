<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global English 2 Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: cheerful, calm, made for a 7-year-old and her parent
   IDEA: a sticker workbook – each unit is a bright tab, each question a page
   PICTURE: big emoji/SVG illustration on a soft card above the answers
   COLOUR and TYPE: sunshine yellow ground, deep ink blue, coral accent; Fredoka
   LAYOUT: home = unit grid; quiz = one column card; result = score ring + skill bars + mistake list */
:root{color-scheme:light dark;
 --bg:light-dark(#fff6d6,#14213d);--card:light-dark(#ffffff,#1e2d50);--ink:light-dark(#14213d,#f3f6ff);
 --soft:light-dark(#fdf0c2,#26375f);--muted:light-dark(#5a6482,#aab4d4);--line:light-dark(#efe1ad,#33466f);
 --acc:#ff5d5d;--ok:#16a34a;--bad:#e11d48;--okbg:light-dark(#dcfce7,#12432a);--badbg:light-dark(#ffe4e6,#4a1726)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Fredoka,"Segoe UI",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,14px) 48px}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
header .logo{font-size:44px;line-height:1}
h1{font-size:clamp(28px,5vw,42px);line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:24px;margin:26px 0 10px}
.sub{color:var(--muted);margin:4px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.unit{background:var(--card);border:0;border-radius:20px;padding:16px;text-align:left;display:flex;gap:12px;align-items:center;min-height:96px;box-shadow:0 3px 0 var(--line);transition:transform .15s}
.unit:hover{transform:translateY(-2px)}
.unit .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:32px;flex:none}
.unit b{display:block;font-size:14px;color:var(--muted);font-weight:500}
.unit span.t{display:block;font-weight:600;font-size:18px;line-height:1.2}
.stars{font-size:14px;letter-spacing:1px;margin-top:3px;color:#f59e0b}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ghost{background:var(--card);border:0;border-radius:14px;min-height:44px;padding:0 14px;box-shadow:0 2px 0 var(--line)}
.bar{flex:1;height:14px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .3s}
.count{font-weight:600;white-space:nowrap}
.card{background:var(--card);border-radius:26px;padding:clamp(16px,3vw,28px);box-shadow:0 4px 0 var(--line)}
.qtext{font-size:clamp(20px,3.4vw,26px);font-weight:600;line-height:1.3;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start}
.say{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--soft);font-size:22px}
.pic{background:var(--soft);border-radius:20px;min-height:170px;display:grid;place-items:center;margin-bottom:16px;padding:12px}
.pic .emo{font-size:clamp(80px,16vw,120px);line-height:1.1;text-align:center}
.pic svg{width:100%;max-width:260px;height:auto;max-height:230px}
.pic .read{font-size:19px;max-width:560px;background:var(--card);padding:14px 18px;border-radius:14px;border-left:6px solid var(--acc)}
.big-listen{width:120px;height:120px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:56px;box-shadow:0 6px 0 #c63b3b}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.opts.pics{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.opt{background:var(--card);border:3px solid var(--line);border-radius:18px;min-height:58px;padding:10px 14px;font-size:19px;text-align:left;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--acc)}
.pics .opt{text-align:center;display:grid;place-items:center;gap:4px;min-height:130px}
.pics .opt .e{font-size:58px;line-height:1}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fillrow{display:flex;gap:10px;flex-wrap:wrap}
.fillrow input{flex:1 1 200px;font:inherit;font-size:22px;padding:10px 16px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);min-height:58px}
.main{background:var(--acc);color:#fff;border:0;border-radius:16px;min-height:56px;padding:0 26px;font-size:19px;font-weight:600;box-shadow:0 4px 0 #c63b3b}
.main:disabled{opacity:.5}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:8px;border-radius:16px}
.tiles.ans{background:var(--soft);border:3px dashed var(--line);margin-bottom:10px}
.tile{background:var(--card);border:3px solid var(--line);border-radius:14px;min-height:46px;padding:4px 14px;font-size:19px}
.fb{margin-top:16px;border-radius:18px;padding:14px 18px;display:none}
.fb.show{display:block}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb strong{font-size:20px}
.next{margin-top:14px;display:flex;justify-content:flex-end}
.res{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:22px;align-items:center}
.ring{position:relative;width:220px;height:220px;margin:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-size:56px;line-height:1}.ring .v small{display:block;color:var(--muted)}
.skill{display:grid;grid-template-columns:8.5em minmax(0,1fr) 3.5em;gap:10px;align-items:center;margin:8px 0}
.skill .track{height:16px;background:var(--soft);border-radius:9px;overflow:hidden}
.skill .track i{display:block;height:100%;border-radius:9px}
.skill .pc{text-align:right;font-weight:600;white-space:nowrap}
.vn{color:var(--muted);font-size:15px}
.mist{background:var(--card);border-radius:18px;padding:14px 16px;margin:10px 0;border-left:6px solid var(--bad)}
.mist .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{border-radius:10px;padding:2px 10px;font-size:15px;background:var(--soft)}
.chip.r{background:var(--badbg)}.chip.g{background:var(--okbg)}
.advice{background:var(--soft);border-radius:18px;padding:14px 18px;margin-top:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hidden{display:none}
@media(max-width:600px){.res{grid-template-columns:1fr}.ring{width:180px;height:180px}.skill{grid-template-columns:6.5em minmax(0,1fr) 3em}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.pop{animation:pop .35s}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase().replace(/[’']/g,"'").replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();
const pageOf = (u,l) => { if(!u||!u.page||!l) return ""; const n=+String(l).split(".")[1]||1; return u.page + 2*(n-1) + (n>=7?2:0) };
const stars = v => v==null ? "☆☆☆" : (v>=9?"★★★":v>=7?"★★☆":v>=5?"★☆☆":"☆☆☆");

/* ---------- speech ---------- */
let voice=null;
const pickVoice=()=>{try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}};
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
const speak = (t,rate=.85) => { try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/_{2,}/g," blank ").replace(/[|]/g,"")); u.lang="en-GB"; if(voice)u.voice=voice; u.rate=rate; speechSynthesis.speak(u);}catch(e){} };
let actx=null;
const tone = ok => { try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(); o.connect(g);g.connect(actx.destination); const t=actx.currentTime;
 o.frequency.setValueAtTime(ok?660:220,t); if(ok)o.frequency.setValueAtTime(880,t+.12); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.35); o.start(t); o.stop(t+.36);}catch(e){} };

/* ---------- pictures ---------- */
function clockSVG(h,m){ const ha=((h%12)+m/60)*30, ma=m*6; let ticks="";
 for(let i=1;i<=12;i++){const a=i*30*Math.PI/180; ticks+=`<text x="${100+72*Math.sin(a)}" y="${100-72*Math.cos(a)+7}" font-size="20" text-anchor="middle" fill="#14213d" font-family="Fredoka,sans-serif">${i}</text>`}
 return `<svg viewBox="0 0 200 200" role="img" aria-label="clock"><circle cx="100" cy="100" r="94" fill="#fff" stroke="#3d8bff" stroke-width="10"/>${ticks}
 <line x1="100" y1="100" x2="${100+45*Math.sin(ha*Math.PI/180)}" y2="${100-45*Math.cos(ha*Math.PI/180)}" stroke="#14213d" stroke-width="9" stroke-linecap="round"/>
 <line x1="100" y1="100" x2="${100+66*Math.sin(ma*Math.PI/180)}" y2="${100-66*Math.cos(ma*Math.PI/180)}" stroke="#ff5d5d" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="100" r="8" fill="#14213d"/></svg>`}
function shapeSVG(s,c,big){ const k=big?1:.6; let p="";
 if(s==="triangle")p=`<polygon points="${100},${100-70*k} ${100+80*k},${100+55*k} ${100-80*k},${100+55*k}" fill="${c}"/>`;
 if(s==="circle")p=`<circle cx="100" cy="100" r="${70*k}" fill="${c}"/>`;
 if(s==="square")p=`<rect x="${100-65*k}" y="${100-65*k}" width="${130*k}" height="${130*k}" fill="${c}"/>`;
 if(s==="rectangle")p=`<rect x="${100-85*k}" y="${100-48*k}" width="${170*k}" height="${96*k}" fill="${c}"/>`;
 return `<svg viewBox="0 0 200 200" role="img" aria-label="shape">${p}</svg>`}
function prepSVG(pos){ const box=(x)=>`<rect x="${x}" y="95" width="80" height="70" rx="6" fill="#d9a066" stroke="#8a5a2b" stroke-width="4"/><line x1="${x}" y1="115" x2="${x+80}" y2="115" stroke="#8a5a2b" stroke-width="3"/>`;
 const ball=(x,y)=>`<circle cx="${x}" cy="${y}" r="20" fill="#ff5d5d" stroke="#14213d" stroke-width="3"/><path d="M${x-20} ${y} q20 -12 40 0" stroke="#fff" stroke-width="4" fill="none"/>`;
 let b="";
 if(pos==="on") b=box(110)+ball(150,73);
 if(pos==="under") b=`<rect x="105" y="40" width="90" height="12" fill="#8a5a2b"/><rect x="112" y="52" width="10" height="110" fill="#8a5a2b"/><rect x="178" y="52" width="10" height="110" fill="#8a5a2b"/>`+ball(150,142);
 if(pos==="next") b=box(80)+ball(195,145);
 if(pos==="between") b=box(30)+box(190)+ball(150,145);
 if(pos==="in") b=ball(150,135)+`<path d="M110 115 h80 v50 h-80z" fill="#d9a066" stroke="#8a5a2b" stroke-width="4"/>`;
 return `<svg viewBox="0 0 300 180" role="img" aria-label="where is the ball"><rect x="0" y="165" width="300" height="15" fill="#9ccf6a"/>${b}</svg>`}
function shadowSVG(t){ const mid=t==="midday"; const sx=mid?150:40, sy=mid?30:95, len=mid?22:120;
 return `<svg viewBox="0 0 300 200" role="img" aria-label="sun and shadow"><rect width="300" height="200" fill="#bfe3ff"/><rect y="160" width="300" height="40" fill="#9ccf6a"/>
 <circle cx="${sx}" cy="${sy}" r="22" fill="#ffd23f"/><ellipse cx="${150+len/2+4}" cy="163" rx="${len/2+6}" ry="6" fill="#2b3a55" opacity=".7"/>
 <circle cx="150" cy="108" r="12" fill="#ffcc99"/><rect x="141" y="120" width="18" height="28" rx="6" fill="#ff5d5d"/><rect x="143" y="146" width="6" height="16" fill="#14213d"/><rect x="151" y="146" width="6" height="16" fill="#14213d"/>
 <text x="150" y="194" text-anchor="middle" font-size="15" font-family="Fredoka,sans-serif" fill="#14213d">${mid?"midday":"morning"}</text></svg>`}
function arrowSVG(d){ const r={right:0,left:180,straight:-90}[d];
 return `<svg viewBox="0 0 200 200" role="img" aria-label="arrow"><circle cx="100" cy="100" r="90" fill="#16a34a"/><g transform="rotate(${r} 100 100)"><path d="M45 88 h70 v-28 l45 40 l-45 40 v-28 h-70z" fill="#fff"/></g></svg>`}
function plantSVG(){ return `<svg viewBox="0 0 220 220" role="img" aria-label="plant"><rect y="140" width="220" height="80" fill="#8a5a2b"/>
 <path d="M110 140 v-80" stroke="#16a34a" stroke-width="8"/><ellipse cx="80" cy="100" rx="26" ry="11" fill="#22c55e" transform="rotate(-25 80 100)"/><ellipse cx="140" cy="90" rx="26" ry="11" fill="#22c55e" transform="rotate(25 140 90)"/>
 <g fill="#f472b6">${[0,72,144,216,288].map(a=>`<circle cx="${110+14*Math.sin(a*Math.PI/180)}" cy="${48-14*Math.cos(a*Math.PI/180)}" r="11"/>`).join("")}</g><circle cx="110" cy="48" r="8" fill="#ffd23f"/>
 <path d="M110 140 q-10 25 -35 40 M110 140 q5 30 0 55 M110 140 q15 25 40 35" stroke="#f5deb3" stroke-width="5" fill="none"/>
 <text x="190" y="188" font-size="22" text-anchor="middle">❓</text><path d="M178 185 L150 176" stroke="#fff" stroke-width="3"/></svg>`}
function pic(img){
 if(!img) return "";
 if(typeof img==="string") return `<div class="pic"><div class="emo">${img}</div></div>`;
 let h="";
 if(img.clock) h=clockSVG(...img.clock);
 else if(img.shape) h=shapeSVG(img.shape,img.color,img.big);
 else if(img.prep) h=prepSVG(img.prep);
 else if(img.shadow) h=shadowSVG(img.shadow);
 else if(img.arrow) h=arrowSVG(img.arrow);
 else if(img.plant) h=plantSVG();
 else if(img.text) h=`<div class="read">📖 ${esc(img.text)}</div>`;
 return `<div class="pic">${h}</div>`}

/* ---------- state ---------- */
let S = null;
const allUnits = () => UNITS.concat(REVIEWS);
const findUnit = id => UNITS.find(u=>u.id===id);

function home(){
 try{speechSynthesis.cancel()}catch(e){}
 const card = u => `<button class="unit" data-go="${u.id}"><span class="ic" style="background:${u.color}22">${u.icon}</span><span><b>${u.n}</b><span class="t">${esc(u.title)}</span><span class="stars" aria-label="best score">${stars(best[u.id])}${best[u.id]!=null?` <span style="color:var(--muted)">${best[u.id]}/10</span>`:""}</span></span></button>`;
 app.innerHTML = `<header><span class="logo">📘</span><div><h1>Global English 2 – Review</h1><p class="sub">Choose a unit. Answer the questions. See your score! <span class="vn">· Chọn bài để ôn tập, chấm điểm và xem phân tích lỗi sai.</span></p></div></header>
 <div class="grid">${UNITS.map(card).join("")}</div>
 <h2>Check your progress</h2><div class="grid">${REVIEWS.map(card).join("")}
 <button class="unit" data-go="words"><span class="ic" style="background:#db277722">🔊</span><span><b>Game</b><span class="t">Picture words – listen and tap</span><span class="stars">${stars(best.words)}${best.words!=null?` <span style="color:var(--muted)">${best.words}/10</span>`:""}</span></span></button></div>
 <p class="vn" style="margin-top:22px">Mẹo: bấm 🔊 để nghe câu hỏi. Điểm cao nhất của mỗi bài được lưu trên trình duyệt này.</p>`;
 app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>start(b.dataset.go));
 window.scrollTo(0,0)}

function start(id, retry){
 let unit, qs;
 if(id==="words"){ unit={id:"words",n:"Game",title:"Picture words",color:"#db2777"};
  qs = shuffle(WORDS).slice(0,12).map(w=>({t:"listen",s:"listening",say:w.w,q:"Listen and tap the picture.",o:[w].concat(shuffle(WORDS.filter(x=>x.w!==w.w)).slice(0,3)).map(x=>x.e+"|"+x.w),e:`You heard “${w.w}”.`}));
 } else if(id[0]==="c"){ unit=REVIEWS.find(r=>r.id===id);
  qs = shuffle(unit.from.flatMap(u=>findUnit(u).q.map(q=>({...q,u})))).slice(0,15);
 } else { unit=findUnit(id); qs=shuffle(unit.q.map(q=>({...q,u:id}))) }
 if(retry) qs = shuffle(retry);
 qs = qs.map(q=>{ const c={...q}; if(c.t==="mc"||c.t==="listen"){c.right=c.o[0]; c.opts=shuffle(c.o)} if(c.t==="tf"){c.right=c.o[c.a]; c.opts=c.o}
  if(c.t==="order"){const sp=c.split||" "; c.parts=c.a.split(sp).map(x=>x.trim()); c.right=c.parts.join(sp===" "?" ":" → "); let sh; do{sh=shuffle(c.parts)}while(c.parts.length>1&&sh.join()==c.parts.join()); c.pool=sh}
  if(c.t==="fill") c.right=c.a[0]; return c});
 S={unit,qs,i:0,ans:[],retry:!!retry}; question()}

function question(){
 const q=S.qs[S.i], n=S.qs.length, u=S.unit;
 const isPic = (q.opts||[]).some(o=>o.includes("|"));
 const optHTML = o => { const [e,w]=o.includes("|")?o.split("|"):[null,o];
  return e ? `<button class="opt" data-v="${esc(o)}"><span class="e">${e}</span><span class="w ${q.t==="listen"?"hidden":""}">${esc(w)}</span></button>` : `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>` };
 let body="";
 if(q.t==="listen") body = `<div class="pic"><button class="big-listen" id="play" aria-label="play sound">🔊</button></div>`;
 else body = pic(q.img);
 if(q.t==="mc"||q.t==="tf"||q.t==="listen") body += `<div class="opts ${isPic?"pics":""}">${q.opts.map(optHTML).join("")}</div>`;
 if(q.t==="fill") body += `<form class="fillrow" id="ff"><input id="fin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type here…" aria-label="your answer"><button class="main" type="submit">Check</button></form>`;
 if(q.t==="order") body += `<div class="tiles ans" id="ans" aria-label="your answer"></div><div class="tiles" id="pool">${q.pool.map((p,k)=>`<button class="tile" data-k="${k}">${esc(p)}</button>`).join("")}</div><div class="next" style="justify-content:flex-start"><button class="main" id="chk" disabled>Check</button></div>`;
 app.innerHTML = `<div class="top"><button class="ghost" id="back" aria-label="home">🏠</button><div class="bar"><i style="width:${S.i/n*100}%"></i></div><span class="count">${S.i+1} / ${n}</span></div>
 <div class="card"><p class="sub" style="margin:0 0 6px">${esc(u.n)} · ${esc(u.title)}${q.l?` · Lesson ${q.l}`:""}</p>
 <div class="qtext"><button class="say" id="rq" aria-label="read question">🔊</button><span>${esc(q.q)}</span></div>${body}
 <div class="fb" id="fb"></div><div class="next hidden" id="nx"><button class="main" id="nb">${S.i+1<n?"Next ➜":"See my score 🏁"}</button></div></div>`;
 $("#back").onclick=home;
 $("#rq").onclick=()=>speak(q.q+(q.t==="mc"||q.t==="tf"?". "+q.opts.map(o=>o.split("|").pop()).join(". "):""));
 if(q.t==="listen"){ $("#play").onclick=()=>speak(q.say,.8); setTimeout(()=>speak(q.say,.8),350) }
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b.dataset.v,b));
 if(q.t==="fill"){ const f=$("#fin"); f.focus(); $("#ff").onsubmit=e=>{e.preventDefault(); if(f.value.trim()) answer(f.value.trim())} }
 if(q.t==="order"){ const ans=$("#ans"),pool=$("#pool"),chk=$("#chk");
  const upd=()=>chk.disabled=pool.querySelectorAll(".tile").length>0;
  app.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{ if(t.disabled)return; (t.parentNode===pool?ans:pool).appendChild(t); upd() });
  chk.onclick=()=>answer([...ans.querySelectorAll(".tile")].map(t=>t.textContent).join(q.split?" → ":" ")) }
 $("#nb").onclick=()=>{ S.i++; S.i<S.qs.length?question():result() };
 window.scrollTo(0,0)}

function answer(v,btn){
 const q=S.qs[S.i]; let ok;
 if(q.t==="fill") ok=q.a.some(a=>norm(a)===norm(v));
 else if(q.t==="order") ok=norm(v)===norm(q.right);
 else ok=v===q.right;
 S.ans.push({q,given:v,ok});
 app.querySelectorAll(".opt,.tile,#chk,#fin,#ff button").forEach(b=>b.disabled=true);
 app.querySelectorAll(".opt").forEach(b=>{ if(b.dataset.v===q.right)b.classList.add("ok"); else if(b===btn)b.classList.add("bad"); const w=b.querySelector(".w"); if(w)w.classList.remove("hidden") });
 if(q.t==="fill") $("#fin").style.borderColor=ok?"var(--ok)":"var(--bad)";
 const shown = q.right.includes("|")?q.right.split("|")[1]:q.right;
 const fb=$("#fb"); fb.className="fb show pop "+(ok?"ok":"bad");
 fb.innerHTML = ok ? `<strong>✅ ${shuffle(["Great job!","Well done!","Super!","Excellent!","You got it!"])[0]}</strong><div>${esc(q.e||"")}</div>`
  : `<strong>❌ Not quite.</strong><div>The answer is: <b>${esc(shown)}</b></div><div>${esc(q.e||"")}</div>`;
 tone(ok); $("#nx").classList.remove("hidden"); $("#nb").focus({preventScroll:true});
 fb.scrollIntoView({behavior:"smooth",block:"nearest"})}

function result(){
 const n=S.ans.length, c=S.ans.filter(a=>a.ok).length, sc=Math.round(c/n*100)/10, pct=Math.round(c/n*100);
 if(!S.retry) saveBest(S.unit.id, sc);
 const by={}; S.ans.forEach(a=>{const k=a.q.s; by[k]=by[k]||{c:0,n:0}; by[k].n++; if(a.ok)by[k].c++});
 const skills=Object.keys(SK).filter(k=>by[k]);
 const weak=skills.filter(k=>by[k].c/by[k].n<.75).sort((a,b)=>by[a].c/by[a].n-by[b].c/by[b].n);
 const [msg,vn,col] = sc>=9?["Excellent! You are a star! 🌟","Xuất sắc! Con nắm bài rất chắc.","#16a34a"]: sc>=7?["Good work! 👍","Tốt! Còn vài chỗ cần ôn lại.","#3d8bff"]: sc>=5?["Nice try! Keep practising. 💪","Khá – cần luyện thêm các phần bên dưới.","#f59e0b"]:["Let's review and try again! 📚","Cần ôn lại bài cùng con rồi làm lại.","#e11d48"];
 const R=95, C=2*Math.PI*R;
 const wrong=S.ans.filter(a=>!a.ok);
 const lessons=[...new Set(wrong.map(a=>a.q.u+"|"+(a.q.l||"")))].filter(x=>!x.endsWith("|"));
 app.innerHTML = `<div class="top"><button class="ghost" id="back">🏠 Home</button><span class="count">${esc(S.unit.n)} · ${esc(S.unit.title)}</span></div>
 <div class="card"><div class="res"><div class="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="${R}" fill="none" stroke="var(--soft)" stroke-width="22"/><circle cx="110" cy="110" r="${R}" fill="none" stroke="${col}" stroke-width="22" stroke-linecap="round" stroke-dasharray="${C*c/n} ${C}"/></svg><div class="v"><div><b>${sc}</b><small>out of 10</small><small>${c}/${n} correct · ${pct}%</small></div></div></div>
 <div><h1 style="font-size:clamp(26px,4vw,36px)">${msg}</h1><p class="vn" style="font-size:17px">${vn}</p><div style="font-size:34px;color:#f59e0b">${stars(sc)}</div></div></div>
 <h2>Skills <span class="vn">· Kết quả theo kỹ năng</span></h2>
 ${skills.map(k=>{const p=Math.round(by[k].c/by[k].n*100);return `<div class="skill"><span>${SK[k][0]}<br><span class="vn">${SK[k][1]}</span></span><span class="track"><i style="width:${p}%;background:${p>=75?"var(--ok)":p>=50?"#f59e0b":"var(--bad)"}"></i></span><span class="pc">${by[k].c}/${by[k].n}</span></div>`}).join("")}
 <div class="advice"><b>What to practise · Nhận xét cho phụ huynh</b>
 ${weak.length? weak.map(k=>`<p style="margin:8px 0">• <b>${SK[k][0]}</b> (${by[k].c}/${by[k].n}): ${ADVICE[k][0]}<br><span class="vn">${SK[k][1]}: ${ADVICE[k][1]}</span></p>`).join("") : `<p style="margin:8px 0">All skills are strong. Try another unit! <br><span class="vn">Tất cả kỹ năng đều tốt (≥75%). Có thể chuyển sang bài tiếp theo.</span></p>`}
 ${lessons.length?`<p style="margin:8px 0">📖 Review these lessons in the book: <b>${lessons.map(x=>{const [u,l]=x.split("|");const p=pageOf(findUnit(u),l);return `Lesson ${l}${p?` (p.${p})`:""}`}).join(", ")}</b><br><span class="vn">Nên mở sách ôn lại các bài trên.</span></p>`:""}</div>
 ${wrong.length?`<h2>Mistakes (${wrong.length}) <span class="vn">· Các câu sai</span></h2>`+wrong.map(a=>{const q=a.q; const g=String(a.given).includes("|")?a.given.split("|")[1]:a.given; const r=q.right.includes("|")?q.right.split("|")[1]:q.right;
  return `<div class="mist"><div><b>${esc(q.q)}</b></div><div class="row"><span class="chip r">Your answer: ${esc(g)}</span><span class="chip g">Correct: ${esc(r)}</span><span class="chip">${SK[q.s][0]}${q.l?` · Lesson ${q.l}`:""}</span></div><div style="margin-top:6px">💡 ${esc(q.e||"")}</div></div>`}).join(""):`<h2>No mistakes! 🎉</h2>`}
 <div class="btns">${wrong.length?`<button class="main" id="redo">Practise my mistakes</button>`:""}<button class="ghost" id="again">Try the whole quiz again</button><button class="ghost" id="home2">Choose another unit</button></div></div>`;
 $("#back").onclick=home; $("#home2").onclick=home;
 $("#again").onclick=()=>start(S.unit.id);
 if(wrong.length) $("#redo").onclick=()=>{ const id=S.unit.id; start(id, wrong.map(a=>{const {right,opts,parts,pool,...rest}=a.q; return rest})); };
 if(sc>=9) speak("Excellent! You are a star!",1); else speak("You got "+c+" out of "+n,1);
 window.scrollTo(0,0)}

home();
}

</script>

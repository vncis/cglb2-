<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global English 2 Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: cheerful, calm, made for a 7-year-old and her parent
   IDEA: a sticker workbook – each unit is a bright tab, each question a page
   PICTURE: big emoji/SVG illustration on a soft card above the answers
   COLOUR and TYPE: sunshine yellow ground, deep ink blue, coral accent; Fredoka
   LAYOUT: home = unit grid; quiz = one column card; result = score ring + skill bars + mistake list */
:root{color-scheme:light dark;
 --bg:light-dark(#fff6d6,#14213d);--card:light-dark(#ffffff,#1e2d50);--ink:light-dark(#14213d,#f3f6ff);
 --soft:light-dark(#fdf0c2,#26375f);--muted:light-dark(#5a6482,#aab4d4);--line:light-dark(#efe1ad,#33466f);
 --acc:#ff5d5d;--ok:#16a34a;--bad:#e11d48;--okbg:light-dark(#dcfce7,#12432a);--badbg:light-dark(#ffe4e6,#4a1726)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Fredoka,"Segoe UI",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,14px) 48px}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
header .logo{font-size:44px;line-height:1}
h1{font-size:clamp(28px,5vw,42px);line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:24px;margin:26px 0 10px}
.sub{color:var(--muted);margin:4px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.unit{background:var(--card);border:0;border-radius:20px;padding:16px;text-align:left;display:flex;gap:12px;align-items:center;min-height:96px;box-shadow:0 3px 0 var(--line);transition:transform .15s}
.unit:hover{transform:translateY(-2px)}
.unit .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:32px;flex:none}
.unit b{display:block;font-size:14px;color:var(--muted);font-weight:500}
.unit span.t{display:block;font-weight:600;font-size:18px;line-height:1.2}
.stars{font-size:14px;letter-spacing:1px;margin-top:3px;color:#f59e0b}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ghost{background:var(--card);border:0;border-radius:14px;min-height:44px;padding:0 14px;box-shadow:0 2px 0 var(--line)}
.bar{flex:1;height:14px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .3s}
.count{font-weight:600;white-space:nowrap}
.card{background:var(--card);border-radius:26px;padding:clamp(16px,3vw,28px);box-shadow:0 4px 0 var(--line)}
.qtext{font-size:clamp(20px,3.4vw,26px);font-weight:600;line-height:1.3;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start}
.say{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--soft);font-size:22px}
.pic{background:var(--soft);border-radius:20px;min-height:170px;display:grid;place-items:center;margin-bottom:16px;padding:12px}
.pic .emo{font-size:clamp(80px,16vw,120px);line-height:1.1;text-align:center}
.pic svg{width:100%;max-width:260px;height:auto;max-height:230px}
.pic .read{font-size:19px;max-width:560px;background:var(--card);padding:14px 18px;border-radius:14px;border-left:6px solid var(--acc)}
.big-listen{width:120px;height:120px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:56px;box-shadow:0 6px 0 #c63b3b}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.opts.pics{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.opt{background:var(--card);border:3px solid var(--line);border-radius:18px;min-height:58px;padding:10px 14px;font-size:19px;text-align:left;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--acc)}
.pics .opt{text-align:center;display:grid;place-items:center;gap:4px;min-height:130px}
.pics .opt .e{font-size:58px;line-height:1}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fillrow{display:flex;gap:10px;flex-wrap:wrap}
.fillrow input{flex:1 1 200px;font:inherit;font-size:22px;padding:10px 16px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);min-height:58px}
.main{background:var(--acc);color:#fff;border:0;border-radius:16px;min-height:56px;padding:0 26px;font-size:19px;font-weight:600;box-shadow:0 4px 0 #c63b3b}
.main:disabled{opacity:.5}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:8px;border-radius:16px}
.tiles.ans{background:var(--soft);border:3px dashed var(--line);margin-bottom:10px}
.tile{background:var(--card);border:3px solid var(--line);border-radius:14px;min-height:46px;padding:4px 14px;font-size:19px}
.fb{margin-top:16px;border-radius:18px;padding:14px 18px;display:none}
.fb.show{display:block}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb strong{font-size:20px}
.next{margin-top:14px;display:flex;justify-content:flex-end}
.res{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:22px;align-items:center}
.ring{position:relative;width:220px;height:220px;margin:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-size:56px;line-height:1}.ring .v small{display:block;color:var(--muted)}
.skill{display:grid;grid-template-columns:8.5em minmax(0,1fr) 3.5em;gap:10px;align-items:center;margin:8px 0}
.skill .track{height:16px;background:var(--soft);border-radius:9px;overflow:hidden}
.skill .track i{display:block;height:100%;border-radius:9px}
.skill .pc{text-align:right;font-weight:600;white-space:nowrap}
.vn{color:var(--muted);font-size:15px}
.mist{background:var(--card);border-radius:18px;padding:14px 16px;margin:10px 0;border-left:6px solid var(--bad)}
.mist .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{border-radius:10px;padding:2px 10px;font-size:15px;background:var(--soft)}
.chip.r{background:var(--badbg)}.chip.g{background:var(--okbg)}
.advice{background:var(--soft);border-radius:18px;padding:14px 18px;margin-top:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hidden{display:none}
@media(max-width:600px){.res{grid-template-columns:1fr}.ring{width:180px;height:180px}.skill{grid-template-columns:6.5em minmax(0,1fr) 3em}}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chipopt{min-height:48px;padding:6px 14px;font-size:18px;border-radius:14px;text-align:center}
.sech{margin:0 0 10px;font-weight:600;color:var(--acc)}.sech span{color:var(--muted);font-weight:400}
.passage{background:var(--soft);border-radius:18px;padding:12px 16px;margin-bottom:14px;border-left:6px solid var(--acc)}
.passage summary{font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:44px}
.passage p{margin:6px 0 4px;font-size:18px;line-height:1.6}
.say.sm{width:40px;height:40px;font-size:18px;background:var(--card)}
.opt.sel,.opt.sel:hover{border-color:#3d8bff;background:light-dark(#e0edff,#1d3a6b);box-shadow:0 0 0 3px #3d8bff55}
#cfrow{align-items:center;gap:12px;flex-wrap:wrap}
.full{display:flex;gap:10px;align-items:center;margin:10px 0 6px;font-size:19px;font-weight:600}
.trbtn{border:0;border-radius:12px;min-height:44px;padding:0 14px;background:var(--card);font-weight:500;margin:4px 0}
.vi{font-size:18px;background:var(--card);border-radius:12px;padding:8px 12px;margin:6px 0}
.why{margin-top:8px}
.sayl{color:inherit}
.spellhint{display:grid;gap:6px;margin-bottom:12px}
.hintw{font-size:clamp(24px,6vw,32px);letter-spacing:2px;font-weight:600;white-space:pre-wrap}
.diff{font-size:20px;margin:4px 0;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.diff b{display:inline-grid;place-items:center;min-width:26px;height:32px;border-radius:6px;font-weight:600}
.lg{background:var(--okbg);color:var(--ok)}.lb{background:#fecdd3;color:#be123c}
.plist{display:grid;gap:10px}.part{min-height:72px;border:3px solid var(--line);box-shadow:none}
.ov{position:fixed;inset:0;background:#0007;display:grid;place-items:end center;z-index:50;padding:12px}
@media(min-width:600px){.ov{place-items:center}}
.sheet{background:var(--card);color:var(--ink);border-radius:24px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}
.sheet select{width:100%;font:inherit;font-size:17px;min-height:50px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px}
.lbl{display:block;font-weight:600;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{min-height:50px;border-radius:14px;border:3px solid var(--line);background:var(--card);font-size:16px}
.seg button.on{border-color:#3d8bff;background:light-dark(#e0edff,#1d3a6b);font-weight:600}
.vbtn{flex:none}@media(max-width:600px){.vbtn span{display:none}}
.tbox{display:flex;gap:12px;align-items:flex-start}
.tsvg{width:clamp(64px,16vw,96px);height:auto;flex:none}
.tsvg.talking .mouth{animation:talk .25s infinite alternate;transform-origin:60px 84px}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.6)}}
.bubble{position:relative;background:var(--soft);border-radius:20px;padding:12px 16px;font-size:clamp(18px,3.4vw,22px);font-weight:500;flex:1;line-height:1.4}
.bubble:before{content:"";position:absolute;left:-10px;top:22px;border:10px solid transparent;border-right-color:var(--soft);border-left:0}
.bbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.bbtn .trbtn{font-size:15px;min-height:40px}
.story{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:14px}
.story h3{margin:0 0 6px}.story p{font-size:clamp(18px,3.6vw,21px);line-height:1.7;margin:0}
.sent{cursor:pointer;border-radius:6px;padding:1px 2px;transition:background .2s}.sent.on{background:#fde68a;color:#14213d}
.wcard{text-align:center;background:var(--soft);border-radius:20px;padding:16px;margin-bottom:12px}
.wcard .emo{font-size:clamp(80px,18vw,120px);line-height:1.1}.ww{font-size:clamp(32px,8vw,48px);font-weight:700}
.ex{margin-top:8px;font-size:18px}.ex a{color:inherit}
.mic{display:grid;gap:8px;justify-items:center;margin:6px 0 4px}#micres{font-size:16px;text-align:center}
.scenebox{padding:0;overflow:hidden}.scenebox svg.scene{width:100%;max-width:520px;height:auto;max-height:none;display:block;border-radius:16px}
.hidetext p{filter:blur(6px);user-select:none;pointer-events:none}.hidetext .trbtn,.hidetext .btns{filter:none}
.showtxt{margin:4px 0 8px}
.relisten{background:var(--soft);border-radius:14px;padding:8px 12px;margin-bottom:12px}.relisten summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}.relisten p{font-size:17px;line-height:1.6}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.pop{animation:pop .35s}
</style>
</head>
<body>

 {t:"mc",s:"vocab",l:"2.2",q:"Equipment means …",img:"🧰",o:["the tools you need for a job","a kind of food","a badge"],e:"equipment = special tools you need for a job.",f:"Equipment means the tools you need for a job.",v:"Equipment nghĩa là dụng cụ cần cho một công việc."},
 {t:"mc",s:"phonics",l:"2.2",q:"How many syllables in 'sci-en-tist'?",img:"👏",o:["3","2","4"],e:"sci–en–tist: 3 claps.",f:"Scientist has 3 syllables.",v:"Từ scientist có 3 âm tiết."},

 {t:"mc",s:"vocab",l:"2.8",q:"Personal information is information about …",img:"🪪",o:["you","the weather","a robot"],e:"Your name, age, things you like doing… Keep it safe!",f:"Personal information is information about you.",v:"Thông tin cá nhân là thông tin về chính con."}
]},
{id:"p3", n:"Unit 3", title:"All about sounds", color:"#7c3aed", icon:"🔊", q:[
 {t:"mc",s:"vocab",l:"3.1",q:"A tongue-twister is …",img:"👅",o:["a short poem that is tricky to say fast","a kind of song for babies","a long story"],e:"Tongue-twisters repeat sounds: She sells seashells…",f:"A tongue-twister is a short poem that is tricky to say fast.",v:"Câu nói líu lưỡi là câu ngắn rất khó nói nhanh."},
 {t:"mc",s:"phonics",l:"3.1",q:"'She sells seashells by the seashore.' Which sound is repeated?",img:"🐚",o:["s / sh","b","t"],e:"s and sh are repeated again and again.",f:"In 'She sells seashells', the s and sh sounds are repeated.",v:"Trong câu này, âm s và sh được lặp lại."},
 {t:"mc",s:"vocab",l:"3.1",q:"A fossil is …",img:"🦴",o:["the remains of a very old plant or animal in rock","a kind of shell shop","a new toy"],e:"Mary Anning collected fossils by the sea.",f:"A fossil is the remains of a prehistoric plant or animal set in rock.",v:"Hóa thạch là dấu vết của cây hoặc động vật thời tiền sử trong đá."},

 {t:"mc",s:"phonics",l:"3.1",q:"Which word has the digraph ck?",o:["🧦|socks","🛍️|shop","🍟|chips"],e:"so-ck-s. shop has sh, chips has ch.",f:"Socks has the digraph ck.",v:"Từ socks (tất) có cặp chữ ck."},
 {t:"mc",s:"phonics",l:"3.1",q:"Which word has the digraph ch?",o:["🥢|chopsticks","🔒|locks","⛵|ship"],e:"ch-opsti-ck-s has ch (and ck too!).",f:"Chopsticks has the digraph ch.",v:"Từ chopsticks (đũa) có cặp chữ ch."},

 {t:"mc",s:"vocab",l:"3.3",q:"Which sound does a bee make?",img:"🐝",o:["buzz","splash","ding-ding"],e:"Bees buzz. Water splashes.",f:"A bee goes buzz.",v:"Con ong kêu vo ve."},
 {t:"mc",s:"vocab",l:"3.3",q:"Which word sounds like water?",img:"💦",o:["splash","buzz","clap"],e:"splash is a water sound.",f:"Splash is a water sound.",v:"Splash là tiếng nước bắn tung tóe."},

 {t:"mc",s:"reading",l:"3.4",q:"New Shoes: where does the child go?",img:"👟",o:["to a shoe store","to school","to the beach"],e:"One shoe, two shoes, I need new shoes! Off I go to the shoe store.",f:"The child goes to the shoe store.",v:"Bạn nhỏ đi đến cửa hàng giày."},
 {t:"mc",s:"grammar",l:"3.4",q:"Shoes ___ muddy places.",img:"🥾",o:["for","with","of"],e:"for tells the purpose (what it is used for).",v:"Giày dùng cho những nơi lầy lội."},
 {t:"mc",s:"grammar",l:"3.4",q:"Shoes ___ funny faces.",img:"🤡👞",o:["with","for","to"],e:"with gives an extra detail.",v:"Giày có hình mặt cười ngộ nghĩnh."},
 {t:"mc",s:"phonics",l:"3.5",q:"Which word rhymes with 'store'?",img:"🏪",o:["for","shoe","new"],e:"store – for – more rhyme.",f:"Store rhymes with for.",v:"Store vần với for."},
 {t:"mc",s:"reading",l:"3.5",q:"New Shoes Part 2: what are the special shoes for?",img:"🏃‍♀️💨",o:["to run and race with the wind","to sleep in","to visit aunts for tea"],e:"To play, to run, to race with the wind and never lose!",f:"The special shoes are to run and race with the wind.",v:"Đôi giày đặc biệt để chạy và đua cùng gió."},
 {t:"listen",s:"listening",l:"3.3",say:"whisper",q:"Listen. Which word do you hear?",o:["whisper","shout","splash"],e:"You heard 'whisper'.",v:"whisper = thì thầm."}
]},
{id:"p4", n:"Unit 4", title:"Long, long ago", color:"#16a34a", icon:"🐯", q:[

 {t:"mc",s:"reading",l:"4.1",q:"Sang Kancil told Tiger the muddy puddle was the king's …",img:"🟤",o:["chocolate sauce","drum","belt"],e:"Tiger tasted the muddy puddle. Yuk! He was tricked.",f:"Sang Kancil told Tiger the muddy puddle was the king's chocolate sauce.",v:"Sang Kancil bảo Hổ vũng bùn là nước sốt sô-cô-la của nhà vua."},

 {t:"fill",s:"grammar",l:"4.2",q:"Tiger ___ his sharp teeth. (bare)",img:"🐯",a:["bared"],e:"bare + d = bared (showed his teeth).",v:"Hổ nhe hàm răng sắc nhọn."},

 {t:"mc",s:"reading",l:"4.4",q:"The monster's hair is thick and white like …",img:"❄️",o:["snow","grass","fire"],e:"White as snow helps him hide.",f:"The monster's hair is thick and white like snow.",v:"Lông con quái vật dày và trắng như tuyết."},

 {t:"mc",s:"reading",l:"4.5",q:"Who swapped the wishing stick for an old piece of wood?",img:"🪵",o:["the old woodcutter","the monster","Ramay's mother"],e:"The woodcutter tricked Ramay while he was sleeping.",f:"The old woodcutter swapped the wishing stick.",v:"Ông tiều phu già đã tráo cây gậy ước."},

 {t:"order",s:"reading",l:"4.9",q:"What did Yoshi wish to be? Put them in order.",img:"🔄",a:"rich man | prince | sun | cloud | rock | man",split:"|",e:"A circular story: he ends where he started – a man.",v:"Người giàu → hoàng tử → mặt trời → đám mây → tảng đá → con người."},
 {t:"mc",s:"reading",l:"4.10",q:"What did the whisper in the wind always say?",img:"🌬️",o:["Your wish is granted.","Go away!","I am the sun."],e:"“Your wish is granted, Yoshi – a … you will be.”",f:"The whisper always said: Your wish is granted.",v:"Lời thì thầm trong gió luôn nói: Điều ước của con đã thành."},
 {t:"mc",s:"reading",l:"4.10",q:"How did Yoshi feel at the end?",img:"😊",o:["happy","angry","rich"],e:"He was poor again, but now he was happy.",f:"At the end Yoshi was happy.",v:"Cuối cùng Yoshi thấy hạnh phúc."},
 {t:"mc",s:"vocab",l:"4.11",q:"A circular story …",img:"⭕",o:["begins and ends in the same place","has no ending","is about circles"],e:"Yoshi starts as a stonecutter and ends as a stonecutter.",f:"A circular story begins and ends in the same place.",v:"Truyện vòng tròn bắt đầu và kết thúc ở cùng một chỗ."}
]},

  ["say","Now let's learn about commas in a list. A comma tells us to take a short pause.","Bây giờ học về dấu phẩy trong một danh sách. Dấu phẩy báo cho ta ngừng ngắn.","✏️"],
  ["say","We put a comma between the things in a list, and we put 'and' before the last thing. Example: I collect stickers, badges, pencils and feathers.","Ta đặt dấu phẩy giữa các thứ trong danh sách, và dùng 'and' trước thứ cuối cùng.","📝"],
  ["mc","Which list is correct?",["I like apples, pears and bananas.","I like apples pears, and, bananas.","I like, apples pears bananas."],"Commas between the items, 'and' before the last one.","Dấu phẩy giữa các thứ, 'and' trước thứ cuối.","🍎🍐🍌"],
  ["say","Verbs ending in -ing tell us what is happening now. Verbs ending in -ed tell us what happened in the past.","Động từ đuôi -ing nói việc đang xảy ra. Động từ đuôi -ed nói việc đã xảy ra.","⏰"],
  ["speak","He is checking. He checked.","Cậu ấy đang kiểm tra. Cậu ấy đã kiểm tra."],
  ["fill","Yesterday I ___ in the garden. (jump)",["jumped"],"Past: jump + ed = jumped.","Quá khứ: jump + ed = jumped (đã nhảy).","🦘"],
  ["mc","Be careful! Some verbs are irregular. fly → he ___",["flew","flyed","flying"],"fly → flew.","fly (bay) → flew (đã bay).","🕊️"],
  ["say","Speech marks show the words someone says. They look like this: “ ”.","Dấu ngoặc kép cho biết lời ai đó nói. Chúng trông như thế này: “ ”.","💬"],
  ["mc","Which one is correct?",["“I don't like peas,” said Daisy.","I don't like peas, “said Daisy.”","“I don't” like peas, said Daisy."],"Only Daisy's words go inside the speech marks.","Chỉ lời của Daisy nằm trong ngoặc kép.","🫛"],
  ["mc","Which sentence needs a question mark (?)",["What are you going to make","Leave the pudding alone","It's time for bed"],"It asks something, so it ends with ?","Câu này hỏi, nên kết thúc bằng dấu ?","❓"],
  ["say","Well done! You finished Unit 1. Now you can do the review quiz.","Giỏi lắm! Con đã học xong Unit 1. Giờ con có thể làm bài ôn tập.","🌟"]
 ]}
]},
{u:"2", title:"Badges", icon:"🏅", color:"#3d8bff", parts:[
 {n:"Story time", icon:"📖", steps:[
  ["say","Welcome to Unit 2: Badges! This unit is about instructions. Instructions tell us what to do.","Chào mừng đến Unit 2: Huy hiệu! Bài này về hướng dẫn. Hướng dẫn cho ta biết phải làm gì.","🏅"],
  ["say","Look at this sign. It tells you: cross the road now. Signs are instructions too!","Nhìn biển này. Nó nói: bây giờ hãy qua đường. Biển báo cũng là hướng dẫn!","🚸"],
  ["word","scientist","🧑‍🔬","nhà khoa học","Scientists learn about the world."],
  ["word","experiment","🧪","thí nghiệm","An experiment is a test to find out what happens."],
  ["read","How to be a Science Champion","Rule 1: Observe things carefully. Use all your senses. Rule 2: Ask questions, like Why? and How? Rule 3: Find out what will happen. Rule 4: Predict. Think about what might happen before you start. Rule 5: Set up an experiment. Rule 6: Record your results in a science notebook.","6 quy tắc: 1 Quan sát kỹ. 2 Đặt câu hỏi. 3 Tìm hiểu điều sẽ xảy ra. 4 Dự đoán. 5 Làm thí nghiệm. 6 Ghi lại kết quả vào vở.","🔬📓"],
  ["mc","Rule 1 says: ___ things carefully.",["Observe","Throw","Eat"],"Observe = look carefully and use all your senses.","Observe = quan sát thật kỹ.","🔍"],
  ["mc","What does 'predict' mean?",["think about what might happen","write a story","wash your hands"],"Before an experiment, we predict.","Trước khi làm thí nghiệm, ta dự đoán.","🤔"],
  ["read","How to Blow Bubbles","What you need: a bowl, water, bubble bath and a straw. First, half fill a bowl with water. Next, pour a bit of bubble bath into the water. Then put a straw into the water and blow. Bubbles! Water on its own cannot hold the air. The soap makes the water stretchy.","Cần: bát, nước, sữa tắm tạo bọt, ống hút. Đổ nửa bát nước, cho chút sữa tắm, cắm ống hút và thổi. Xà phòng làm nước co giãn nên giữ được không khí – ra bong bóng!","🫧"],
  ["order","Put the steps in order.","Half fill a bowl with water | Pour bubble bath into the water | Put a straw in and blow","Water, then soap, then blow!","Nước → xà phòng → thổi!","|"],
  ["mc","Why do we need soap?",["It makes the water stretchy.","It makes the water hot.","It makes the water blue."],"Stretchy water can hold air and make bubbles.","Nước co giãn giữ được không khí, tạo bong bóng.","🧴"],
  ["speak","First, half fill a bowl with water.","Đầu tiên, đổ nửa bát nước."]
 ]},
 {n:"New words", icon:"🔤", steps:[
  ["say","Let's learn the new words for Unit 2.","Học từ mới của Unit 2 nào.","🔤"],
  ["word","badge","🏅","huy hiệu","I won a reading badge!"],
  ["word","equipment","🧰","dụng cụ","What equipment do you need?"],
  ["word","bubbles","🫧","bong bóng","Blow bubbles with a straw."],

  ["word","bowl","🥣","cái bát","Half fill a bowl with water."],
  ["word","notebook","📓","quyển vở","Write your results in a notebook."],
  ["word","oil","🫗","dầu","Oil floats on water."],
  ["listen","straw",["🥤|straw","🥣|bowl","🏅|badge"],"A straw – you can blow through it.","Ống hút – có thể thổi qua nó."],
  ["listen","badge",["🏅|badge","📓|notebook","🫧|bubbles"],"A badge – you can wear it.","Huy hiệu – có thể đeo lên áo."],
  ["fill","Spell it: 🫧 b _ _ _ _ _ s",["bubbles"],"B-U-B-B-L-E-S.","Bong bóng: bubbles."]
 ]},
 {n:"Language", icon:"✏️", steps:[
  ["say","Instructions use command words. A command tells us what to do: Put, Pour, Wash, Mix.","Bài hướng dẫn dùng động từ mệnh lệnh: Put (đặt), Pour (đổ), Wash (rửa), Mix (trộn).","✋"],
  ["mc","Which word is a command?",["Wash","Happy","Blue"],"Wash your hands! It tells you what to do.","Wash your hands! – Hãy rửa tay!","🧼"],
  ["say","We use linking words to show the order: first, next, after, finally.","Ta dùng từ nối để chỉ thứ tự: first (đầu tiên), next (tiếp theo), after (sau đó), finally (cuối cùng).","1️⃣"],
  ["order","Put the words in order.","first next after finally","first → next → after → finally","Đầu tiên → tiếp theo → sau đó → cuối cùng"],
  ["say","Plurals: when there is more than one, we often add -s. But some words are different!","Số nhiều: khi có nhiều hơn một, ta thường thêm -s. Nhưng có từ đặc biệt!","📚"],
  ["fill","1 story, 3 ___",["stories"],"story → stories: change y to ies.","story → stories: đổi y thành ies.","📚"],
  ["mc","1 child, 2 ___",["children","childs","childes"],"child → children.","child (đứa trẻ) → children.","🧒🧒"],
  ["say","Words have syllables. Clap them! sci – en – tist has three claps.","Từ có âm tiết. Vỗ tay theo nhé! sci – en – tist có ba tiếng vỗ.","👏"],
  ["mc","How many syllables in 'ex-per-i-ment'?",["4","2","3"],"ex – per – i – ment: 4 claps.","ex – per – i – ment: 4 tiếng vỗ.","👏"],
  ["say","Great job! You are a Science Champion!","Làm tốt lắm! Con là Nhà vô địch Khoa học!","🏆"]
 ]}
]},
{u:"3", title:"All about sounds", icon:"🔊", color:"#7c3aed", parts:[
 {n:"Story time", icon:"📖", steps:[
  ["say","Unit 3 is all about sounds! We will read tongue-twisters, chants and poems.","Unit 3 nói về âm thanh! Mình sẽ đọc câu líu lưỡi, bài chant và bài thơ.","🔊"],
  ["word","tongue-twister","👅","câu nói líu lưỡi","Say a tongue-twister fast!"],
  ["read","She Sells Seashells","She sells seashells by the seashore. The shells she sells are seashells, I'm sure. So if she sells seashells on the seashore, then I'm sure she sells seashore shells.","Cô ấy bán vỏ sò bên bờ biển. Vỏ cô bán chắc chắn là vỏ sò biển. (Câu này khó nói nhanh vì lặp âm s và sh.)","🐚🏖️"],
  ["mc","Which sounds are repeated?",["s and sh","b and p","m and n"],"She sells seashells – lots of s and sh!","Lặp lại rất nhiều âm s và sh!","🐚"],
  ["speak","She sells seashells by the seashore.","Cô ấy bán vỏ sò bên bờ biển."],
  ["say","A chant is words we say or sing in a repeated pattern. We can clap as we chant!","Chant là những từ đọc hoặc hát theo nhịp lặp lại. Mình vừa đọc vừa vỗ tay!","👏"],
  ["read","My own chant","What do we want? Clap, clap, clap! Give us a P! Clap, clap, clap! Give us an O! Clap, clap, clap! What do we want? POETRY! Yes!","Bài chant của cô: Chúng ta muốn gì? Vỗ tay! Cho cô chữ P! Cho cô chữ O!... Chúng ta muốn THƠ! Đúng rồi!","📣"],
  ["mc","What do we do in this chant?",["clap","sleep","swim"],"We clap clap clap!","Mình vỗ tay!","👏"],
  ["read","New Shoes (the story)","A child needs new shoes. The child goes to a shoe store. The salesman sells shoes with laces, shoes with funny faces and shoes for muddy places. But none of them are right! At the next store there are shoes with buckles and bows. No! At last the child finds magic shoes for running and racing with the wind.","Một bạn nhỏ cần giày mới. Người bán giới thiệu giày có dây, giày mặt cười, giày đi chỗ lầy... nhưng không đôi nào hợp! Cuối cùng bạn tìm được đôi giày thần kỳ để chạy đua cùng gió.","👟"],
  ["mc","What does the child want shoes for?",["running and racing","sleeping","swimming"],"Shoes to run and race with the wind!","Giày để chạy đua cùng gió!","🏃‍♀️💨"]
 ]},
 {n:"New words", icon:"🔤", steps:[

  ["word","buzz","🐝","vo ve","Bees buzz."],

  ["word","shoes","👟","đôi giày","I need new shoes."],
  ["word","socks","🧦","đôi tất","Sharkskin socks!"],
  ["listen","splash",["💦|splash","🐝|buzz","🤫|whisper"],"Splash is a water sound.","Splash là tiếng nước."],
  ["listen","buzz",["🐝|buzz","📢|shout","👟|shoes"],"Bees buzz!","Ong kêu vo ve!"],
  ["fill","Spell it: 🧦 s _ _ k s",["socks"],"S-O-C-K-S. It has ck!","Tất: socks – có ck!"]

 {n:"Language", icon:"✏️", steps:[
  ["say","A digraph is two letters that make one sound. Like sh, ck and ch.","Digraph là hai chữ cái tạo một âm, như sh, ck, ch.","🔤"],
  ["speak","shop, socks, chips","cửa hàng, đôi tất, khoai tây chiên"],
  ["mc","Which word has sh?",["shop","chips","lock"],"sh-op.","shop có sh.","🛍️"],
  ["mc","Which word has ck?",["lock","ship","chop"],"lo-ck.","lock có ck.","🔒"],
  ["mc","Which word has ch?",["chips","sock","shell"],"ch-ips.","chips có ch.","🍟"],
  ["say","In the poem New Shoes we use 'for' to say what something is used for, and 'with' to give extra detail.","Trong bài New Shoes, 'for' cho biết dùng để làm gì, 'with' thêm chi tiết.","👞"],
  ["mc","Boots ___ muddy places.",["for","with"],"for = what they are used for.","for = dùng cho việc gì.","🥾"],

  ["say","Fantastic! Your ears are super sharp!","Tuyệt vời! Tai của con rất thính!","👂🌟"]
 ]}
]},
{u:"4", title:"Long, long ago", icon:"🐯", color:"#16a34a", parts:[
 {n:"Story time", icon:"📖", steps:[
  ["say","Unit 4: Long, long ago. We will read traditional tales – stories told again and again for many years.","Unit 4: Ngày xửa ngày xưa. Mình đọc truyện cổ – những câu chuyện được kể đi kể lại nhiều năm.","📜"],
  ["word","mouse deer","🦌","hươu chuột (loài hươu tí hon)","Sang Kancil is a mouse deer."],
  ["word","sly","😏","ranh mãnh","Sang Kancil is sly and clever."],
  ["read","Sang Kancil and the Tiger","Long ago in the jungle lived a mouse deer called Sang Kancil. He was sly and clever. One morning Tiger said, 'I'm going to eat you for breakfast!' Sang Kancil thought quickly. 'You can't eat me. The king asked me to look after his chocolate sauce.' Tiger wanted to taste it. Sang Kancil ran away into the jungle. Tiger tasted the muddy puddle. 'Yuk! This isn't chocolate sauce. I've been tricked!'","Chú hươu chuột Sang Kancil rất ranh mãnh. Hổ muốn ăn thịt chú. Chú bảo vũng bùn là 'nước sốt sô-cô-la của vua'. Hổ nếm thử bùn – Eo ơi! Bị lừa rồi!","🐯🦌"],
  ["mc","What did Tiger want to do?",["eat Sang Kancil","play a game","sleep"],"Tiger wanted Sang Kancil for breakfast!","Hổ muốn ăn Sang Kancil làm bữa sáng!","🐯"],
  ["mc","What was the 'chocolate sauce' really?",["a muddy puddle","a cake","honey"],"Yuk! It was mud!","Eo! Đó là bùn!","🟤"],
  ["say","Later, Sang Kancil tricked Tiger again! The king's 'drum' was a bee's nest. Ouch! And the king's 'belt' was a sleeping cobra! Three tricks!","Sau đó Sang Kancil còn lừa Hổ nữa! 'Cái trống' là tổ ong. Ui da! 'Thắt lưng' là rắn hổ mang đang ngủ! Ba lần lừa!","🐝🐍"],
  ["mc","What was the king's 'drum'?",["a bee's nest","a coconut","a rock"],"Tiger banged it – bees! Ouch!","Hổ đập vào – ong đốt! Ui da!","🐝"],
  ["read","Yoshi the Stonecutter","Long ago in the mountains of Japan lived a poor stonecutter called Yoshi. 'I wish I could be a rich man,' he said. A whisper in the wind said, 'Your wish is granted!' Then he wished to be a prince, then the sun, then a cloud, then a rock. But a stonecutter cut the rock! 'I wish I could be a man again.' Yoshi became a stonecutter again – and now he was happy.","Yoshi là thợ đẽo đá nghèo ở Nhật Bản. Ông ước thành người giàu, hoàng tử, mặt trời, đám mây, tảng đá... Cuối cùng ông lại là thợ đẽo đá – và giờ ông hạnh phúc.","⛰️🔄"],
  ["mc","How does Yoshi feel at the end?",["happy","angry","rich"],"He learned to be happy with who he is.","Ông học được cách hài lòng với chính mình.","😊"],
  ["speak","Your wish is granted.","Điều ước của con đã thành sự thật."]
 ]},
 {n:"New words", icon:"🔤", steps:[
  ["say","New words for Unit 4. Listen and say!","Từ mới Unit 4. Nghe và nói theo nhé!","🔤"],
  ["word","pygmy","🐘","loài lùn, nhỏ hơn bình thường","A pygmy elephant is small."],
  ["word","puddle","🟤","vũng nước","Tiger tasted the muddy puddle."],
  ["word","trick","🎩","lừa, mẹo","Sang Kancil played a trick."],
  ["word","cobra","🐍","rắn hổ mang","The cobra hissed!"],
  ["word","monster","👹","quái vật","The Abominable Snowman is a monster."],
  ["word","wish","🌠","điều ước","Make a wish!"],
  ["word","cloud","☁️","đám mây","Yoshi became a cloud."],
  ["listen","cobra",["🐍|cobra","🐯|tiger","🦌|deer"],"A cobra is a snake.","Cobra là rắn hổ mang."],
  ["listen","cloud",["☁️|cloud","⛰️|rock","☀️|sun"],"A cloud is in the sky.","Đám mây ở trên trời."],
  ["fill","Spell it: 🐯 t _ _ _ r",["tiger"],"T-I-G-E-R.","Con hổ: tiger."]
 ]},
 {n:"Language", icon:"✏️", steps:[
  ["say","Adjectives describe nouns. They make our sentences more interesting.","Tính từ mô tả danh từ. Chúng làm câu văn hay hơn.","🎨"],
  ["say","The monster's hair. The monster's hair is thick. The monster's hair is thick and white like snow!","Tóc quái vật. Tóc quái vật dày. Tóc quái vật dày và trắng như tuyết!","❄️"],
  ["mc","Which word is an adjective?",["muddy","puddle","Tiger"],"muddy describes the puddle.","muddy (lầy lội) mô tả vũng nước.","🟤"],
  ["say","Connectives join sentences: and, but, so, because.","Từ nối giúp nối câu: and, but, so, because.","🔗"],
  ["mc","Ramay was tired ___ he asked to stay the night.",["so","but","or"],"so = because of that.","so = vì vậy.","😴"],
  ["mc","Ramay asked the stick for gold, ___ nothing happened.",["but","so","because"],"but shows a surprise.","but = nhưng.","💰"],
  ["say","We use the past tense for stories from long ago: walk → walked, see → saw.","Dùng thì quá khứ cho chuyện ngày xưa: walk → walked, see → saw.","📜"],
  ["fill","Yoshi ___ the rich man's home. (love)",["loved"],"love + d = loved.","love → loved (đã yêu thích).","🏠"],
  ["mc","A cool wind ___. (blow)",["blew","blowed","blows"],"blow → blew.","blow (thổi) → blew.","🌬️"],
  ["say","Super! You know how to tell a traditional tale!","Tuyệt! Con biết kể truyện cổ rồi!","🌟"]
 ]}
]},
{u:"5", title:"Computers and robots", icon:"🤖", color:"#0891b2", parts:[
 {n:"Story time", icon:"📖", steps:[
  ["say","Beep beep! Unit 5 is about computers and robots.","Bíp bíp! Unit 5 nói về máy tính và rô-bốt.","🤖"],
  ["word","computer","💻","máy tính","Computers work with information."],
  ["read","The first computers","One of the first computers was made two thousand years ago. It could work out where the moon and stars would be. Four hundred years ago, a man called Pascal made a calculator to do simple sums. Later, computers used electricity to work faster. Now computers are everywhere!","Một trong những máy tính đầu tiên có từ 2000 năm trước. 400 năm trước, Pascal làm máy tính cộng trừ. Sau này máy tính dùng điện để chạy nhanh hơn. Giờ máy tính ở khắp nơi!","🧮"],
  ["mc","What did Pascal make?",["a calculator","a robot","a drone"],"It did simple sums.","Nó làm phép tính đơn giản.","🧮"],
  ["read","Robots","A robot is a machine controlled by a computer. Robots are good at doing the same thing again and again. They don't get bored and they don't get tired. Pepper is a friendly robot that looks like a person. It helps people in shops, hotels and airports. It has cameras to see, and wheels in its feet to move.","Rô-bốt là máy do máy tính điều khiển. Rô-bốt không chán, không mệt. Pepper là rô-bốt thân thiện giống người, có camera để nhìn và bánh xe ở chân để di chuyển.","🤖"],
  ["mc","Why are robots good workers?",["They don't get bored or tired.","They sleep a lot.","They are very small."],"They can work all day!","Chúng làm việc cả ngày!","🏭"],
  ["mc","Why does Pepper have wheels?",["to move around","to see","to hear"],"Wheels in its feet help it move.","Bánh xe ở chân giúp nó di chuyển.","🛞"],
  ["read","Drones","A drone is a robot that flies. Some drones are as big as planes. Some are so small they fit on your hand. Drones don't have people in them, so they can go to dangerous places. Liang is learning to fly his drone. Now he can make it hover in one place!","Drone là rô-bốt biết bay. Có cái to như máy bay, có cái nhỏ vừa bàn tay. Không có người bên trong nên có thể đến nơi nguy hiểm. Liang đang tập lái drone.","🛸"],
  ["mc","What does 'hover' mean?",["stay in one place in the air","fall down","swim"],"Liang's drone can hover.","Drone của Liang bay lơ lửng được.","🚁"],
  ["speak","A robot is a machine controlled by a computer.","Rô-bốt là một cỗ máy được máy tính điều khiển."]
 ]},

  ["say","Computer words! Listen and repeat.","Từ vựng về máy tính! Nghe và nhắc lại.","🔤"],
  ["word","robot","🤖","rô-bốt","The robot helps people."],

  ["word","sensor","📷","cảm biến","The robot has sensors."],
  ["word","drone","🛸","máy bay không người lái","My drone can fly."],

  ["listen","drone",["🛸|drone","🤖|robot","💻|computer"],"A drone flies.","Drone biết bay."],
  ["listen","sensor",["📷|sensor","🧮|calculator","🛞|wheel"],"Sensors help robots see and hear.","Cảm biến giúp rô-bốt nhìn và nghe."],
  ["fill","Spell it: 🤖 r _ _ _ t",["robot"],"R-O-B-O-T.","Rô-bốt: robot."]
 ]},
 {n:"Language", icon:"✏️", steps:[
  ["say","A noun names something: computer, toy, phone. An adjective describes it: new, clever, good.","Danh từ gọi tên sự vật: computer, toy. Tính từ mô tả: new, clever.","🏷️"],
  ["mc","Which word is an adjective?",["clever","toy","phone"],"a clever toy – clever describes the toy.","clever mô tả đồ chơi.","✨"],
  ["say","We can say 'a clever toy' or 'The toy is clever.' Both are correct!","Có thể nói 'a clever toy' hoặc 'The toy is clever.' Cả hai đều đúng!","🧸"],
  ["say","The prefixes un- and dis- give the opposite meaning: happy → unhappy, agree → disagree.","Tiền tố un- và dis- tạo nghĩa ngược lại: happy → unhappy, agree → disagree.","🔄"],
  ["fill","un + kind = ___",["unkind"],"unkind = not kind.","unkind = không tử tế.","🙁"],
  ["mc","The opposite of 'like' is …",["dislike","unlike","likedis"],"dis + like = dislike.","dislike = không thích.","👎"],
  ["say","Present tense: one robot → The robot moves. Many robots → The robots move.","Một rô-bốt: moves (thêm s). Nhiều rô-bốt: move.","🤖🤖"],
  ["mc","The robot ___ people.",["helps","help"],"One robot → add -s.","Một rô-bốt → thêm -s.","🤖"],
  ["mc","The robots ___ people.",["help","helps"],"Many robots → no -s.","Nhiều rô-bốt → không thêm -s.","🤖🤖"],
  ["say","Beep beep! Excellent work, little coder!","Bíp bíp! Lập trình viên nhí giỏi lắm!","💻🌟"]
 ]}
]},
{u:"6", title:"On a journey", icon:"🧭", color:"#e11d48", parts:[
 {n:"Story time", icon:"📖", steps:[
  ["say","Unit 6 is full of poems about journeys. A poet is someone who writes poems.","Unit 6 có nhiều bài thơ về những chuyến đi. Nhà thơ là người viết thơ.","🧭"],
  ["say","In Busy Day by Michael Rosen, the word 'pop' is repeated again and again: pop in, pop out, pop over the road!","Trong bài Busy Day của Michael Rosen, từ 'pop' lặp lại nhiều lần: pop in, pop out, pop over the road!","🎈"],
  ["mc","Which word is repeated in Busy Day?",["pop","stop","shop"],"Repetition makes the poem fun.","Sự lặp lại làm bài thơ vui.","🎈"],
  ["say","Downhill Racer is a shape poem. The words go down the page like a skier going down a mountain!","Downhill Racer là thơ hình ảnh. Chữ chạy xuống trang như người trượt tuyết xuống núi!","⛷️"],
  ["read","My shape poem","Down … the … snow … we … slide. From side to side we glide. Look out! Here comes a poem in a hurry!","Bài thơ của cô: Trượt xuống tuyết, lướt sang hai bên. Coi chừng! Một bài thơ đang vội tới!","⛷️❄️"],
  ["mc","What shape does Downhill Racer make?",["a skier going down a mountain","a box","a fish"],"The layout makes a picture.","Cách sắp xếp chữ tạo thành hình.","⛷️"],
  ["read","The River (what the poem says)","The poet Valerie Bloom says the river is like a person. The river is a winder: it twists and turns. It is a hoarder: it keeps little treasures. It is a baby: it gurgles and hums. And it is a singer: it dances along and sings.","Nhà thơ Valerie Bloom tả dòng sông như một con người: nó uốn lượn, cất giữ báu vật, ríu rít như em bé và hát như ca sĩ.","🌊"],
  ["mc","The river twists and turns. It is a …",["winder","singer","baby"],"winder = something that twists and turns.","winder = thứ uốn lượn.","🌊"],
  ["mc","The river gurgles and hums like a …",["baby","rock","box"],"Babies gurgle!","Em bé hay ríu rít!","👶"],
  ["speak","The river twists and turns.","Dòng sông uốn lượn quanh co."]
 ]},
 {n:"New words", icon:"🔤", steps:[
  ["say","Poem words! Listen and say.","Từ vựng về thơ! Nghe và nói.","🔤"],
  ["word","poet","🖋️","nhà thơ","Michael Rosen is a poet."],
  ["word","rhyme","🎵","vần","Pop rhymes with stop."],
  ["word","repetition","🔁","sự lặp lại","Busy Day has lots of repetition."],
  ["word","river","🌊","dòng sông","The river sings."],
  ["word","coconut","🥥","quả dừa","Coconuts fall off the palm trees."],
  ["word","box","📦","cái hộp","In Boxland, people live in boxes."],
  ["listen","coconut",["🥥|coconut","📦|box","🌊|river"],"Bounce! go the coconuts.","Dừa rơi bộp bộp!"],
  ["listen","rhyme",["🎵|rhyme","🖋️|poet","🔁|repetition"],"Rhyme: words with the same end sound.","Vần: các từ có âm cuối giống nhau."],
  ["fill","box + land = ___",["boxland"],"A compound word!","Từ ghép: boxland."]
 ]},
 {n:"Language", icon:"✏️", steps:[
  ["say","Rhyming words have the same sound at the end: walk – talk, see – tea.","Từ vần có âm cuối giống nhau: walk – talk, see – tea.","🎵"],
  ["mc","Which word rhymes with 'pop'?",["stop","walk","see"],"pop – stop – shop.","pop vần với stop.","🛑"],
  ["mc","Which word rhymes with 'walk'?",["talk","pop","tea"],"walk – talk.","walk vần với talk.","🚶"],
  ["say","Sound words make poems exciting: Bounce! Bang! Swish! Splash!","Từ tượng thanh làm thơ sinh động: Bounce! Bang! Swish! Splash!","💥"],
  ["mc","Which sound word goes with drums?",["Bang!","Swish!","Tweet!"],"Bang! go the steel drums.","Bùm! Tiếng trống.","🥁"],
  ["mc","Which sound word goes with birds?",["Tweet!","Bang!","Sink!"],"Tweet, tweet! go the birds.","Chíp chíp! Tiếng chim.","🐦"],
  ["say","A compound word is two small words joined together: sun + shine = sunshine.","Từ ghép là hai từ nhỏ ghép lại: sun + shine = sunshine.","🔗"],
  ["fill","foot + print = ___",["footprint"],"foot + print = footprint.","dấu chân: footprint.","👣"],
  ["say","Brilliant! You are a real poet now!","Xuất sắc! Con là nhà thơ thật sự rồi!","🖋️🌟"]
 ]}

{u:"7", title:"Stories by well-known authors", icon:"📚", color:"#ca8a04", parts:[
 {n:"Story time", icon:"📖", steps:[
  ["say","Unit 7: stories by famous authors. An author is a person who writes books.","Unit 7: truyện của các tác giả nổi tiếng. Tác giả là người viết sách.","📚"],
  ["word","setting","🏞️","bối cảnh (thời gian, nơi chốn)","The setting is where the story happens."],
  ["read","Sorry Isn't Good Enough","Omar, Pelo and Beno were playing catch at break time. Beno threw the ball to Omar. But Pelo pushed in front of him and grabbed the ball. Omar fell to the ground. 'That's not fair,' he said. Then the bell rang. Pelo and Beno ran back to class. Omar rubbed his sore knee.","Omar, Pelo và Beno chơi ném bóng. Pelo chen lên giành bóng làm Omar ngã. 'Thế là không công bằng,' Omar nói. Chuông reo, hai bạn chạy vào lớp, Omar xoa đầu gối đau.","⚾🤕"],
  ["mc","Why did Omar fall?",["Pelo pushed in front of him.","He slipped on water.","Beno pushed him."],"Pelo grabbed the ball.","Pelo giành bóng.","🤕"],
  ["mc","What should Pelo say to Omar?",["I'm sorry. Are you okay?","Go away!","Nothing."],"Saying sorry is kind.","Nói xin lỗi là tử tế.","🤝"],
  ["read","The Best Tailor in Pinbaué","Uncle Flores is a tailor in Pinbaué, Brazil. He makes clothes. But a factory made the village grey and dusty, and the river murky. People stopped buying his colourful clothes. His nephew Edinho found colourful materials in a drawer. 'You could make colourful curtains!' he said. 'That's not a bad idea,' said Uncle Flores.","Chú Flores là thợ may ở Brazil. Nhà máy làm làng xám xịt, sông đục ngầu. Cháu Edinho tìm thấy vải màu và gợi ý may rèm cửa nhiều màu. Chú thấy ý hay!","🧵🪟"],
  ["mc","What did Edinho suggest?",["colourful curtains","a new factory","a big boat"],"Curtains to make the village bright again.","Rèm màu làm làng tươi sáng lại.","🪟"],
  ["read","Little Albatross (beginning)","Mother and Father Albatross saw that Little Albatross was big and strong. So they flew away to go fishing. They did not see the killer bird. But the killer bird saw them. It was watching. It was waiting. 'Come back!' cried Little Albatross.","Bố mẹ hải âu thấy con đã lớn nên bay đi bắt cá. Họ không thấy con chim săn mồi đang rình. 'Bố mẹ ơi quay lại!' hải âu con kêu.","🕊️🦅"],
  ["mc","Who was watching and waiting?",["the killer bird","a fish","a boat"],"The killer bird is dangerous!","Con chim săn mồi rất nguy hiểm!","🦅"],
  ["speak","He was watching. He was waiting.","Nó đang rình. Nó đang chờ."]
 ]},
 {n:"New words", icon:"🔤", steps:[
  ["say","New words for Unit 7.","Từ mới Unit 7.","🔤"],
  ["word","author","✍️","tác giả","Michael Morpurgo is an author."],
  ["word","tailor","🧵","thợ may","A tailor makes clothes."],
  ["word","curtains","🪟","rèm cửa","Colourful curtains!"],
  ["word","factory","🏭","nhà máy","The factory made grey dust."],
  ["word","albatross","🕊️","chim hải âu lớn","An albatross is a big seabird."],
  ["word","catch","⚾","trò ném bắt bóng","They were playing catch."],
  ["listen","tailor",["🧵|tailor","🏭|factory","🪟|curtains"],"A tailor sews clothes.","Thợ may may quần áo."],
  ["listen","author",["✍️|author","🕊️|albatross","⚾|catch"],"An author writes books.","Tác giả viết sách."],
  ["fill","colour + ful = ___",["colourful","colorful"],"-ful makes an adjective.","colourful = nhiều màu sắc.","🌈"]
 ]},
 {n:"Language", icon:"✏️", steps:[
  ["say","Some words sound the same but have different spellings and meanings: sore and saw, threw and through.","Có từ đọc giống nhau nhưng viết và nghĩa khác: sore/saw, threw/through.","🔊"],
  ["mc","Which word sounds the same as 'threw'?",["through","three","throw"],"threw (ném) – through (xuyên qua).","threw và through đọc giống nhau.","⚾"],
  ["say","Time words tell us when things happen: first, then, before school, the next day.","Từ chỉ thời gian: first, then, before school, the next day.","⏰"],
  ["mc","Which is a time word?",["Then","Ball","Sore"],"Then tells us when.","Then = sau đó.","⏰"],
  ["say","-er and -est compare things: small, smaller, smallest.","-er và -est để so sánh: small, smaller, smallest.","📏"],
  ["fill","big, bigger, ___",["biggest"],"big → bigger → biggest (double g!).","big → biggest (gấp đôi g).","🐘"],
  ["mc","fast, ___, fastest",["faster","fastest","more fast"],"fast → faster → fastest.","nhanh → nhanh hơn → nhanh nhất.","🐆"],
  ["say","A story mountain has a beginning, a middle and an end.","'Ngọn núi câu chuyện' có mở đầu, diễn biến và kết thúc.","⛰️"],
  ["order","Put the story mountain in order.","beginning middle end","beginning → middle → end","mở đầu → diễn biến → kết thúc"],
  ["say","Wonderful reading! You are a book lover!","Đọc hay lắm! Con là người yêu sách!","📚🌟"]
 ]}
]},
{u:"8", title:"Underwater life", icon:"🐠", color:"#0e7490", parts:[
 {n:"Story time", icon:"📖", steps:[
  ["say","Let's dive into Unit 8: Underwater life! Oceans are huge areas of salt water. Lakes have fresh water.","Cùng lặn vào Unit 8: Sự sống dưới nước! Đại dương là vùng nước mặn rộng lớn. Hồ có nước ngọt.","🌊"],
  ["read","Body parts of a fish","A fish breathes underwater through its gills. The gills are behind its head. A fish waves its tail from side to side to swim. Its skin is covered in scales. Scales protect the fish. Fish use their fins to steer.","Cá thở bằng mang sau đầu. Cá vẫy đuôi sang hai bên để bơi. Da cá có vảy bảo vệ. Cá dùng vây để lái.","🐟"],
  ["mc","How does a fish breathe?",["through its gills","through its nose","through its fins"],"Gills are just behind the head.","Mang ở ngay sau đầu.","🐟"],
  ["mc","What do fins do?",["help the fish steer","help it eat","help it see"],"Fins are for steering.","Vây giúp cá lái hướng.","🐠"],
  ["read","Whales","Whales are not fish. They must come up to breathe air through blowholes on top of their heads. A whale's tail moves up and down. Baleen whales are huge, but they eat tiny creatures called krill and plankton.","Cá voi không phải cá. Chúng ngoi lên thở bằng lỗ trên đầu. Đuôi cá voi chuyển động lên xuống. Cá voi tấm sừng rất to nhưng ăn sinh vật tí hon.","🐋"],
  ["mc","How does a whale's tail move?",["up and down","side to side","round and round"],"A fish's tail moves side to side.","Đuôi cá thì đưa sang hai bên.","🐳"],
  ["mc","What do baleen whales eat?",["krill and plankton","sharks","seaweed only"],"Big whale, tiny food!","Cá voi to, thức ăn tí hon!","🦐"],
  ["read","Coral reefs","Coral reefs are like underwater lands made of coral. Coral is made of tiny animals called polyps. Reefs grow in warm, sunny, clear seas. The biggest coral reef in the world is near Australia. It is called the Great Barrier Reef.","Rạn san hô như vùng đất dưới biển, làm từ những con polyp tí hon. Rạn lớn nhất thế giới là Rạn san hô Great Barrier ở gần nước Úc.","🪸"],
  ["mc","Where is the biggest coral reef?",["near Australia","near Japan","in a lake"],"The Great Barrier Reef.","Rạn san hô Great Barrier.","🇦🇺"],
  ["speak","A fish breathes through its gills.","Cá thở bằng mang."]
 ]},
 {n:"New words", icon:"🔤", steps:[
  ["say","Under-the-sea words!","Từ vựng dưới biển!","🔤"],
  ["word","gills","🐟","mang cá","Fish breathe with gills."],
  ["word","fins","🐠","vây cá","Fins help fish steer."],
  ["word","scales","🐡","vảy cá","Scales protect the fish."],
  ["word","whale","🐋","cá voi","A whale breathes air."],
  ["word","octopus","🐙","bạch tuộc","An octopus has eight arms."],
  ["word","coral","🪸","san hô","Coral reefs are colourful."],
  ["word","turtle","🐢","con rùa","The turtle lays eggs in the sand."],
  ["listen","octopus",["🐙|octopus","🐋|whale","🐢|turtle"],"Eight arms!","Tám xúc tu!"],
  ["listen","coral",["🪸|coral","🐟|gills","🐠|fins"],"Coral reefs!","Rạn san hô!"],
  ["fill","Spell it: 🐋 w _ _ _ e",["whale"],"W-H-A-L-E.","Cá voi: whale."]
 ]},
 {n:"Language", icon:"✏️", steps:[
  ["say","A pronoun can take the place of a noun: it, I, you, he, she, we, they.","Đại từ thay cho danh từ: it, I, you, he, she, we, they.","👉"],
  ["mc","The whale is big. ___ eats krill.",["It","They","She"],"The whale → it.","con cá voi → it.","🐋"],
  ["mc","The fish swim fast. ___ have fins.",["They","It","He"],"Many fish → they.","nhiều con cá → they.","🐟🐟"],
  ["say","Three kinds of sentences: a statement tells, a question asks (?), a command tells you to do something (!).","Ba loại câu: câu kể, câu hỏi (?), câu mệnh lệnh (!).","💬"],
  ["mc","'Catch that fish!' is a …",["command","question","statement"],"It tells you what to do.","Nó bảo con làm gì.","🎣"],
  ["mc","'Which animals eat fish?' is a …",["question","command","statement"],"It asks and ends with ?","Câu hỏi, kết thúc bằng ?","❓"],
  ["say","Present tense for things that always happen: Sharks chase fish. A fish breathes underwater.","Thì hiện tại cho điều luôn xảy ra: Sharks chase fish.","🦈"],
  ["mc","A fish ___ underwater.",["breathes","breathe","breathing"],"One fish → breathes.","Một con cá → breathes.","🐟"],
  ["say","Splash! You are an ocean expert now!","Ùm! Con là chuyên gia đại dương rồi!","🌊🌟"]
 ]}
]},
{u:"9", title:"Creatures everywhere", icon:"🐘", color:"#059669", parts:[
 {n:"Story time", icon:"📖", steps:[
  ["say","Unit 9: Creatures everywhere! We will read animal poems from around the world.","Unit 9: Muôn loài khắp nơi! Mình đọc thơ về động vật khắp thế giới.","🌍"],
  ["read","The Elephant (traditional Indian rhyme)","Through the jungle the elephant goes, swaying his trunk to and fro. Munching, crunching, tearing trees, stamping seeds, eating leaves. His eyes are small, his feet are fat. Hey, elephant, don't do that!","Con voi đi xuyên rừng, đung đưa vòi qua lại. Nhai rau ráu, xé cây, giẫm hạt, ăn lá. Mắt nhỏ, chân to. Này voi ơi, đừng làm thế!","🐘🌴"],
  ["mc","Where does the elephant go?",["through the jungle","through the city","under the sea"],"Through the jungle the elephant goes.","Voi đi xuyên qua rừng.","🌴"],
  ["mc","What does he sway to and fro?",["his trunk","his tail","his ears"],"Swaying his trunk to and fro.","Đung đưa cái vòi.","🐘"],
  ["speak","Hey, elephant, don't do that!","Này voi ơi, đừng làm thế!"],
  ["say","In Over in the Jungle, a mother sloth and her nine little sloths creep and sleep, hanging from a vine. A father howler monkey and his ten babies hoot and holler!","Trong bài Over in the Jungle, mẹ lười và chín con bò chậm rồi ngủ trên dây leo. Bố khỉ rú và mười con kêu hú vang!","🦥🐒"],
  ["mc","What do sloths do?",["creep and sleep","hoot and holler","swim and dive"],"So they crept, then they slept.","Chúng bò chậm rồi ngủ.","🦥"],
  ["read","How Doth the Little Crocodile (Lewis Carroll)","How doth the little crocodile improve his shining tail, and pour the waters of the Nile on every golden scale! How cheerfully he seems to grin, how neatly spreads his claws, and welcomes little fishes in with gently smiling jaws.","Chú cá sấu nhỏ tưới nước sông Nile lên từng chiếc vảy vàng. Chú cười thật tươi, xòe móng gọn gàng, mỉm cười đón cá nhỏ vào miệng!","🐊"],
  ["mc","Why does the crocodile smile at the little fishes?",["He wants to eat them.","He wants to play.","He is sad."],"Gently smiling jaws… he's hungry!","Nụ cười hiền… nhưng chú đang đói!","🐊🐟"],
  ["read","Ode to a Goose (what the poem says)","This ode was written in ancient China by a seven-year-old poet. The poet talks to the goose: Goose, goose, goose! The goose lifts its long neck to the sky and sings. Its white feathers float on the bright green water. Its red feet push the clear water.","Ngỗng, ngỗng, ngỗng, cong cổ hướng trời mà hát. Lông trắng nổi trên nước biếc, chân đỏ khua sóng trong. (Bài thơ của một em bé 7 tuổi ở Trung Quốc cổ đại)","🪿"],
  ["mc","What colour are the goose's feet?",["red","green","white"],"Your red feet push the clear waves.","Chân ngỗng màu đỏ.","🪿"]
 ]},
 {n:"New words", icon:"🔤", steps:[
  ["say","Animal words! Listen and say.","Từ vựng về động vật! Nghe và nói.","🔤"],
  ["word","elephant","🐘","con voi","The elephant has a trunk."],
  ["word","trunk","🐘","vòi voi","He sways his trunk."],
  ["word","sloth","🦥","con lười","The sloth is super slow."],
  ["word","monkey","🐒","con khỉ","Howler monkeys hoot."],
  ["word","crocodile","🐊","cá sấu","Don't poke a crocodile!"],
  ["word","goose","🪿","con ngỗng","The goose has white feathers."],
  ["word","jungle","🌴","rừng rậm","Animals live in the jungle."],
  ["listen","sloth",["🦥|sloth","🐒|monkey","🐊|crocodile"],"A very slow animal.","Con vật rất chậm."],
  ["listen","goose",["🪿|goose","🐘|elephant","🌴|jungle"],"Goose, goose, goose!","Ngỗng, ngỗng, ngỗng!"],
  ["fill","Spell it: 🐊 c r _ _ _ _ _ l e",["crocodile"],"C-R-O-C-O-D-I-L-E.","Cá sấu: crocodile."]
 ]},
 {n:"Language", icon:"✏️", steps:[
  ["say","A split digraph: the e at the end makes the vowel long. tap → tape, bit → bite, hop → hope, tub → tube.","'Split digraph': chữ e cuối làm nguyên âm đọc dài: tap → tape, bit → bite.","🔤"],
  ["speak","tap, tape. bit, bite. hop, hope.","tap/tape, bit/bite, hop/hope"],
  ["mc","hop + e = ?",["hope","hop","hoop"],"The e makes the o long.","Chữ e làm o đọc dài.","🙏"],
  ["mc","Which word rhymes with 'crocodile'?",["smile","cat","goose"],"crocodile – smile – Nile.","crocodile vần với smile.","😁"],
  ["say","Adverbs ending in -ly tell us how: cheerfully, neatly, gently.","Trạng từ đuôi -ly cho biết cách làm: cheerfully, neatly, gently.","🏃"],
  ["fill","gentle → gent___",["ly","gently"],"gentle → gently.","gentle → gently (nhẹ nhàng).","🤲"],
  ["say","Past tense: creep → crept, sleep → slept, hoot → hooted.","Quá khứ: creep → crept, sleep → slept, hoot → hooted.","⏪"],
  ["mc","sleep → ?",["slept","sleeped","sleeping"],"sleep → slept.","sleep → slept (đã ngủ).","😴"],
  ["say","Congratulations! You finished all nine units with me. I'm so proud of you!","Chúc mừng con! Con đã học xong cả chín unit cùng cô. Cô rất tự hào về con!","🎓🌟"]
 ]}
]}

// Hand-drawn SVG illustrations for the teacher lessons (original artwork).
const SC=(()=>{
const W=(b,inner)=>`<svg viewBox="0 0 320 200" role="img" class="scene" xmlns="http://www.w3.org/2000/svg">${b||""}${inner}</svg>`;
const sky=(c1="#bfe3ff",g="#9ccf6a")=>`<rect width="320" height="200" fill="${c1}"/><rect y="150" width="320" height="50" fill="${g}"/>`;

 ["say","Session 1.2: A family adventure. Look at the pictures. One word for all of them: dark!","Bài 1.2: Chuyến phiêu lưu của gia đình. Một từ cho tất cả các hình: tối!","scene:powercut"],
 ["read","Power Cut, Part 1","The Chen family were at home one ordinary evening. Mum and Dad were tired after work, and Amy and Ben were playing on their tablets. All at once, everything went black. There was no electricity anywhere in the city. Dad asked if everyone was all right. Amy was fine, and Ben said he had never seen the apartment so dark. Dad switched on his torch, but it gave only a tiny beam of light. Soon Mum felt very hot, because the machine that keeps the flat cool had stopped. In the kitchen, the fridge and the freezer were off too. All the food could go bad! Worst of all, Grandma's special ice cream cake was in the freezer, and it would melt in the warm air. Then the torch went out as well. Now the problem was even bigger!","Buổi tối như mọi tối ở nhà Chen. Bỗng đèn tắt – mất điện cả thành phố. Đèn pin chỉ le lói. Máy làm mát ngừng chạy, nhà nóng lên. Tủ lạnh, tủ đông cũng ngừng – bánh kem của bà sắp chảy. Rồi đèn pin cũng tắt!","scene:powercut","listen"],

 ["say","Session 1.5: Huey Makes the Leap. Julian, his little brother Huey and their friend Gloria are in the garden.","Bài 1.5: Huey dám nhảy. Julian, em trai Huey và bạn Gloria đang ở trong vườn.","scene:swing"],
 ["read","Huey Makes the Leap (part)","Julian, his little brother Huey and their friend Gloria are playing in the garden. There are two new things there: a wonderful swing and a huge pile of sand, as tall as a small mountain. Julian has an idea. He swings very high, looks down to make sure there are no toy trucks in the sand, and lets go. For a moment he feels like he is flying, then floating down like a parachute, and he lands softly in the sand. Gloria tries it and flies too. Now it is Huey's turn, but Huey does not look excited. First he needs his baseball cap. Then he needs his lucky shirt. Then he must tie his shoe laces. Julian gets cross and calls him a scaredy-cat. Uh-oh – that starts the trouble!","Julian, Gloria và Huey chơi trong vườn có xích đu mới và đống cát cao như núi. Julian nhảy từ xích đu xuống đống cát như bay. Gloria cũng nhảy. Đến lượt Huey, cậu bé viện cớ: đội mũ, mặc áo may mắn, buộc dây giày… Julian gọi Huey là 'đồ nhát gan'. Rắc rối bắt đầu!","scene:swing","listen"],

 ["read","The Pudding Like a Night on the Sea (part)","Father wants to make a surprise for Mother: a special lemon pudding that will taste like the sea at night. He cuts five lemons in half and squeezes them hard. Juice squirts into Julian's eye, and pips fly onto the floor! Father separates the eggs, beats the yolks, and Julian pours in the sugar. Father adds lemon juice and cream and cooks it on the stove while it bubbles. Last, he whips the egg whites and stirs them in, so the pudding becomes light and fluffy. Father is tired, so he goes for a nap. He tells the boys not to touch the pudding. Julian and Huey sit and watch it. Huey wonders how it tastes… and he pokes his finger in!","Bố làm món pudding chanh đặc biệt cho mẹ: vắt năm quả chanh, đánh trứng, cho đường, kem, nấu sôi, trộn lòng trắng đánh bông. Bố đi ngủ và dặn: 'Đừng động vào pudding!' Huey tò mò… nhúng ngón tay vào nếm!","scene:pudding","listen"],
 ["mc","WHAT sort of pudding is Father making?",["a lemon pudding","a chocolate pudding","a banana pudding"],"It will taste like a whole raft of lemons!","Món pudding chanh!","🍋"],

 ["mc","WHY does Huey put his finger in?",["He wants to know how it tastes.","He wants to clean it.","Father told him to."],"'I wonder how it tastes,' said Huey.","Huey tò mò muốn biết vị của nó.","👆"],
 ["read","Eat Your Peas (part 1)","At dinner time, Daisy already knows what Mum is going to say: eat your peas! Daisy looks at the small green peas on her plate and says she doesn't like peas. Mum sighs. She promises Daisy a pudding if she eats them. Daisy says no. Mum adds a later bedtime. Daisy still says no. So Mum's promises grow bigger and sillier: lots of puddings, staying up very late, no bath for months, even a brand-new bike! But every time, Daisy gives the same answer: she doesn't like peas.","Giờ ăn tối. Mẹ bảo: 'Ăn đậu đi con.' Daisy nói: 'Con không thích đậu.' Mẹ hứa cho pudding, thức khuya, mười cái pudding, xe đạp mới… lời hứa càng lúc càng to. Daisy vẫn nói: 'Con không thích đậu.'","scene:peas","listen"],

 ["read","What is a Scientist?","Scientists learn about the world around us by doing experiments. An experiment is when you test something to find out what happens. You usually need to ask questions and write or follow instructions.","Nhà khoa học tìm hiểu thế giới bằng cách làm thí nghiệm – thử để xem điều gì xảy ra. Cần đặt câu hỏi và làm theo hướng dẫn.","scene:scientist"],
 ["read","How to be a Science Champion","Rule 1: Observe things carefully. Use all your senses to notice little details. Rule 2: Ask questions, like Why? and How can we…? Rule 3: Find out what will happen. What will happen if we suck on a straw in a drink? What if we blow? Rule 4: Predict. Before you do an experiment, try to work out what might happen. Rule 5: Set up an experiment. Sometimes you test different things; sometimes you follow instructions. Rule 6: Record your results. Write words, numbers or pictures in a science notebook.","Sáu quy tắc: 1 Quan sát kỹ bằng mọi giác quan. 2 Đặt câu hỏi. 3 Tìm hiểu điều sẽ xảy ra. 4 Dự đoán trước. 5 Làm thí nghiệm. 6 Ghi kết quả vào vở khoa học.","scene:scientist","listen"],

 ["say","Session 2.3: Safety tips for young scientists. Check with a grown-up before you start. Keep your workspace clean and tidy. Always wash your hands when you have finished. Never touch anything if you do not know what it is.","Bài 2.3: Lời khuyên an toàn: hỏi người lớn trước; giữ chỗ làm sạch sẽ; luôn rửa tay khi xong; không chạm vào thứ con không biết.","🧤"],
 ["read","How to Blow Bubbles (flow chart)","What you need: a bowl, water, a straw and liquid soap or bubble bath. Half fill a bowl with water. Put a straw into the water and blow. No bubbles! Water on its own cannot stretch to hold the air. Now pour a bit of bubble bath into the water. Put the straw in and blow again. Bubbles! The soap makes the water stretch to hold the air.","Cần: bát, nước, ống hút, xà phòng. Thổi vào nước thường – không có bong bóng! Nước không giãn ra giữ khí được. Thêm xà phòng rồi thổi – có bong bóng! Xà phòng làm nước co giãn.","scene:bubbles","listen"],

 ["order","How to Make a Bubble Painting: put the steps in order.","Half fill a bowl with water | Pour a bit of liquid soap in | Add a bit of paint | Blow until the bubbles are above the bowl | Put paper on top, then lift it off","Then you will have a bubble painting!","Thế là có tranh bong bóng!","|"],
 ["read","How to Mix Oil and Water","You will need: a bowl, a jug of water, cooking oil and washing-up liquid. First, make sure you have all your equipment. Second, pour some water into a bowl. Then, add some cooking oil. Observe. Next, add some drops of washing-up liquid and stir the water. Lastly, observe. What has changed? Why? You should see that the drops of oil float on top of the water. When we add washing-up liquid, it helps to break up the oil. That is how it cleans our oily plates.","Chuẩn bị dụng cụ. Đổ nước vào bát. Thêm dầu ăn – quan sát: dầu nổi trên mặt nước. Thêm nước rửa bát và khuấy – nước rửa bát làm dầu tan ra. Vì vậy nó rửa sạch đĩa dính dầu.","scene:oilwater","listen"],
 ["mc","a) Do you add the cooking oil before the water?",["No, after the water.","Yes, before."],"Water first, then oil.","Nước trước, dầu sau.","🫗"],

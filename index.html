 ["say","Unit 3: All about sounds. Session 3.1: Repeating letter sounds. Do you know any tongue-twisters?","Unit 3: Tất cả về âm thanh. Bài 3.1: Âm lặp lại. Con biết câu líu lưỡi nào không?","👅"],
 ["read","She Sells Seashells (traditional)","She sells seashells by the seashore, the shells she sells are seashells, I'm sure. So if she sells seashells on the seashore, then I'm sure she sells seashore shells.","Cô ấy bán vỏ sò bên bờ biển, vỏ cô bán chắc chắn là vỏ sò. Vậy nếu cô bán vỏ sò ở bờ biển thì chắc chắn cô bán vỏ sò bờ biển.","scene:seashells"],
 ["mc","What letter sound is repeated?",["s and sh","b","t"],"She sells seashells…","She sells seashells…","🐚"],
 ["mc","This tongue-twister may be about Mary Anning. What did she collect?",["fossils","toys","stamps"],"A fossil is the remains of a prehistoric plant or animal in rock.","Hóa thạch là dấu vết cây/vật thời tiền sử trong đá.","🦴"],
 ["read","Peter Piper (traditional)","Peter Piper picked a peck of pickled peppers. A peck of pickled peppers Peter Piper picked. If Peter Piper picked a peck of pickled peppers, where's the peck of pickled peppers Peter Piper picked?","Peter Piper hái một đấu ớt ngâm… Đấu ớt ngâm Peter Piper hái đâu rồi?","🌶️","listen"],
 ["mc","Which sound is repeated in Peter Piper?",["p","s","m"],"Peter Piper picked a peck of pickled peppers!","Lặp âm p!","🌶️"],
 ["read","Betty Botter (traditional)","Betty Botter bought some butter, but, she said, the butter's bitter. If I put it in my batter, it will make my batter bitter. But a bit of better butter will make my batter better. So she bought a bit of butter better than her bitter butter.","Betty Botter mua bơ nhưng bơ bị đắng, nên cô mua thêm chút bơ ngon hơn để bột bánh ngon hơn.","🧈","listen"],
 ["mc","What did Betty Botter buy?",["butter","bread","bananas"],"Betty Botter bought some butter.","Betty Botter mua bơ.","🧈"],
 ["say","Shop Chat is a poem by Libby Houston. A shop sells lots of funny things: locks, chips, chopsticks, watch straps, tops, taps, ship's clocks and sharkskin socks! Listen for sh, ck and ch.","Bài thơ Shop Chat: cửa hàng bán khóa, khoai tây chiên, đũa, dây đồng hồ, con quay, vòi nước, đồng hồ tàu và tất da cá mập! Nghe âm sh, ck, ch.","🏪"],
 ["mc","Which word from Shop Chat has ck?",["socks","shop","chips"],"so-ck-s.","so-ck-s.","🧦"],
 ["say","Session 3.2: Chants. The Poetry United Chant is like a football chant. We ask WHAT DO WE WANT? and clap clap clap! Then we spell P-O-E-T-R-Y. What do we want? POETRY! YES!","Bài 3.2: Bài chant giống tiếng hô cổ vũ bóng đá. Hỏi CHÚNG TA MUỐN GÌ? vỗ tay 3 cái! Đánh vần P-O-E-T-R-Y. THƠ! ĐÚNG RỒI!","📣"],
 ["mc","Which word does the chant spell out?",["POETRY","FOOTBALL","HAPPY"],"P-O-E-T-R-Y!","P-O-E-T-R-Y!","📣"],
 ["mc","Why are some words in CAPITAL letters?",["to say them loudly","because they are names","by mistake"],"Capitals can show volume.","Chữ in hoa cho biết đọc to.","🔊"],
 ["say","Session 3.3: Sound words. In Words to Whisper by Michaela Morgan, some words sound like what they mean: whisper, SHOUT, buzz, splash, hum, hush, snap!","Bài 3.3: Từ tượng thanh. Trong bài Words to Whisper có từ nghe giống nghĩa: thì thầm, HÉT, vo ve, tõm, ngân nga, suỵt, tách!","🔊"],
 ["mc","Sort it: 'splash' is a …",["water sound","voice sound","animal sound"],"Splash! Water.","Tõm! Âm thanh của nước.","💦"],
 ["mc","Sort it: 'buzz like bees' is an …",["animal sound","water sound","action sound"],"Bees buzz!","Ong kêu vo ve!","🐝"],
 ["read","New Shoes, Part 1 (story of the poem)","One shoe, two shoes, I need new shoes! The child goes to the shoe store and says, 'I need new shoes.' The salesman asks, 'What do you need them for?' He sells shoes with grown-up laces, shoes with funny faces, shoes to wear in muddy places, shoes for driving and shoes for diving, shoes for leaving and arriving, and shoes to visit aunts for tea. But none of those shoes suit the child. At the next shoe store, the saleslady sells shoes with buckles, shoes with pearls, pointy shoes that end in curls, shoes with buttons and with bows. 'I'm sorry, but I don't like those.'","Bạn nhỏ đi mua giày. Người bán giới thiệu giày có dây, giày mặt cười, giày đi chỗ lầy, giày lái xe, giày lặn… Không đôi nào hợp! Cửa hàng sau có giày khóa cài, giày ngọc trai, giày mũi cong, giày nơ… 'Xin lỗi, con không thích.'","scene:shoes","listen"],
 ["mc","What does the salesman ask?",["What do you need them for?","What is your name?","How old are you?"],"He wants to know what the shoes are for.","Ông hỏi con cần giày để làm gì.","👞"],
 ["mc","Does the child like the shoes at the first store?",["No","Yes"],"None of those new shoes suit me.","Không đôi nào hợp.","🙅"],
 ["mc","Which shoes are at the second store?",["shoes with buckles and bows","shoes for diving","boots for snow"],"Buckles, pearls, curls, buttons and bows.","Khóa cài, ngọc trai, mũi cong, cúc, nơ.","🎀"],
 ["say","In Part 2, the salesman shows magic shoes with dragon's wings and springs! The child says: These are the ones! Shoes to run, to race with the wind and never lose. And at the end: If you can catch me, I'll buy you a pair!","Phần 2: giày thần kỳ có cánh rồng và lò xo! Bạn nhỏ chọn ngay: giày để chạy đua cùng gió. Cuối bài: Nếu bắt được tớ, tớ sẽ mua cho cậu một đôi!","🐉👟"],
 ["mc","Does the poem end the way you expected?",["No – it's a funny surprise!","Yes – it's sad."],"If you can catch me, I'll buy you a pair!","Kết thúc bất ngờ và vui!","😄"]
],
// ---------- Unit 4 ----------
[
 ["say","Unit 4: Long, long ago. We will read traditional tales: stories told and retold for many years. Session 4.1: Exploring words.","Unit 4: Ngày xửa ngày xưa. Mình đọc truyện cổ. Bài 4.1: Khám phá từ ngữ.","📜"],
 ["mc","These animals are the smallest of their kind. A pygmy elephant is …",["smaller than normal","bigger than normal"],"pygmy = smaller than normal.","pygmy = nhỏ hơn bình thường.","🐘"],
 ["read","Sang Kancil and the Tiger, Part 1 (retold)","A long time ago, deep in the jungle, there lived a tiny mouse deer named Sang Kancil. He was clever and full of tricks. One morning he was eating fruit next to a muddy puddle when Tiger came along, hungry for breakfast. Tiger said he would eat the mouse deer. Sang Kancil had to think fast. He told Tiger that the king had asked him to guard the royal chocolate sauce, so he could not be eaten. Greedy Tiger wanted to taste the sauce. Sang Kancil said no, but Tiger showed his teeth and growled. So Sang Kancil agreed – but first he wanted to run away, so the king's guards would not catch him. Off he ran into the jungle. Tiger bent down and licked the puddle. Yuck! It was only mud. Tiger had been tricked!","Hươu chuột Sang Kancil ranh mãnh. Hổ đói muốn ăn chú làm bữa sáng. Chú bảo vũng bùn là 'sốt sô-cô-la của vua'. Hổ tham lam đòi nếm. Chú chạy vào rừng; Hổ nếm bùn – 'Eo! Mình bị lừa rồi!'","scene:jungle","listen"],
 ["mc","a) What two adjectives describe Sang Kancil?",["sly and clever","big and slow","sad and tired"],"He was sly and clever.","Ranh mãnh và thông minh.","🦌"],
 ["mc","b) What adjective describes Tiger's eyes?",["hungry","blue","sleepy"],"Tiger's hungry eyes.","Đôi mắt đói của Hổ.","🐯"],
 ["mc","c) What adjective describes the puddle?",["muddy","clean","hot"],"a muddy puddle","một vũng bùn","🟤"],
 ["mc","d) What does Tiger think the puddle is?",["the king's chocolate sauce","water","soup"],"Yuk! It's mud!","Eo! Là bùn!","🍫"],
 ["say","There is one setting in this story. Where is it?","Câu chuyện có một bối cảnh. Đó là ở đâu?","🌴"],
 ["mc","Where is the setting?",["the jungle","a city","the sea"],"He lived deep in the jungle.","Chú sống sâu trong rừng.","🌴"],
 ["read","Sang Kancil and the Tiger, Part 2 (retold)","That afternoon, Tiger found Sang Kancil again, this time next to a tree. Tiger's tummy was rumbling, and he promised himself he would not be fooled again. He said he would eat the mouse deer for lunch. Sang Kancil looked up and saw a bees' nest hanging in the tree. He smiled. He told Tiger that the king had asked him to look after the royal drum. Tiger wanted to bang the drum. At first Sang Kancil said no, then he agreed – after he had run away into the jungle. Tiger reached up and hit the 'drum' hard. Out flew the angry bees! Ouch! It was a bees' nest, and Tiger had been tricked again.","Chiều hôm đó Hổ lại gặp Sang Kancil bên gốc cây. Chú chỉ tổ ong bảo là 'trống của vua'. Hổ đập 'trống' – ong đốt! 'Ui da! Lại bị lừa rồi!'","scene:beesnest","listen"],
 ["mc","True or false? Tiger saw Sang Kancil beside a river.",["False","True"],"He was standing beside a tree.","Chú đứng cạnh một cái cây.","🌳"],
 ["mc","True or false? Tiger wanted to eat Sang Kancil for lunch.",["True","False"],"I'm going to eat you for my lunch.","Hổ muốn ăn chú làm bữa trưa.","🍽️"],
 ["mc","What did Sang Kancil say he was looking after?",["the king's drum","the king's crown","the king's belt"],"The bee's nest became 'the king's drum'.","Tổ ong thành 'trống của vua'.","🥁"],
 ["mc","Why did Sang Kancil want to escape into the jungle first?",["so the king's men don't catch him","to find food","to sleep"],"Clever trick – and he runs away safely!","Mẹo hay – và chú chạy thoát!","🏃"],
 ["say","Part 3: Later, Tiger wanted to eat Sang Kancil for dinner. Sang Kancil said he was looking after the king's new belt – but it was a sleeping cobra! The cobra hissed and tried to eat Tiger. Three tricks!","Phần 3: 'Thắt lưng mới của vua' thật ra là con rắn hổ mang đang ngủ! Rắn rít lên đòi ăn Hổ. Ba lần lừa!","🐍"],
 ["order","Put Sang Kancil's tricks in order.","chocolate sauce | drum | belt","mud → bees → cobra!","bùn → ong → rắn!","|"],
 ["read","The Abominable Snowman (retold in chapters)","Chapter 1, The very lazy boy: A long time ago a lazy boy called Ramay lived with his mother in the mountains. His mother sent him away to find work. Chapter 2, The hidden cave: Ramay chatted to himself because he was lonely. A monster in a cave heard him and thought Ramay was a monster too! He gave Ramay a wishing stick to make him go away. Chapter 3: Ramay stayed the night with an old woodcutter. While Ramay slept, the woodcutter swapped the wishing stick for an old piece of wood. Chapter 4: At home the stick didn't work. Ramay ran back. The monster gave him a new stick that chases anyone who touches it without permission. Chapter 5: The new stick chased the woodcutter until Ramay told it to stop. Ramay went home with both sticks and made wishes for his mother and for the kind monster.","Ramay lười bị mẹ đuổi đi tìm việc. Quái vật trong hang tưởng Ramay là quái vật, tặng gậy ước. Ông tiều phu tráo gậy. Quái vật cho gậy mới biết đuổi kẻ trộm. Gậy đuổi ông tiều phu. Ramay mang hai gậy về, ước cho mẹ và cho quái vật tốt bụng.","scene:snowman","listen"],
 ["mc","a) Which words tell you when the story happened?",["A long time ago","Yesterday","Next week"],"Traditional tales often start: Long ago…","Truyện cổ thường mở đầu: Ngày xưa…","📜"],
 ["mc","b) Who tricks who first?",["Ramay tricks the monster.","The monster tricks Ramay.","Mother tricks Ramay."],"The monster thought Ramay was a monster!","Quái vật tưởng Ramay là quái vật!","👹"],
 ["mc","c) How does the story end?",["Ramay makes wishes for his mother and the monster.","Ramay loses both sticks.","The monster eats Ramay."],"A happy ending!","Kết thúc có hậu!","🌟"],
 ["read","Yoshi the Stonecutter, Part 1 (retold)","Long ago, in the mountains of Japan, a stonecutter called Yoshi worked hard every day. He was poor, his back was bent and his hands were hard from cutting stone. One day he carried some stone to a rich man's house. Yoshi loved the beautiful house, the silk clothes and the rich man's soft, clean hands. He wished that he could be rich too. Just then a cool wind blew, and Yoshi heard a voice whispering in the wind. It told him that his wish would come true: he would be a rich man.","Ngày xưa ở vùng núi Nhật Bản có anh thợ đẽo đá nghèo tên Yoshi, lưng còng, tay chai. Anh ước được làm người giàu. Một làn gió mát thổi qua, thì thầm: 'Điều ước được chấp thuận!'","scene:yoshi","listen"],
 ["mc","a) Why was Yoshi's back bent and his hands hard?",["from cutting stone","from playing","from cooking"],"He cut stone every day.","Ngày nào anh cũng đẽo đá.","⛏️"],
 ["mc","b) Why did Yoshi want to be a rich man?",["He loved the rich man's home and clothes.","He was bored.","He wanted to fly."],"Beautiful home, silk clothes, soft hands.","Nhà đẹp, áo lụa, tay mềm.","💰"],
 ["say","Yoshi always says: “Oh I wish I could be …”. The whisper in the wind always says: “Your wish is granted, Yoshi – … you will be.” He becomes a rich man, a prince, the sun, a cloud, a rock… and then a stonecutter cuts the rock!","Yoshi luôn nói: 'Ước gì tôi được là…'. Gió luôn đáp: 'Điều ước được chấp thuận…'. Anh thành người giàu, hoàng tử, mặt trời, đám mây, tảng đá… rồi người thợ đá đẽo vào tảng đá!","🔄"],
 ["mc","What does the whisper in the wind always say?",["Your wish is granted.","Go home!","No more wishes."],"A language pattern repeats.","Mẫu câu được lặp lại.","🌬️"],
 ["mc","d) What do you think Yoshi learned?",["to be happy with who he is","to be a cloud","to be rich"],"Now he was happy.","Giờ anh thấy hạnh phúc.","😊"]
],
// ---------- Unit 5 ----------
[
 ["say","Unit 5: Computers and robots. Session 5.1: Computers are machines that work with information and solve problems.","Unit 5: Máy tính và rô-bốt. Bài 5.1: Máy tính là máy làm việc với thông tin và giải quyết vấn đề.","💻"],
 ["say","Children use computers in many ways: some toys have computers in them, we play games on the internet, we check our spelling and visit our favourite websites.","Trẻ em dùng máy tính nhiều cách: đồ chơi có máy tính bên trong, chơi trò chơi trên mạng, kiểm tra chính tả, vào trang web yêu thích.","🎮"],
 ["read","The first computers","This was one of the first computers. It was made two thousand years ago. It could work out where the moon and the stars would be on any date. Four hundred years ago a man called Pascal made a computer. It was a calculator and was used to do simple sums. Then computers began to use electricity to make them work faster. In the Second World War, top secret messages were sent in code. Computers helped to break the code. Then computers became bigger and cleverer, and they could do more things.","Máy tính đầu tiên từ 2000 năm trước tính vị trí mặt trăng, sao. 400 năm trước Pascal làm máy tính cộng trừ. Rồi máy tính dùng điện chạy nhanh hơn, giúp giải mật mã trong Thế chiến II, và ngày càng thông minh.","🧮","listen"],
 ["mc","What could the very first computer work out?",["where the moon and stars would be","how to cook","how to fly"],"It worked out where the moon and stars would be.","Nó tính được vị trí mặt trăng và các vì sao.","🌙"],
 ["mc","Why do you think people wanted a machine that could do sums?",["to work out answers quickly","to sing songs","to clean the house"],"Computers solve problems fast.","Máy tính giải toán rất nhanh.","➕"],
 ["mc","How did computers help in the Second World War?",["They helped to break secret codes.","They flew planes.","They made food."],"Secret messages were sent in code.","Tin nhắn bí mật được gửi bằng mật mã.","🔐"],
 ["say","Session 5.2: Computer codes. People write programs to tell computers what to do. A program is written in computer code. Children's coding uses blocks: Move, Say “Miaow”, Jump 4 times, Look sad.","Bài 5.2: Người ta viết chương trình bảo máy tính làm gì. Lập trình cho trẻ em dùng các khối lệnh: Di chuyển, Nói 'Meo', Nhảy 4 lần, Làm mặt buồn.","🧩"],
 ["order","Put the code blocks in order: Move, then say Miaow, then jump.","Move | Say Miaow | Jump 4 times","The character follows the blocks in order.","Nhân vật làm theo đúng thứ tự khối lệnh.","|"],
 ["read","Robots","A robot is a machine controlled by a computer. Robots can be programmed to do many things that people can do. Why are robots better than people at some jobs? Robots are very good at doing the same thing again and again. They don't get bored, so they can do jobs that people don't want to do, like mowing grass or cleaning. Robots are also used in factories because they don't get tired, so they can work all day and all night. Some robots are very strong.","Rô-bốt là máy do máy tính điều khiển. Rô-bốt giỏi làm đi làm lại một việc, không chán nên làm việc người không thích như cắt cỏ, dọn dẹp. Ở nhà máy, rô-bốt không mệt nên làm cả ngày lẫn đêm.","scene:robot","listen"],
 ["mc","a) Why are robots good factory workers?",["They don't get tired.","They are small.","They are funny."],"They can work all day and all night.","Chúng làm cả ngày lẫn đêm.","🏭"],
 ["mc","b) What jobs might robots do better than people?",["mowing grass or cleaning","telling jokes","hugging friends"],"Jobs that are the same again and again.","Những việc lặp đi lặp lại.","🧹"],
 ["read","The Pepper Robot","Sometimes robots look like people. Pepper is a friendly robot that looks like a person. Pepper talks to people and helps them. Pepper robots work in busy places like restaurants, hotels, airports, stations, offices and shopping malls. The tablet computer on Pepper's chest gives information. Pepper has cameras so it can see and tell how you are feeling, hearing sensors to understand questions, touch sensors on its hands, bumper sensors on its legs so it doesn't bump into things, and wheels in its feet so it can move around.","Pepper là rô-bốt thân thiện giống người, làm việc ở nhà hàng, khách sạn, sân bay… Máy tính bảng trên ngực cung cấp thông tin. Có camera để nhìn, cảm biến nghe, cảm biến chạm ở tay, cảm biến va chạm ở chân, bánh xe ở bàn chân.","scene:robot","listen"],
 ["mc","Where do Pepper robots work?",["in busy places like airports and hotels","in the sea","in the jungle"],"Restaurants, hotels, airports, stations…","Nhà hàng, khách sạn, sân bay, nhà ga…","✈️"],
 ["mc","What is on Pepper's chest?",["a tablet computer","a clock","a flower"],"The tablet gives information.","Máy tính bảng cung cấp thông tin.","📱"],
 ["mc","Why does Pepper have bumper sensors on its legs?",["so it doesn't bump into things","so it can jump","so it can sing"],"Safety!","Để không va vào đồ vật!","🛑"],
 ["read","What is a drone?","A drone is a robot. Some drones are as big as aeroplanes, but some are so small they can fit on your hand. Some drones have wings so they can fly like a plane. Some drones have rotors so they can fly like a helicopter. Why do we use drones? Many drones carry cameras so the controller can see where the drone is. Drones don't have people in them, so they can go to places that are dangerous or difficult to reach. How do you control a drone? All drones are controlled by a computer.","Drone là rô-bốt. Có cái to như máy bay, có cái vừa bàn tay; có cánh hoặc có cánh quạt như trực thăng. Drone mang camera, không có người nên đến được nơi nguy hiểm. Tất cả drone được máy tính điều khiển.","scene:drone","listen"],
 ["mc","Put these ideas in the order of the text: What a drone is → Why we use drones → …",["How we control drones","What drones eat","Where drones sleep"],"Headings: What is a drone? Why do we use drones? How do you control a drone?","Tiêu đề: Drone là gì? Vì sao dùng? Điều khiển thế nào?","🛸"],
 ["mc","Rotors are …",["blades that go round","wheels","cameras"],"There are rotors on top of helicopters.","Trực thăng có cánh quạt quay trên nóc.","🚁"],
 ["read","Liang flies his drone","At first, the most difficult thing for Liang was doing different things with his hands, like pushing one stick away while pulling the other one towards him. He kept on trying and trying. Now he is getting better, and he can make his drone hover in one place. But he still needs to wait until his dad can take him to a good place, so he flies his drone safely. Soon he will be very good at flying his drone, and he will enter some drone races. He hopes he will win!","Lúc đầu Liang thấy khó nhất là dùng hai tay khác nhau. Cậu cố mãi. Giờ cậu làm drone bay lơ lửng được. Cậu chờ bố đưa đến chỗ an toàn để bay. Sắp tới cậu sẽ thi đua drone và hy vọng chiến thắng!","scene:drone","listen"],
 ["mc","One thing Liang can do now:",["make his drone hover","win a race","fly a plane"],"He can make it hover in one place.","Cậu làm drone bay lơ lửng một chỗ.","🚁"],
 ["mc","One thing he would like to do soon:",["enter drone races","stop flying","sell his drone"],"Soon he will enter some drone races.","Sắp tới cậu sẽ thi đua drone.","🏁"]
],
// ---------- Unit 6 ----------
[
 ["say","Unit 6: On a journey. Lots of poems! Session 6.1: Word play. Which poets do you know?","Unit 6: Trên hành trình. Rất nhiều thơ! Bài 6.1: Chơi chữ. Con biết nhà thơ nào?","🧭"],
 ["mc","The word 'pop' can mean many things. A balloon goes …",["pop","buzz","splash"],"Pop! A sound word.","Bụp!","🎈"],
 ["say","Busy Day is a poem by Michael Rosen. Here 'pop' means to go somewhere quickly: pop in, pop out, pop over the road, pop out for a walk, pop down to the shop… can't stop, got to pop! The pattern repeats.","Bài Busy Day của Michael Rosen: 'pop' nghĩa là ghé nhanh: ghé vào, ra ngoài, sang đường, đi dạo, ra cửa hàng… không dừng được, phải đi đây! Mẫu lặp lại.","🏃"],
 ["mc","a) Which poet wrote Busy Day?",["Michael Rosen","Roger McGough","Valerie Bloom"],"Michael Rosen.","Michael Rosen.","✍️"],
 ["mc","b) Which word in the poem rhymes with pop?",["shop","walk","road"],"pop – shop – stop.","pop vần với shop.","🛍️"],
 ["mc","d) What can you say about the layout of Busy Day?",["short lines, one under another","one long paragraph","a picture shape"],"Very short lines!","Các dòng rất ngắn!","📄"],
 ["say","Session 6.2: Shape play. Downhill Racer by Roger McGough is a shape poem. The words make the shape of a skier's route down a mountain. They slide down the snow-white page, from side to side, past obstacles, and here comes a poem in a hurry!","Bài 6.2: Downhill Racer của Roger McGough là thơ hình. Các chữ vẽ đường trượt tuyết xuống núi: trượt qua trang giấy trắng như tuyết, lượn qua lại, vượt chướng ngại vật!","scene:river"],
 ["mc","An obstacle is …",["something in the way","a kind of ski","a mountain top"],"Pass obstacles with ease.","Vượt chướng ngại vật dễ dàng.","🚧"],
 ["mc","What is Downhill Racer about?",["a poem skiing down the page like a skier","a boat race","a car"],"Words on skis!","Chữ đi trên ván trượt!","⛷️"],
 ["say","Session 6.3: Riding Down to Boxland, another poem by Michael Rosen. In Boxland people live in boxes. There are no chickens – the foxes ate them! The poet finds a box that looks good. He knocks on the lid, knock knock, but there's no answer, not a sound. So he picks up the box and takes it home. Everyone is there, but no-one dares to look inside!","Bài 6.3: Ở Xứ Hộp người ta sống trong hộp. Không còn gà – cáo ăn hết! Nhà thơ gõ nắp một cái hộp, không ai trả lời. Ông mang hộp về nhà. Mọi người tụ tập nhưng không ai dám mở!","scene:boxland"],
 ["mc","a) What is Boxland like?",["People live in boxes.","It is under the sea.","It is very hot."],"Where people live in boxes.","Nơi người ta sống trong hộp.","📦"],
 ["mc","c) What did he do with the box?",["took it home","ate it","threw it in the river"],"He picked up the box and took it for a ride.","Ông mang cái hộp về nhà.","🏠"],
 ["mc","d) Why did no one dare to look inside?",["They were scared of what might be inside.","It was too heavy.","It was empty."],"Nobody knew what was in it!","Không ai biết bên trong có gì!","😨"],
 ["say","Session 6.4: The River by Valerie Bloom, who was born in Jamaica. She describes the river like a person. Verse 1: the river's a winder, he twists and turns through valley and hill. Verse 2: he's a hoarder, he buries little treasures deep. Verse 3: he's a baby, he gurgles and hums. Verse 4: he's a singer, the countryside echoes his song.","Bài 6.4: The River của Valerie Bloom (sinh ở Jamaica) tả dòng sông như một người: kẻ uốn lượn qua thung lũng và đồi; người cất giữ báu vật; em bé ríu rít; ca sĩ mà đồng quê vang vọng tiếng hát.","scene:river"],
 ["mc","Match: echoes means …",["makes a sound that repeats another sound","a baby sound","gold and jewels"],"The countryside echoes the notes of his song.","Đồng quê vang vọng tiếng hát.","🔁"],
 ["mc","Match: treasures means …",["a collection of rich things like gold or jewels","sounds a baby makes","twisting"],"The river keeps little treasures.","Dòng sông cất giữ báu vật nhỏ.","💎"],
 ["mc","The poet tells us the river is like four things. Which is NOT one of them?",["a snake","a winder","a baby","a singer"],"Winder, hoarder, baby, singer.","Kẻ uốn lượn, người cất giữ, em bé, ca sĩ.","🐍"],
 ["say","Session 6.5: Exotic Caribbean was written by Amaal Ali when she was in Year 5. Each line starts with a sound word: Bounce! as the coconuts fall off the palm trees. Tweet, tweet! go the tropical birds. Bang! go the steel drums. Swish! as the waves overlap. Pull! as the fishermen pull in their nets. Sink! go your feet in the warm, white sand.","Bài 6.5: Exotic Caribbean do bạn Amaal Ali viết khi học lớp 5. Mỗi dòng mở đầu bằng từ tượng thanh: Bộp! dừa rơi. Chíp chíp! chim hót. Bùm! trống thép. Xoạt! sóng vỗ. Kéo! ngư dân kéo lưới. Lún! chân lún vào cát trắng ấm.","scene:caribbean"],
 ["mc","What is repeated at the start of each line?",["a sound word with !","a number","a name"],"Bounce! Tweet! Bang! Swish! Pull! Sink!","Từ tượng thanh có dấu chấm than.","❗"],
 ["mc","'Sink!' goes with …",["your feet in the warm sand","the drums","the birds"],"Sink! go your feet in the warm, white sand.","Chân lún vào cát trắng ấm.","🏖️"]
],
// ---------- Unit 7 ----------
[
 ["say","Unit 7: Stories by well-known authors. An author is a person who writes books. Session 7.1: What do you like to read?","Unit 7: Truyện của tác giả nổi tiếng. Bài 7.1: Con thích đọc gì?","📚"],
 ["read","Three story openings","A: With a roar, the rocket took off. The little blue faces looked sadly upwards as it disappeared. B: The seagull flew behind the fishing boat, waiting to dive as the nets were pulled up. C: Jose looked up and up and up until his neck hurt, and he still couldn't see the tops of the buildings.","A: Tên lửa gầm vang cất cánh, những khuôn mặt xanh nhỏ buồn bã nhìn theo. B: Hải âu bay sau thuyền đánh cá, chờ lao xuống khi kéo lưới. C: Jose ngước lên mãi đến mỏi cổ vẫn không thấy đỉnh các tòa nhà.","🚀🌊🏙️","listen"],
 ["mc","Match: Story A is set in …",["space","a big city","over the ocean"],"A rocket → space.","Tên lửa → vũ trụ.","🚀"],
 ["mc","Match: Story B is set …",["over the ocean","in space","in a big city"],"A seagull and a fishing boat.","Hải âu và thuyền đánh cá.","🌊"],
 ["mc","Match: Story C is set in …",["a big city","space","the ocean"],"Very tall buildings!","Những tòa nhà rất cao!","🏙️"],
 ["say","Lauri Kubuitsile is an author. She lives in Botswana. She writes children's books and has won prizes for them. One of her books is called Sorry Isn't Good Enough.","Lauri Kubuitsile là tác giả sống ở Botswana, viết sách thiếu nhi và đoạt giải. Một cuốn sách của bà là Sorry Isn't Good Enough.","🇧🇼"],
 ["read","Sorry Isn't Good Enough, Part 1 (retold)","At break time, Omar, Pelo and Beno were playing catch in the school playground. Pelo asked Beno to throw him the ball, jumped high and caught it, and Omar cheered for him. Next, Beno threw the ball towards Omar. But Pelo pushed in front of Omar to grab it, and Omar fell over. Omar said it wasn't fair. Pelo was pleased he had caught the ball and didn't notice that Omar was upset. Then the bell rang. Beno and Pelo ran back to their classroom, but Omar sat on the ground, rubbing his sore knee, and watched them go.","Giờ ra chơi Omar, Pelo, Beno chơi ném bắt bóng. Beno ném cho Omar nhưng Pelo chen lên giành bóng, Omar ngã. 'Không công bằng!' Chuông reo, hai bạn chạy vào lớp, Omar ngồi xoa đầu gối đau.","scene:catch","listen"],
 ["mc","a) Did Pelo want to hurt Omar?",["No, he just wanted the ball.","Yes, he wanted to hurt him."],"He was happy he caught it – he didn't think about Omar.","Bạn ấy chỉ vui vì bắt được bóng, không nghĩ đến Omar.","⚾"],
 ["mc","b) What could Pelo have said to Omar?",["I'm sorry. Are you okay?","Go away!","Ha ha!"],"Kind words matter.","Lời nói tử tế rất quan trọng.","🤝"],
 ["say","Part 2: Omar was angry with Pelo because Pelo didn't say sorry or anything. Their friend Zara made Pelo go and say sorry to Omar. In the end Omar said: I forgive you.","Phần 2: Omar giận vì Pelo không xin lỗi. Bạn Zara bảo Pelo phải xin lỗi Omar. Cuối cùng Omar nói: Tớ tha lỗi cho cậu.","🤗"],
 ["mc","Why was Omar angry with Pelo?",["Pelo didn't say sorry.","Pelo took his lunch.","Pelo won a prize."],"He didn't say sorry or anything.","Bạn ấy chẳng xin lỗi gì cả.","😠"],
 ["mc","What did Zara make Pelo do?",["say sorry to Omar","go home","throw the ball"],"You must tell Omar!","Cậu phải nói với Omar!","🙏"],
 ["read","The Best Tailor in Pinbaué (retold)","Edinho tells us about his Uncle Flores, the best tailor in Pinbaué, a small town in Brazil. People have stopped buying his bright, colourful clothes. As they walk by the river, Uncle Flores says sadly that the new factory has changed the village. Grey dust covers every house, Edinho's dad catches only tiny fish, and the river is too dirty for washing clothes. Edinho remembers the bright materials he found in a chest of drawers at his uncle's house. He reminds his uncle that he used to make lovely dresses, smart suits and even carnival costumes. Why not make colourful curtains? Uncle Flores thinks for a moment and agrees it is a good idea. That same day he sits down at his sewing machine again – cloc, cloc, cloc!","Chú Flores là thợ may giỏi nhất thị trấn Pinbaué (Brazil) nhưng không ai mua quần áo nữa. Nhà máy phủ bụi xám cả làng, sông đục ngầu. Cháu Edinho tìm thấy vải màu và gợi ý may rèm cửa. Ngay hôm đó chú ngồi lại bên máy may. Cạch cạch cạch!","scene:tailor","listen"],
 ["mc","True or false? Uncle Flores thinks the factory has made the village a worse place to live.",["True","False"],"Grey dust and a murky river.","Bụi xám và dòng sông đục.","🏭"],
 ["mc","True or false? The river is clean.",["False","True"],"The women can't wash clothes in the murky river.","Phụ nữ không giặt được ở dòng sông đục.","🌫️"],
 ["mc","True or false? Edinho has had a good idea.",["True","False"],"Colourful curtains! That's not a bad idea.","Rèm cửa nhiều màu! Ý hay đấy.","💡"],
 ["say","Michael Morpurgo is an author from England. He has won many prizes. He started making up stories to tell his children when he was a primary school teacher. An albatross is the world's biggest seabird. It builds its nest on cliff tops.","Michael Morpurgo là tác giả người Anh, đoạt nhiều giải. Ông bắt đầu sáng tác để kể cho con khi còn là giáo viên tiểu học. Hải âu lớn là loài chim biển to nhất, làm tổ trên vách đá.","scene:albatross"],
 ["read","Little Albatross, Parts 1 and 2 (retold)","Little Albatross has grown big and strong, so one sunny day his mother and father decide he is safe to leave alone for a while. They fly off over the cliffs to catch fish, singing as they go. They don't notice a dangerous killer bird below them – but the killer bird notices them, and he waits. Little Albatross has never been alone before. He calls for his parents to come back, but the wind and the waves are so loud that they can't hear him. That night he sleeps alone in his nest, and the killer bird creeps nearer and nearer. The next morning, far out at sea, his parents spot a fishing boat followed by thousands of shiny silver fish. What a feast! They dive straight down into the water and catch fish after fish.","Bố mẹ hải âu thấy con đã lớn nên bay đi bắt cá. Họ không thấy con chim săn mồi đang rình. Hải âu con gọi nhưng gió gào, sóng gầm, bố mẹ không nghe. Đêm đó chim săn mồi lén lại gần. Sáng ra, bố mẹ thấy đàn cá bạc sau thuyền đánh cá và lao xuống bắt cá.","scene:albatross","listen"],
 ["mc","a) What do you think the killer bird wants to do?",["catch Little Albatross","help him","sing with him"],"He was watching. He was waiting.","Nó đang rình và chờ đợi.","🦅"],
 ["mc","Why didn't Mother and Father hear Little Albatross?",["The wind screamed and the waves roared.","They were asleep.","They were too far away in a city."],"Too much noise!","Quá ồn!","🌬️"],
 ["mc","What did the parents see in the morning?",["a fishing boat with thousands of fish","a big storm","their nest"],"A feast of fish!","Một bữa tiệc cá!","🐟"],
 ["mc","What do you think will happen next? (Look at the story mountain!)",["The parents get caught in the fishing net.","They fly to the moon.","Little Albatross goes to school."],"The problem gets bigger in the middle of the story mountain.","Ở giữa 'ngọn núi câu chuyện', rắc rối lớn dần.","⛰️"]
],

[
 ["say","Unit 8: Underwater life. Session 8.1: Life under the sea. An ocean is a huge area of salt water. A sea is part of an ocean, usually close to land. A lake is an area of fresh water.","Unit 8: Sự sống dưới nước. Đại dương là vùng nước mặn rộng lớn. Biển là một phần của đại dương, gần đất liền. Hồ là vùng nước ngọt.","scene:coral"],
 ["mc","Put the sea creatures in alphabetical order. Which comes first?",["crab","shark","whale"],"c – s – w","c đứng trước s và w.","🦀"],
 ["read","Body parts of a fish","A fish breathes underwater through its gills. Gills are slits in the fish's skin. The gills are just behind the fish's head. A fish waves its tail from side to side to move through the water. The fish's skin is covered in stiff circles called scales. They help to protect the fish. Fish have several fins. They use their fins to steer.","Cá thở dưới nước bằng mang – những khe sau đầu. Cá vẫy đuôi sang hai bên để bơi. Da cá có vảy cứng bảo vệ. Cá có nhiều vây để lái hướng.","scene:fish","listen"],
 ["mc","Where are the gills?",["just behind the fish's head","on the tail","under the fins"],"Gills are slits behind the head.","Mang ở ngay sau đầu.","🐟"],
 ["mc","How does a fish move through the water?",["It waves its tail from side to side.","It flaps its fins up and down.","It walks."],"Side to side!","Sang hai bên!","↔️"],
 ["mc","What do scales do?",["help to protect the fish","help it breathe","help it see"],"Stiff circles that protect.","Những miếng cứng bảo vệ cá.","🛡️"],
 ["read","Whales","Whales live in the sea, but they are not fish. They need to breathe air. Whales breathe through blowholes. They are on top of the whale's head, so the whale can breathe when it comes to the surface of the sea. Some whales can hold their breath underwater for more than two hours! A whale's tail has two tail flukes. The flukes move up and down to push the whale forwards through the water.","Cá voi sống ở biển nhưng không phải cá; chúng thở không khí qua lỗ phun trên đỉnh đầu khi ngoi lên mặt nước. Có con nín thở hơn hai tiếng! Đuôi có hai thùy chuyển động lên xuống đẩy cá voi đi.","scene:whale","listen"],
 ["mc","Why are the blowholes on top of the whale's head?",["so it can breathe at the surface","so it can eat","so it can hear"],"It comes up to the surface to breathe.","Ngoi lên mặt nước để thở.","🐋"],
 ["mc","How long can some whales hold their breath?",["more than two hours","two minutes","two days"],"More than two hours!","Hơn hai tiếng!","⏱️"],
 ["read","Baleen Whales","Baleen whales are big, but they eat some of the smallest creatures on earth. They have huge plates in their mouths made of baleen. Baleen looks like the teeth in a comb. It is made from the same material as your fingernails. When a baleen whale wants to feed, it opens its mouth very wide and fills it with seawater. The water is full of tiny creatures called krill and plankton. As its mouth closes, the whale pushes the seawater out through its baleen. But the krill and plankton are trapped, so the whale can swallow them.","Cá voi tấm sừng rất to nhưng ăn sinh vật tí hon. Trong miệng có tấm sừng giống răng lược, làm từ chất như móng tay. Nó há miệng ngậm nước biển đầy nhuyễn thể, rồi đẩy nước ra qua tấm sừng; thức ăn bị giữ lại và nuốt.","scene:whale","listen"],
 ["mc","Baleen is made from the same material as your …",["fingernails","hair","teeth"],"Like the teeth in a comb!","Như răng lược!","💅"],
 ["order","Put the events in order.","The whale opens its mouth very wide | It pushes the seawater out through its baleen | It swallows the trapped krill","1 open, 2 push water out, 3 swallow.","1 há miệng, 2 đẩy nước ra, 3 nuốt.","|"],
 ["read","Sea creatures chart","The great white shark is a fish. It eats any animal in the sea. It swims with its fins and its tail. It drowns if it stops swimming! The leatherback turtle is a reptile. It eats jellyfish. It flaps its flippers in the water and drags itself on land. It grows over 2 metres long. The emperor penguin is a bird. It eats fish. It waddles on its feet or slides on its tummy, and uses its wings as flippers to swim. It can stay underwater for 20 minutes.","Cá mập trắng là cá, ăn mọi con vật dưới biển, bơi bằng vây và đuôi, sẽ chết đuối nếu ngừng bơi. Rùa da là bò sát, ăn sứa, dài hơn 2 mét. Chim cánh cụt hoàng đế là chim, ăn cá, đi lạch bạch hoặc trượt bằng bụng, lặn được 20 phút.","🦈🐢🐧","listen"],
 ["mc","Which sea creature is a reptile?",["leatherback turtle","great white shark","emperor penguin"],"Reptiles have dry skin with scales.","Bò sát có da khô, có vảy.","🐢"],
 ["mc","Which creature swims with its fins and its tail?",["great white shark","emperor penguin","leatherback turtle"],"It drowns if it stops swimming!","Nó chết đuối nếu ngừng bơi!","🦈"],
 ["mc","Which creature waddles?",["emperor penguin","great white shark","leatherback turtle"],"Waddle = walk from side to side.","Đi lạch bạch.","🐧"],
 ["read","Coral reefs (website)","Coral reefs are like underwater lands made of coral. Each coral is made up of tiny animals called polyps. Polyps have hard shells, and there are millions of polyps in every coral. Polyps stay in one place, so their shells join together. Each coral has its own shape and colour, so a coral reef is a very colourful place. Coral reefs grow in seas and oceans which are warm and sunny all year round. The water must be clear, calm and peaceful so sunlight can reach the corals. The biggest coral reef in the world is near Australia. It is called the Great Barrier Reef. It stretches for more than 2600 km.","Rạn san hô như vùng đất dưới nước, làm từ hàng triệu con polyp có vỏ cứng dính vào nhau. San hô nhiều hình dạng, màu sắc. Rạn mọc ở biển ấm, nắng quanh năm, nước trong và lặng. Rạn lớn nhất là Great Barrier ở gần Úc, dài hơn 2600 km.","scene:coral","listen"],
 ["mc","a) What is a coral reef?",["an underwater land made of coral","a kind of fish","a boat"],"Like an underwater land!","Như một vùng đất dưới nước!","🪸"],
 ["mc","b) Why is a coral reef so colourful?",["Each coral has its own shape and colour.","People paint it.","The fish are painted."],"Millions of different corals!","Hàng triệu loại san hô khác nhau!","🌈"],
 ["mc","Coral reefs grow in seas that are …",["warm, sunny, clear and calm","cold and dark","muddy"],"So sunlight can reach the corals.","Để ánh nắng chiếu tới san hô.","☀️"]
],
// ---------- Unit 9 ----------
[
 ["say","Unit 9: Creatures everywhere. Session 9.1: The elephant. This is a traditional rhyme from India.","Unit 9: Muôn loài khắp nơi. Bài 9.1: Con voi – bài đồng dao truyền thống của Ấn Độ.","scene:elephant"],
 ["read","The Elephant (traditional Indian rhyme)","Through the jungle the elephant goes, swaying his trunk to and fro, munching, crunching, tearing trees, stamping seeds, eating leaves. His eyes are small, his feet are fat. Hey, elephant, don't do that!","Con voi đi xuyên rừng, đung đưa vòi qua lại, nhai rau ráu, xé cây, giẫm hạt, ăn lá. Mắt nhỏ, chân to. Này voi ơi, đừng làm thế!","scene:elephant"],
 ["mc","a) Where is the elephant in this poem?",["in the jungle","in a city","in the sea"],"Through the jungle the elephant goes.","Voi đi xuyên rừng.","🌴"],
 ["mc","b) How would you know the elephant had been past a tree?",["The tree would be torn and the leaves eaten.","The tree would be painted.","The tree would be taller."],"Tearing trees, eating leaves!","Xé cây, ăn lá!","🌳"],
 ["mc","Which word from the poem rhymes with 'trees'?",["leaves","fat","goes"],"trees – leaves (nearly rhymes).","trees vần gần với leaves.","🍃"],
 ["mc","Which is a verb from the poem?",["munching","small","jungle"],"munching, crunching, tearing, stamping, eating.","Động từ: nhai, xé, giẫm, ăn.","🐘"],
 ["say","Session 9.2: On safari. We listen to a counting poem about a safari in Tanzania, in Africa. Animals live on the wide, grassy plains under the hot sun.","Bài 9.2: Đi săn ảnh. Bài thơ đếm số về chuyến đi ở Tanzania, châu Phi. Muông thú sống trên đồng cỏ rộng dưới nắng nóng.","🦁🦒🦓"],
 ["mc","Which country is the safari poem set in?",["Tanzania","England","Japan"],"Tanzania is in Africa.","Tanzania ở châu Phi.","🌍"],
 ["mc","Which word rhymes with 'two'?",["blue","bee","cat"],"two – blue – zoo.","two vần với blue.","2️⃣"],
 ["say","Session 9.3: Rainforest. Over in the Jungle is a counting poem about the South American rainforest. A super-slow mother sloth and her nine little sloths hang from a heavy vine. 'Creep,' said the mother. 'We creep,' said the nine. So they crept, then they slept. A father howler monkey and his ten little howlers live in their rainforest den. 'Hoot,' said the father. 'We hoot,' said the ten. So they hooted and they hollered!","Bài 9.3: Over in the Jungle – bài thơ đếm về rừng mưa Nam Mỹ. Mẹ lười và chín con treo trên dây leo: 'Bò nào' – chúng bò rồi ngủ. Bố khỉ rú và mười con trong hang: 'Hú nào' – chúng hú vang!","scene:sloths"],
 ["mc","How many little sloths are there?",["nine","ten","two"],"Her little sloths nine.","Chín chú lười con.","9️⃣"],
 ["mc","What did the little howler monkeys do?",["hooted and hollered","crept and slept","swam"],"So they hooted and they hollered.","Chúng hú và gào vang.","🐒"],
 ["mc","creep → crept. sleep → ?",["slept","sleeped","sleepy"],"Past tense: slept.","Quá khứ: slept.","😴"],
 ["read","How Doth the Little Crocodile (Lewis Carroll)","How doth the little crocodile improve his shining tail, and pour the waters of the Nile on every golden scale! How cheerfully he seems to grin, how neatly spreads his claws, and welcomes little fishes in with gently smiling jaws!","Chú cá sấu nhỏ chăm chút cái đuôi bóng loáng, tưới nước sông Nile lên từng chiếc vảy vàng! Chú cười tươi vui, xòe móng gọn gàng, và mỉm cười dịu dàng mời cá nhỏ vào hàm!","scene:crocodile"],
 ["mc","How many -ly adverbs can you find? cheerfully, neatly, gently …",["three","one","five"],"cheerfully, neatly, gently.","Ba trạng từ.","3️⃣"],
 ["mc","How Doth the Little Crocodile was written by Lewis Carroll in which book?",["Alice in Wonderland","Little Albatross","Eat Your Peas"],"More than 150 years ago!","Hơn 150 năm trước!","📖"],
 ["say","If You Should Meet a Crocodile was written by Christine Fletcher when she was only 12. It says: don't poke a crocodile with a stick, ignore his welcoming smile and be careful not to stroke him – he's ready for his dinner!","Bài If You Should Meet a Crocodile do Christine Fletcher viết khi mới 12 tuổi: đừng lấy gậy chọc cá sấu, đừng tin nụ cười chào đón, đừng vuốt ve nó – nó đang sẵn sàng ăn tối!","🐊"],
 ["mc","What should you NOT do if you meet a crocodile?",["poke him with a stick","walk away","stay safe"],"Don't take a stick and poke him!","Đừng lấy gậy chọc nó!","🚫"],

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function fullSentence0(q){
 const pick=x=>String(x).includes("|")?String(x).split("|").pop():String(x);
 let r=pick(q.right);

 if(/…$/.test(s)) return clean(s.replace(/…$/," "+r+"."));
 return clean(s)+" — "+r;
}

  bubble=listenMode?`Listen carefully: “${st[1]}”. Then answer my questions!`:`Let's read: “${st[1]}”. Read with me!`; vi=(listenMode?"Nghe thật kỹ nhé, sau đó trả lời câu hỏi của cô! · ":"Mình cùng đọc nhé! · ")+st[3]; say=`${listenMode?"Listen carefully.":"Let's read."} ${st[1]}.`;
  const sents=txt.match(/[^.!?]+[.!?]+['’”]?|[^.!?]+$/g)||[txt];
  body=imgBox(st[4])+`<div class="story ${listenMode?"hidetext":""}" id="storybox"><h3>${listenMode?"🎧":"📖"} ${esc(st[1])}</h3>${listenMode?`<button class="ghost showtxt" id="showtxt">👀 Show the text · Xem chữ</button>`:""}<p>${sents.map((s,j)=>`<span class="sent" data-j="${j}">${esc(s.trim())}</span>`).join(" ")}</p>
   ${custom?`<p class="vn" style="font-size:14px">📋 Đang dùng nguyên văn do phụ huynh nhập.</p>`:""}<button class="trbtn" id="paste" style="font-size:14px">📋 ${custom?"Sửa":"Dán"} nguyên văn từ sách (phụ huynh)</button>
   <div class="btns" style="margin-top:8px"><button class="main" id="readall">▶ Read to me · Đọc cho con nghe</button><button class="ghost" id="stopread">⏹</button></div><p class="vn" style="margin:6px 0 0">Bấm vào từng câu để nghe lại câu đó.</p></div>` }
 if(kind==="word"){ bubble=`New word: “${st[1]}”. Listen and say it!`; vi=`Từ mới: ${st[1]} = ${st[3]}. Nghe rồi nói theo nhé!`; say=`${st[1]}. ${st[1]}. ${st[4]}`;
  body=`<div class="wcard"><div class="emo">${st[2]}</div><div class="ww">${esc(st[1])}</div><div class="vn" style="font-size:18px">🇻🇳 ${esc(st[3])}</div>
   <div class="ex">🔊 <a href="#" id="exs">${esc(st[4])}</a></div></div>${micUI(st[1])}` }
 if(kind==="speak"){ bubble=`Repeat after me: “${st[1]}”`; vi=`Con nhắc lại theo cô nhé: ${st[2]}`; say=`Repeat after me. ${st[1]}`;
  body=`<div class="wcard"><div class="ww" style="font-size:clamp(22px,5vw,30px)">${esc(st[1])}</div><div class="vn">🇻🇳 ${esc(st[2])}</div></div>${micUI(st[1])}` }
 if(["mc","fill","order","listen"].includes(kind)){ interactive=true; LS.tries=0; LS.done=false;
  if(kind==="mc"){ bubble=st[1]; say=st[1]; const opts=shuffle(st[2]);
   body=imgBox(st[5])+(LS.lastRead?`<details class="relisten"><summary>🎧 Listen again / read the text · Nghe lại bài “${esc(LS.lastRead.title)}”</summary><p>${esc(LS.lastRead.text)}</p><button class="trbtn" id="relisten">🔊 Play</button></details>`:"")+`<div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>${chk()}` }
  if(kind==="listen"){ bubble="Listen and tap the right picture."; say=st[1]; const opts=shuffle(st[2]);
   body=`<div class="pic"><button class="big-listen" id="play" aria-label="play">🔊</button></div><div class="opts pics">${opts.map(o=>{const [e,w]=o.split("|");return `<button class="opt" data-v="${esc(o)}"><span class="e">${e}</span><span class="w hidden">${esc(w)}</span></button>`}).join("")}</div>${chk()}` }
  if(kind==="fill"){ bubble=st[1]; say=st[1].replace(/[_ ]{3,}/g," blank "); body=imgBox(st[5])+`<form class="fillrow" id="ff"><input id="fin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type here…"><button class="main">Check</button></form>` }
  if(kind==="order"){ bubble=st[1]; say=st[1]; const sp=st[6]||" "; LS.parts=st[2].split(sp).map(x=>x.trim()); let pool; do{pool=shuffle(LS.parts)}while(LS.parts.length>1&&pool.join()==LS.parts.join());
   body=`<div class="tiles ans" id="ans"></div><div class="tiles" id="pool">${pool.map(p=>`<button class="tile">${esc(p)}</button>`).join("")}</div><div class="next" style="justify-content:flex-start"><button class="main" id="ochk" disabled>Check</button></div>` }
  vi="Con trả lời câu hỏi của cô nhé!";
 }
 app.innerHTML=`<div class="top"><button class="ghost" id="back" aria-label="back">◀</button><div class="bar"><i style="width:${LS.i/n*100}%"></i></div><span class="count">${LS.i+1} / ${n}</span><button class="ghost" data-voice aria-label="voice settings">🗣️</button></div>
 <div class="card"><p class="sub" style="margin:0 0 8px">Unit ${L.u} · ${esc(L.title)} · ${esc(P.n)}</p>
 <div class="tbox">${TEACHER}<div class="bubble"><div id="btxt">${esc(bubble)}</div><div class="bbtn"><button class="trbtn" id="again">🔊 Again</button><button class="trbtn" id="tvi">🇻🇳 Tiếng Việt</button></div><div class="vi hidden" id="vitxt">${esc(vi)}</div></div></div>
 ${body}<div class="fb" id="fb"></div>
 <div class="next"><button class="main" id="nxt" ${interactive?"disabled":""}>${LS.i+1<n?"Next ▶":"Finish 🏁"}</button></div></div>`;
 $("#back").onclick=()=>lesUnit(LS.k);
 $("#again").onclick=()=>talk(say);
 $("#tvi").onclick=()=>$("#vitxt").classList.toggle("hidden");
 $("#nxt").onclick=()=>{ LS.i++; LS.i<n?lesStep():lesEnd() };
 if(kind==="read"){ const spans=[...app.querySelectorAll(".sent")]; let stop=false;
  const play=j=>{ if(stop||j>=spans.length){ spans.forEach(s=>s.classList.remove("on")); return } spans.forEach(s=>s.classList.toggle("on",s===spans[j])); spans[j].scrollIntoView({block:"nearest",behavior:"smooth"}); talk(spans[j].textContent,()=>setTimeout(()=>play(j+1),250)) };
  $("#readall").onclick=()=>{ stop=false; play(0) }; $("#stopread").onclick=()=>{ stop=true; try{speechSynthesis.cancel()}catch(e){} spans.forEach(s=>s.classList.remove("on")) };
  spans.forEach((s,j)=>s.onclick=()=>{ stop=true; spans.forEach(x=>x.classList.toggle("on",x===s)); talk(s.textContent) });
  if($("#showtxt")) $("#showtxt").onclick=()=>{ $("#storybox").classList.remove("hidetext"); $("#showtxt").remove() };
  $("#paste").onclick=()=>pasteText(tkey,st[1],custom);
  talk(say,()=>{ if(!stop) play(0) }); }
 else if(kind==="listen"){ $("#play").onclick=()=>speak(st[1],.75); talk("Listen and tap the right picture.",()=>speak(st[1],.75)) }
 else talk(say);
 if(kind==="word"){ $("#exs").onclick=e=>{e.preventDefault();speak(st[4])} }
 if(kind==="word"||kind==="speak") bindMic(st[1]);
 if($("#relisten")) $("#relisten").onclick=()=>talk(LS.lastRead.text);
 if(kind==="mc"||kind==="listen"){ let sel=null;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(b.disabled||LS.done)return; app.querySelectorAll(".opt.sel").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel=b; $("#lcf").disabled=false });
  $("#lcf").onclick=()=>{ if(sel) lesAnswer(sel.dataset.v===st[2][0], st, sel) } }
 if(kind==="fill"){ const f=$("#fin"); $("#ff").onsubmit=e=>{ e.preventDefault(); if(!f.value.trim()||LS.done)return; lesAnswer(st[2].some(a=>norm(a)===norm(f.value)), st, null, f.value) } }
 if(kind==="order"){ const ans=$("#ans"),pool=$("#pool"),c=$("#ochk");
  app.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{ if(LS.done)return; (t.parentNode===pool?ans:pool).appendChild(t); c.disabled=pool.children.length>0 });
  c.onclick=()=>{ const v=[...ans.children].map(t=>t.textContent); const ok=v.join("|")===LS.parts.join("|");
   if(!ok){ [...ans.children].forEach(t=>pool.appendChild(t)); c.disabled=true } lesAnswer(ok,st) } }
 window.scrollTo(0,0)}

const chk=()=>`<div class="next" style="justify-content:flex-start"><button class="main" id="lcf" disabled>Check ✓</button></div>`;
const micUI=w=>`<div class="mic"><button class="main" id="mic">🎤 Say it · Con nói thử</button><div id="micres" class="vn"></div></div>`;
function bindMic(target){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition, btn=$("#mic"), res=$("#micres");
 btn.onclick=()=>{
  if(!SR){ res.innerHTML="Máy này chưa hỗ trợ nhận giọng nói. Con hãy nói to theo cô nhé! 👍"; talk("Good! Say it loudly: "+target); return }
  try{ speechSynthesis.cancel() }catch(e){}
  const rec=new SR(); rec.lang="en-GB"; rec.interimResults=false; rec.maxAlternatives=3;
  btn.disabled=true; btn.textContent="🎙️ Listening… · Cô đang nghe…";
  rec.onresult=e=>{ const alts=[...e.results[0]].map(r=>r.transcript); const tw=norm(target).split(" ");
   const best=Math.max(...alts.map(a=>{const aw=norm(a).split(" ");return tw.filter(w=>aw.includes(w)).length/tw.length}));
   const said=alts[0];
   if(best>=.6){ res.innerHTML=`✅ You said: “${esc(said)}”. Great!`; const p=shuffle(PRAISE)[0]; talk(p); tone(true) }
   else { res.innerHTML=`🔁 I heard: “${esc(said)}”. Listen and try again! · Cô nghe chưa rõ, con thử lại nhé.`; talk("Let's try again. "+target); tone(false) } };
  rec.onerror=ev=>{ res.innerHTML=ev.error==="not-allowed"||ev.error==="service-not-allowed"?"Trình duyệt chưa cho dùng micro. Hãy cho phép micro, hoặc con nói to theo cô nhé! 👍":"Cô chưa nghe thấy. Con bấm 🎤 và nói lại nhé."; };
  rec.onend=()=>{ btn.disabled=false; btn.textContent="🎤 Say it · Con nói thử" };
  try{ rec.start() }catch(e){ btn.disabled=false; res.textContent="Không mở được micro." }
 } }

function lesAnswer(ok, st, btn, typed){
 const fb=$("#fb"); LS.tries++;
 const kind=st[0], right=kind==="order"?st[2].split(st[6]||" ").map(x=>x.trim()).join(st[6]?" → ":" "):(Array.isArray(st[2])?st[2][0]:st[2]);
 const shown=String(right).includes("|")?right.split("|")[1]:right;
 if(LS.tries===1) LS.asked++;
 if(ok){ if(LS.tries===1) LS.first++; LS.done=true;
  const p=shuffle(PRAISE)[0];
  if(btn){ btn.classList.remove("sel"); btn.classList.add("ok") }
  app.querySelectorAll(".opt .w").forEach(w=>w.classList.remove("hidden"));
  fb.className="fb show pop ok"; fb.innerHTML=`<strong>✅ ${p}</strong> <span class="vn">${PRAISE_VI[p]}</span><div class="full"><button class="say sm" id="sf">🔊</button><span>${esc(shown)}</span></div><div>💡 ${esc(st[3]||"")}</div><div class="vn">🇻🇳 ${esc(st[4]||"")}</div>`;
  $("#sf").onclick=()=>speak(shown,.8); talk(p+" "+(st[3]||"")); tone(true); lesUnlock(); return }
 tone(false);
 if(LS.tries<2){
  if(btn){ btn.classList.remove("sel"); btn.classList.add("bad"); btn.disabled=true; $("#lcf").disabled=true }
  const hint = kind==="fill" ? `Hint: it starts with “${String(st[2][0]).charAt(0)}” and has ${String(st[2][0]).length} letters.` : "Look again and think!";
  fb.className="fb show pop bad"; fb.innerHTML=`<strong>🤔 Not quite. Try again!</strong> <span class="vn">Chưa đúng rồi, con thử lại nhé!</span><div>${esc(hint)}</div>`;
  talk("Not quite. Try again! "+(kind==="fill"?hint:""));
  return }
 LS.done=true;
 if(btn){ btn.classList.remove("sel"); btn.classList.add("bad") }
 app.querySelectorAll(".opt").forEach(b=>{ if(b.dataset.v===st[2][0]) b.classList.add("ok"); b.disabled=true; const w=b.querySelector(".w"); if(w)w.classList.remove("hidden") });
 fb.className="fb show pop bad"; fb.innerHTML=`<strong>Let's learn it together.</strong> <span class="vn">Mình cùng học câu này nhé.</span><div>The answer is: <b>${esc(shown)}</b></div><div class="full"><button class="say sm" id="sf">🔊</button><span>${esc(shown)}</span></div><div>💡 ${esc(st[3]||"")}</div><div class="vn">🇻🇳 ${esc(st[4]||"")}</div>`;
 $("#sf").onclick=()=>speak(shown,.8); talk("The answer is: "+shown+". "+(st[3]||"")); lesUnlock() }
function lesUnlock(){ const b=$("#nxt"); b.disabled=false; b.focus({preventScroll:true}); $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"}) }

function lesEnd(){
 const L=LESSONS[LS.k], P=L.parts[LS.p], r=LS.asked?LS.first/LS.asked:1, s=r>=.9?3:r>=.6?2:1;
 const key=LS.k+"-"+LS.p; if(LP[key]==null||s>LP[key]) LP[key]=s; saveLP();
 const nextP=LS.p+1<L.parts.length?LS.p+1:null;
 app.innerHTML=`<div class="top"><button class="ghost" id="back">◀ Unit ${L.u}</button><span class="count">${esc(P.n)}</span></div>
 <div class="card" style="text-align:center"><div class="tbox" style="justify-content:center">${TEACHER}</div>
 <h1 style="font-size:clamp(26px,5vw,38px);margin-top:10px">${s===3?"Amazing work!":s===2?"Good job!":"Well done for trying!"}</h1>
 <div style="font-size:44px;color:#f59e0b">${"★".repeat(s)}${"☆".repeat(3-s)}</div>
 <p>You answered <b>${LS.first}</b> of <b>${LS.asked}</b> questions right the first time.</p>
 <p class="vn" style="font-size:17px">Con trả lời đúng ngay lần đầu ${LS.first}/${LS.asked} câu. ${s===3?"Cô rất tự hào về con!":s===2?"Con làm tốt lắm, cố thêm chút nữa nhé!":"Con học lại bài này một lần nữa nhé!"}</p>
 <div class="btns" style="justify-content:center">${nextP!=null?`<button class="main" id="np">Next lesson ▶ ${esc(L.parts[nextP].n)}</button>`:`<button class="main" id="rq">📝 Review quiz · Làm bài ôn tập Unit ${L.u}</button>`}<button class="ghost" id="rp">🔁 Learn again</button><button class="ghost" id="hm">🏠 Home</button></div></div>`;
 talk(s===3?"Amazing work! I'm so proud of you!":s===2?"Good job! Keep going!":"Well done for trying! Let's practise again.");
 $("#back").onclick=()=>lesUnit(LS.k); $("#hm").onclick=home; $("#rp").onclick=()=>lesStart(LS.k,LS.p);
 if(nextP!=null) $("#np").onclick=()=>lesStart(LS.k,nextP); else $("#rq").onclick=()=>start("p"+L.u);
 if(s===3) tone(true);
 window.scrollTo(0,0)}

app.addEventListener("click",e=>{ if(e.target.closest("[data-voice]")) openVoice() });
home();
}

</script>
</body>
</html>

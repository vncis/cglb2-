<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global English 2 Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: cheerful, calm, made for a 7-year-old and her parent
   IDEA: a sticker workbook – each unit is a bright tab, each question a page
   PICTURE: big emoji/SVG illustration on a soft card above the answers
   COLOUR and TYPE: sunshine yellow ground, deep ink blue, coral accent; Fredoka
   LAYOUT: home = unit grid; quiz = one column card; result = score ring + skill bars + mistake list */
:root{color-scheme:light dark;
 --bg:light-dark(#fff6d6,#14213d);--card:light-dark(#ffffff,#1e2d50);--ink:light-dark(#14213d,#f3f6ff);
 --soft:light-dark(#fdf0c2,#26375f);--muted:light-dark(#5a6482,#aab4d4);--line:light-dark(#efe1ad,#33466f);
 --acc:#ff5d5d;--ok:#16a34a;--bad:#e11d48;--okbg:light-dark(#dcfce7,#12432a);--badbg:light-dark(#ffe4e6,#4a1726)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Fredoka,"Segoe UI",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,14px) 48px}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
header .logo{font-size:44px;line-height:1}
h1{font-size:clamp(28px,5vw,42px);line-height:1.05;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:24px;margin:26px 0 10px}
.sub{color:var(--muted);margin:4px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.unit{background:var(--card);border:0;border-radius:20px;padding:16px;text-align:left;display:flex;gap:12px;align-items:center;min-height:96px;box-shadow:0 3px 0 var(--line);transition:transform .15s}
.unit:hover{transform:translateY(-2px)}
.unit .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:32px;flex:none}
.unit b{display:block;font-size:14px;color:var(--muted);font-weight:500}
.unit span.t{display:block;font-weight:600;font-size:18px;line-height:1.2}
.stars{font-size:14px;letter-spacing:1px;margin-top:3px;color:#f59e0b}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ghost{background:var(--card);border:0;border-radius:14px;min-height:44px;padding:0 14px;box-shadow:0 2px 0 var(--line)}
.bar{flex:1;height:14px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .3s}
.count{font-weight:600;white-space:nowrap}
.card{background:var(--card);border-radius:26px;padding:clamp(16px,3vw,28px);box-shadow:0 4px 0 var(--line)}
.qtext{font-size:clamp(20px,3.4vw,26px);font-weight:600;line-height:1.3;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start}
.say{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--soft);font-size:22px}
.pic{background:var(--soft);border-radius:20px;min-height:170px;display:grid;place-items:center;margin-bottom:16px;padding:12px}
.pic .emo{font-size:clamp(80px,16vw,120px);line-height:1.1;text-align:center}
.pic svg{width:100%;max-width:260px;height:auto;max-height:230px}
.pic .read{font-size:19px;max-width:560px;background:var(--card);padding:14px 18px;border-radius:14px;border-left:6px solid var(--acc)}
.big-listen{width:120px;height:120px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:56px;box-shadow:0 6px 0 #c63b3b}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.opts.pics{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.opt{background:var(--card);border:3px solid var(--line);border-radius:18px;min-height:58px;padding:10px 14px;font-size:19px;text-align:left;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--acc)}
.pics .opt{text-align:center;display:grid;place-items:center;gap:4px;min-height:130px}
.pics .opt .e{font-size:58px;line-height:1}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fillrow{display:flex;gap:10px;flex-wrap:wrap}
.fillrow input{flex:1 1 200px;font:inherit;font-size:22px;padding:10px 16px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);min-height:58px}
.main{background:var(--acc);color:#fff;border:0;border-radius:16px;min-height:56px;padding:0 26px;font-size:19px;font-weight:600;box-shadow:0 4px 0 #c63b3b}
.main:disabled{opacity:.5}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:8px;border-radius:16px}
.tiles.ans{background:var(--soft);border:3px dashed var(--line);margin-bottom:10px}
.tile{background:var(--card);border:3px solid var(--line);border-radius:14px;min-height:46px;padding:4px 14px;font-size:19px}
.fb{margin-top:16px;border-radius:18px;padding:14px 18px;display:none}
.fb.show{display:block}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb strong{font-size:20px}
.next{margin-top:14px;display:flex;justify-content:flex-end}
.res{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:22px;align-items:center}
.ring{position:relative;width:220px;height:220px;margin:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-size:56px;line-height:1}.ring .v small{display:block;color:var(--muted)}
.skill{display:grid;grid-template-columns:8.5em minmax(0,1fr) 3.5em;gap:10px;align-items:center;margin:8px 0}
.skill .track{height:16px;background:var(--soft);border-radius:9px;overflow:hidden}
.skill .track i{display:block;height:100%;border-radius:9px}
.skill .pc{text-align:right;font-weight:600;white-space:nowrap}
.vn{color:var(--muted);font-size:15px}
.mist{background:var(--card);border-radius:18px;padding:14px 16px;margin:10px 0;border-left:6px solid var(--bad)}
.mist .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.chip{border-radius:10px;padding:2px 10px;font-size:15px;background:var(--soft)}
.chip.r{background:var(--badbg)}.chip.g{background:var(--okbg)}
.advice{background:var(--soft);border-radius:18px;padding:14px 18px;margin-top:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hidden{display:none}
@media(max-width:600px){.res{grid-template-columns:1fr}.ring{width:180px;height:180px}.skill{grid-template-columns:6.5em minmax(0,1fr) 3em}}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chipopt{min-height:48px;padding:6px 14px;font-size:18px;border-radius:14px;text-align:center}
.sech{margin:0 0 10px;font-weight:600;color:var(--acc)}.sech span{color:var(--muted);font-weight:400}
.passage{background:var(--soft);border-radius:18px;padding:12px 16px;margin-bottom:14px;border-left:6px solid var(--acc)}
.passage summary{font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:44px}
.passage p{margin:6px 0 4px;font-size:18px;line-height:1.6}
.say.sm{width:40px;height:40px;font-size:18px;background:var(--card)}
.opt.sel,.opt.sel:hover{border-color:#3d8bff;background:light-dark(#e0edff,#1d3a6b);box-shadow:0 0 0 3px #3d8bff55}
#cfrow{align-items:center;gap:12px;flex-wrap:wrap}
.full{display:flex;gap:10px;align-items:center;margin:10px 0 6px;font-size:19px;font-weight:600}
.trbtn{border:0;border-radius:12px;min-height:44px;padding:0 14px;background:var(--card);font-weight:500;margin:4px 0}
.vi{font-size:18px;background:var(--card);border-radius:12px;padding:8px 12px;margin:6px 0}
.why{margin-top:8px}
.sayl{color:inherit}
.spellhint{display:grid;gap:6px;margin-bottom:12px}
.hintw{font-size:clamp(24px,6vw,32px);letter-spacing:2px;font-weight:600;white-space:pre-wrap}
.diff{font-size:20px;margin:4px 0;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.diff b{display:inline-grid;place-items:center;min-width:26px;height:32px;border-radius:6px;font-weight:600}
.lg{background:var(--okbg);color:var(--ok)}.lb{background:#fecdd3;color:#be123c}
.plist{display:grid;gap:10px}.part{min-height:72px;border:3px solid var(--line);box-shadow:none}
.ov{position:fixed;inset:0;background:#0007;display:grid;place-items:end center;z-index:50;padding:12px}
@media(min-width:600px){.ov{place-items:center}}
.sheet{background:var(--card);color:var(--ink);border-radius:24px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}
.sheet select{width:100%;font:inherit;font-size:17px;min-height:50px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px}
.lbl{display:block;font-weight:600;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{min-height:50px;border-radius:14px;border:3px solid var(--line);background:var(--card);font-size:16px}
.seg button.on{border-color:#3d8bff;background:light-dark(#e0edff,#1d3a6b);font-weight:600}
.vbtn{flex:none}@media(max-width:600px){.vbtn span{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.pop{animation:pop .35s}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// Cambridge Primary English – Learner's Book 2 (2nd edition, 2021)

const UNITS = [

 {t:"mc",s:"reading",l:"1.1",q:"The Show and Tell Day: what does Omar like to find?",img:"🐚🪨",o:["rocks and shells","paper animals","photos"],e:"Omar goes to the beach to find rocks and shells.",f:"Omar likes finding rocks and shells.",v:"Omar thích nhặt đá và vỏ sò."},
 {t:"mc",s:"reading",l:"1.1",q:"What does Zara like to make?",img:"🐸🐇",o:["animals from paper","cakes","photos"],e:"Zara makes ladybirds, frogs, fish and a rabbit from paper.",f:"Zara likes to make animals from paper.",v:"Zara thích gấp con vật bằng giấy."},
 {t:"mc",s:"reading",l:"1.1",q:"What is the problem at the end of the story?",img:"🧺",o:["They need a bigger table.","Miss Garcia is ill.","Omar lost his shells."],e:"They have too many things to show!",f:"They have too many things, so they need a bigger table.",v:"Các bạn có quá nhiều đồ, nên cần một cái bàn to hơn."},
 {t:"mc",s:"reading",l:"1.2",q:"Power Cut: what happened suddenly?",img:"💡❌",o:["The lights went off.","It started to snow.","Grandma arrived."],e:"There was a power cut, so the apartment was completely dark.",f:"Suddenly, the lights went off.",v:"Bỗng nhiên, đèn tắt phụt."},

 {t:"mc",s:"reading",l:"1.3",q:"How did Ben fix the problem of the melting cake?",img:"😋",o:["They ate the cake.","They put it outside.","They gave it to Grandma."],e:"Ben had a good idea: eat the ice cream cake before it melted!",f:"Ben's idea was to eat the cake before it melted.",v:"Ý của Ben là ăn luôn bánh trước khi nó chảy."},
 {t:"mc",s:"grammar",l:"1.4",q:"Which list uses commas and 'and' correctly?",img:"✏️",o:["I collect stickers, badges, pencils and feathers.","I collect stickers badges, pencils, and, feathers.","I collect, stickers badges pencils feathers."],e:"Commas separate the items. Put and between the last two items.",v:"Tớ sưu tầm hình dán, huy hiệu, bút chì và lông vũ."},
 {t:"mc",s:"reading",l:"1.5",q:"Huey Makes the Leap: what is new in the garden?",img:"🛝",o:["a swing and a sand pile","a pool and a tree","a dog and a cat"],e:"A swing and a sand pile as high as a little mountain.",f:"There is a new swing and a sand pile in the garden.",v:"Trong vườn có một cái xích đu và một đống cát mới."},
 {t:"mc",s:"reading",l:"1.5",q:"Why didn't Huey jump from the swing?",img:"🧢",o:["He was scared.","He was hungry.","He was asleep."],e:"Huey kept making excuses (baseball cap, lucky shirt, shoe laces) because he was scared.",f:"Huey didn't jump because he was scared.",v:"Huey không nhảy vì cậu ấy sợ."},
 {t:"fill",s:"grammar",l:"1.5",q:"check → He ___ (past)",img:"✅",a:["checked"],e:"Past: add -ed. check → checked.",f:"He checked.",v:"Cậu ấy đã kiểm tra."},
 {t:"mc",s:"grammar",l:"1.5",q:"fly → He ___ (past)",img:"🕊️",o:["flew","flyed","flying"],e:"fly is irregular: fly → flew.",v:"Cậu ấy đã bay."},
 {t:"mc",s:"reading",l:"1.6",q:"The Pudding Like a Night on the Sea: what did Father put in the pudding?",img:"🍋",o:["lemons","chocolate","bananas"],e:"Father sliced five lemons and squeezed them.",f:"Father put lemons in the pudding.",v:"Bố cho chanh vào món pudding."},
 {t:"mc",s:"reading",l:"1.6",q:"What did Huey do to the pudding?",img:"👆🍮",o:["He put his finger in it.","He threw it away.","He gave it to Mother."],e:"Huey put his finger in to see how it tastes.",f:"Huey put his finger in the pudding.",v:"Huey nhúng ngón tay vào món pudding."},
 {t:"mc",s:"grammar",l:"1.7",q:"The pudding was ready ___ father went for a nap.",img:"😴",o:["so","but","or"],e:"so tells us what happened because of something.",v:"Món pudding đã xong nên bố đi ngủ trưa."},
 {t:"mc",s:"grammar",l:"1.8",q:"Which one is a command?",img:"🛏️",o:["Get up!","Did you hear what I said?","It's time for bed."],e:"A command tells you what to do: Get up!",f:"Get up! is a command.",v:"'Dậy đi!' là một câu ra lệnh."},

 {t:"mc",s:"reading",l:"1.10",q:"Eat Your Peas: what does Daisy keep saying?",img:"🫛",o:["I don't like peas.","I love peas.","I want pudding."],e:"Daisy says the same thing again and again.",f:"Daisy keeps saying: I don't like peas.",v:"Daisy cứ nói mãi: Con không thích đậu Hà Lan."},

 {t:"mc",s:"grammar",l:"1.10",q:"Daisy ate ___ peas. (zero)",img:"🙅",o:["no","all","lots of"],e:"no = zero. Quantifiers: all, no, some, any, most, lots of.",f:"Daisy ate no peas.",v:"Daisy không ăn hạt đậu nào."}
]},
{id:"p2", n:"Unit 2", title:"Badges", color:"#3d8bff", icon:"🏅", q:[

 {t:"mc",s:"reading",l:"2.2",q:"Science Champion Rule 1: ___ things carefully.",img:"🔍",o:["Observe","Eat","Throw"],e:"Observe = look carefully and use all your senses.",v:"Quy tắc 1: Quan sát mọi thứ thật cẩn thận."},

 {t:"mc",s:"reading",l:"2.2",q:"Rule 6: Record your results. What do you need?",img:"📓",o:["a science notebook and pencil","a ball","a swing"],e:"Scientists write down what they find out.",f:"To record your results you need a science notebook and pencil.",v:"Để ghi kết quả, con cần một quyển vở khoa học và bút chì."},
 {t:"mc",s:"vocab",l:"2.2",q:"Equipment means …",img:"🧰",o:["the tools you need for a job","a kind of food","a badge"],e:"equipment = special tools you need for a job.",f:"Equipment means the tools you need for a job.",v:"Equipment nghĩa là dụng cụ cần cho một công việc."},
 {t:"mc",s:"phonics",l:"2.2",q:"How many syllables in 'sci-en-tist'?",img:"👏",o:["3","2","4"],e:"sci–en–tist: 3 claps.",f:"Scientist has 3 syllables.",v:"Từ scientist có 3 âm tiết."},
 {t:"mc",s:"grammar",l:"2.3",q:"Which word is a command?",img:"🧼",o:["Wash","Happy","Green"],e:"Commands tell us what to do: Wash your hands.",f:"Wash your hands. 'Wash' is a command.",v:"Rửa tay đi. 'Wash' là động từ ra lệnh."},
 {t:"mc",s:"grammar",l:"2.3",q:"Instructions often have a heading that begins …",img:"📋",o:["How to …","Once upon a time …","Dear …"],e:"Example: How to Blow Bubbles.",f:"Instructions often begin with 'How to …'.",v:"Bài hướng dẫn thường có tiêu đề bắt đầu bằng 'Cách để …'."},
 {t:"order",s:"reading",l:"2.4",q:"How to Blow Bubbles: put the steps in order.",img:"🫧",a:"Half fill a bowl with water | Pour bubble bath into the water | Put a straw in and blow",split:"|",e:"Water first, then soap, then blow!",v:"Đổ nửa bát nước → cho sữa tắm tạo bọt vào → cắm ống hút và thổi."},

 {t:"order",s:"grammar",l:"2.7",q:"Put the linking adverbs in order.",img:"1️⃣2️⃣3️⃣",a:"first next after finally",e:"first → next → after → finally.",f:"First, next, after, finally.",v:"Đầu tiên → tiếp theo → sau đó → cuối cùng."},
 {t:"fill",s:"grammar",l:"2.9",q:"1 story, 3 ___",img:"📚",a:["stories"],e:"story → stories (y → ies).",f:"One story, three stories.",v:"Một câu chuyện, ba câu chuyện."},
 {t:"mc",s:"grammar",l:"2.9",q:"1 child, 4 ___",img:"🧒🧒",o:["children","childs","childrens"],e:"child → children is irregular.",f:"One child, four children.",v:"Một đứa trẻ, bốn đứa trẻ."},
 {t:"mc",s:"grammar",l:"2.9",q:"1 superhero, lots of ___",img:"🦸",o:["superheroes","superheros","superheroies"],e:"hero → heroes, superhero → superheroes.",f:"One superhero, lots of superheroes.",v:"Một siêu anh hùng, nhiều siêu anh hùng."},
 {t:"mc",s:"vocab",l:"2.10",q:"A book of poems is …",img:"📖",o:["poetry","non-fiction","a flow chart"],e:"Three main genres: fiction, non-fiction and poetry.",f:"A book of poems is poetry.",v:"Một cuốn sách thơ thuộc thể loại thơ ca."},
 {t:"mc",s:"vocab",l:"2.8",q:"Personal information is information about …",img:"🪪",o:["you","the weather","a robot"],e:"Your name, age, things you like doing… Keep it safe!",f:"Personal information is information about you.",v:"Thông tin cá nhân là thông tin về chính con."}
]},
{id:"p3", n:"Unit 3", title:"All about sounds", color:"#7c3aed", icon:"🔊", q:[
 {t:"mc",s:"vocab",l:"3.1",q:"A tongue-twister is …",img:"👅",o:["a short poem that is tricky to say fast","a kind of song for babies","a long story"],e:"Tongue-twisters repeat sounds: She sells seashells…",f:"A tongue-twister is a short poem that is tricky to say fast.",v:"Câu nói líu lưỡi là câu ngắn rất khó nói nhanh."},
 {t:"mc",s:"phonics",l:"3.1",q:"'She sells seashells by the seashore.' Which sound is repeated?",img:"🐚",o:["s / sh","b","t"],e:"s and sh are repeated again and again.",f:"In 'She sells seashells', the s and sh sounds are repeated.",v:"Trong câu này, âm s và sh được lặp lại."},
 {t:"mc",s:"vocab",l:"3.1",q:"A fossil is …",img:"🦴",o:["the remains of a very old plant or animal in rock","a kind of shell shop","a new toy"],e:"Mary Anning collected fossils by the sea.",f:"A fossil is the remains of a prehistoric plant or animal set in rock.",v:"Hóa thạch là dấu vết của cây hoặc động vật thời tiền sử trong đá."},
 {t:"mc",s:"phonics",l:"3.1",q:"A digraph is …",img:"🔤",o:["two letters that make one sound","two words that rhyme","a kind of graph"],e:"sh, ck and ch are digraphs.",f:"A digraph is two letters that make one sound.",v:"Digraph là hai chữ cái tạo thành một âm."},
 {t:"mc",s:"phonics",l:"3.1",q:"Which word has the digraph ck?",o:["🧦|socks","🛍️|shop","🍟|chips"],e:"so-ck-s. shop has sh, chips has ch.",f:"Socks has the digraph ck.",v:"Từ socks (tất) có cặp chữ ck."},
 {t:"mc",s:"phonics",l:"3.1",q:"Which word has the digraph ch?",o:["🥢|chopsticks","🔒|locks","⛵|ship"],e:"ch-opsti-ck-s has ch (and ck too!).",f:"Chopsticks has the digraph ch.",v:"Từ chopsticks (đũa) có cặp chữ ch."},
 {t:"mc",s:"vocab",l:"3.2",q:"A chant is …",img:"👏",o:["speaking or singing words in a repeated pattern","a quiet whisper","a picture"],e:"The Poetry United Chant: WHAT DO WE WANT… clap clap clap!",f:"A chant is speaking or singing words in a repeated pattern.",v:"Chant là đọc hoặc hát các từ theo một nhịp lặp lại."},
 {t:"mc",s:"vocab",l:"3.2",q:"Volume means …",img:"🔉",o:["how loud something is","how long something is","how heavy something is"],e:"You can chant with different volumes: loud or quiet.",f:"Volume means how loud something is.",v:"Volume nghĩa là âm lượng, độ to nhỏ."},
 {t:"mc",s:"vocab",l:"3.3",q:"Which sound does a bee make?",img:"🐝",o:["buzz","splash","ding-ding"],e:"Bees buzz. Water splashes.",f:"A bee goes buzz.",v:"Con ong kêu vo ve."},
 {t:"mc",s:"vocab",l:"3.3",q:"Which word sounds like water?",img:"💦",o:["splash","buzz","clap"],e:"splash is a water sound.",f:"Splash is a water sound.",v:"Splash là tiếng nước bắn tung tóe."},
 {t:"mc",s:"vocab",l:"3.3",q:"Words to Whisper: which word is a VOICE sound?",img:"🗣️",o:["shout","splash","buzz"],e:"shout and whisper are voice sounds.",f:"Shout is a voice sound.",v:"Shout (hét) là âm thanh của giọng nói."},
 {t:"mc",s:"reading",l:"3.4",q:"New Shoes: where does the child go?",img:"👟",o:["to a shoe store","to school","to the beach"],e:"One shoe, two shoes, I need new shoes! Off I go to the shoe store.",f:"The child goes to the shoe store.",v:"Bạn nhỏ đi đến cửa hàng giày."},
 {t:"mc",s:"grammar",l:"3.4",q:"Shoes ___ muddy places.",img:"🥾",o:["for","with","of"],e:"for tells the purpose (what it is used for).",v:"Giày dùng cho những nơi lầy lội."},
 {t:"mc",s:"grammar",l:"3.4",q:"Shoes ___ funny faces.",img:"🤡👞",o:["with","for","to"],e:"with gives an extra detail.",v:"Giày có hình mặt cười ngộ nghĩnh."},
 {t:"mc",s:"phonics",l:"3.5",q:"Which word rhymes with 'store'?",img:"🏪",o:["for","shoe","new"],e:"store – for – more rhyme.",f:"Store rhymes with for.",v:"Store vần với for."},
 {t:"mc",s:"reading",l:"3.5",q:"New Shoes Part 2: what are the special shoes for?",img:"🏃‍♀️💨",o:["to run and race with the wind","to sleep in","to visit aunts for tea"],e:"To play, to run, to race with the wind and never lose!",f:"The special shoes are to run and race with the wind.",v:"Đôi giày đặc biệt để chạy và đua cùng gió."},
 {t:"listen",s:"listening",l:"3.3",say:"whisper",q:"Listen. Which word do you hear?",o:["whisper","shout","splash"],e:"You heard 'whisper'.",v:"whisper = thì thầm."}
]},
{id:"p4", n:"Unit 4", title:"Long, long ago", color:"#16a34a", icon:"🐯", q:[
 {t:"mc",s:"vocab",l:"4.1",q:"Pygmy means …",img:"🐘",o:["smaller than normal","very angry","very fast"],e:"A pygmy elephant is smaller than other elephants.",f:"Pygmy means smaller than normal.",v:"Pygmy nghĩa là nhỏ hơn bình thường (loài lùn)."},
 {t:"mc",s:"vocab",l:"4.1",q:"Traditional tales are …",img:"📜",o:["stories told and retold for many years","news about today","science books"],e:"Sang Kancil and Yoshi the Stonecutter are traditional tales.",f:"Traditional tales are stories told and retold for many years.",v:"Truyện cổ là những câu chuyện được kể đi kể lại nhiều năm."},
 {t:"mc",s:"reading",l:"4.1",q:"Sang Kancil is a …",img:"🦌",o:["mouse deer","tiger","snake"],e:"Sang Kancil is a sly, clever mouse deer from Indonesia.",f:"Sang Kancil is a mouse deer.",v:"Sang Kancil là một chú hươu chuột."},
 {t:"mc",s:"reading",l:"4.1",q:"Which two adjectives describe Sang Kancil?",img:"🦌",o:["sly and clever","big and slow","lazy and sad"],e:"He was sly and clever and he liked to play tricks.",f:"Sang Kancil is sly and clever.",v:"Sang Kancil ranh mãnh và thông minh."},
 {t:"mc",s:"reading",l:"4.1",q:"Sang Kancil told Tiger the muddy puddle was the king's …",img:"🟤",o:["chocolate sauce","drum","belt"],e:"Tiger tasted the muddy puddle. Yuk! He was tricked.",f:"Sang Kancil told Tiger the muddy puddle was the king's chocolate sauce.",v:"Sang Kancil bảo Hổ vũng bùn là nước sốt sô-cô-la của nhà vua."},
 {t:"mc",s:"reading",l:"4.2",q:"Part 2: what was really the king's 'drum'?",img:"🐝",o:["a bee's nest","a rock","a coconut"],e:"Tiger banged the 'drum' – it was a bee's nest! Ouch!",f:"The king's 'drum' was really a bee's nest.",v:"'Cái trống' của nhà vua thật ra là tổ ong."},
 {t:"mc",s:"reading",l:"4.3",q:"Part 3: what was really the king's new 'belt'?",img:"🐍",o:["a sleeping cobra","a rope","a tree root"],e:"The cobra hissed and tried to eat Tiger!",f:"The king's new 'belt' was really a sleeping cobra.",v:"'Chiếc thắt lưng mới' của vua thật ra là một con rắn hổ mang đang ngủ."},
 {t:"mc",s:"reading",l:"4.3",q:"How many times does Sang Kancil trick Tiger?",img:"3️⃣",o:["three","one","five"],e:"Chocolate sauce, drum, belt: three tricks.",f:"Sang Kancil tricks Tiger three times.",v:"Sang Kancil lừa Hổ ba lần."},
 {t:"fill",s:"grammar",l:"4.2",q:"Tiger ___ his sharp teeth. (bare)",img:"🐯",a:["bared"],e:"bare + d = bared (showed his teeth).",v:"Hổ nhe hàm răng sắc nhọn."},
 {t:"mc",s:"reading",l:"4.4",q:"The Abominable Snowman: what is Ramay like at the start?",img:"🛋️",o:["very lazy","very brave","very hard-working"],e:"Ramay sits outside all day doing nothing.",f:"At the start Ramay is very lazy.",v:"Lúc đầu Ramay rất lười biếng."},
 {t:"mc",s:"reading",l:"4.4",q:"The monster's hair is thick and white like …",img:"❄️",o:["snow","grass","fire"],e:"White as snow helps him hide.",f:"The monster's hair is thick and white like snow.",v:"Lông con quái vật dày và trắng như tuyết."},
 {t:"mc",s:"reading",l:"4.5",q:"What did the monster give Ramay?",img:"🪄",o:["a wishing stick","gold","a drum"],e:"He gave Ramay a wishing stick to make him go away.",f:"The monster gave Ramay a wishing stick.",v:"Con quái vật cho Ramay một cây gậy ước."},
 {t:"mc",s:"reading",l:"4.5",q:"Who swapped the wishing stick for an old piece of wood?",img:"🪵",o:["the old woodcutter","the monster","Ramay's mother"],e:"The woodcutter tricked Ramay while he was sleeping.",f:"The old woodcutter swapped the wishing stick.",v:"Ông tiều phu già đã tráo cây gậy ước."},
 {t:"mc",s:"grammar",l:"4.7",q:"Ramay asked the wishing stick for gold, ___ nothing happened.",img:"💰",o:["but","so","because"],e:"but shows something different from what we expect.",v:"Ramay xin cây gậy vàng, nhưng chẳng có gì xảy ra."},
 {t:"mc",s:"grammar",l:"4.7",q:"Ramay was tired ___ he asked to shelter for the night.",img:"😴",o:["so","but","or"],e:"so tells what happened because he was tired.",v:"Ramay mệt nên cậu xin ngủ nhờ qua đêm."},
 {t:"mc",s:"reading",l:"4.8",q:"Yoshi the Stonecutter: where did Yoshi live?",img:"🗾",o:["in the mountains of Japan","in a big city","under the sea"],e:"Long ago in the mountains of Japan…",f:"Yoshi lived in the mountains of Japan.",v:"Yoshi sống ở vùng núi Nhật Bản."},
 {t:"order",s:"reading",l:"4.9",q:"What did Yoshi wish to be? Put them in order.",img:"🔄",a:"rich man | prince | sun | cloud | rock | man",split:"|",e:"A circular story: he ends where he started – a man.",v:"Người giàu → hoàng tử → mặt trời → đám mây → tảng đá → con người."},
 {t:"mc",s:"reading",l:"4.10",q:"What did the whisper in the wind always say?",img:"🌬️",o:["Your wish is granted.","Go away!","I am the sun."],e:"“Your wish is granted, Yoshi – a … you will be.”",f:"The whisper always said: Your wish is granted.",v:"Lời thì thầm trong gió luôn nói: Điều ước của con đã thành."},
 {t:"mc",s:"reading",l:"4.10",q:"How did Yoshi feel at the end?",img:"😊",o:["happy","angry","rich"],e:"He was poor again, but now he was happy.",f:"At the end Yoshi was happy.",v:"Cuối cùng Yoshi thấy hạnh phúc."},
 {t:"mc",s:"vocab",l:"4.11",q:"A circular story …",img:"⭕",o:["begins and ends in the same place","has no ending","is about circles"],e:"Yoshi starts as a stonecutter and ends as a stonecutter.",f:"A circular story begins and ends in the same place.",v:"Truyện vòng tròn bắt đầu và kết thúc ở cùng một chỗ."}
]},
{id:"p5", n:"Unit 5", title:"Computers and robots", color:"#0891b2", icon:"🤖", q:[
 {t:"mc",s:"vocab",l:"5.1",q:"Computers are machines that …",img:"💻",o:["work with information and solve problems","grow food","fly like birds"],e:"Information can be words, numbers, sounds or pictures.",f:"Computers are machines that work with information and solve problems.",v:"Máy tính là máy xử lý thông tin và giải quyết vấn đề."},
 {t:"mc",s:"reading",l:"5.1",q:"Four hundred years ago, Pascal made a computer. What was it?",img:"🧮",o:["a calculator","a robot","a phone"],e:"It was a calculator used to do simple sums.",f:"Pascal's computer was a calculator.",v:"Máy tính của Pascal là một chiếc máy tính cộng trừ."},
 {t:"mc",s:"vocab",l:"5.2",q:"A program is …",img:"📜",o:["a set of instructions that computers follow","a kind of robot","a game board"],e:"Programs are written in computer code.",f:"A program is a set of instructions that computers follow.",v:"Chương trình là một bộ lệnh mà máy tính làm theo."},
 {t:"mc",s:"vocab",l:"5.2",q:"A code is when you use …",img:"🔣",o:["one symbol, letter or number instead of another","only pictures","no words at all"],e:"Secret messages were sent in code.",f:"A code is when you use one symbol, letter or number instead of another.",v:"Mật mã là dùng một kí hiệu, chữ hoặc số thay cho cái khác."},
 {t:"mc",s:"grammar",l:"5.3",q:"Which word is a noun?",img:"🌐",o:["website","clever","new"],e:"A noun names something. clever and new are adjectives.",f:"Website is a noun.",v:"Website là danh từ."},
 {t:"mc",s:"grammar",l:"5.3",q:"Which word is an adjective?",img:"✨",o:["clever","toy","phone"],e:"An adjective describes a noun: a clever toy.",f:"Clever is an adjective.",v:"Clever (thông minh) là tính từ."},
 {t:"mc",s:"grammar",l:"5.3",q:"un + happy = ?",img:"😞",o:["unhappy","dishappy","happyun"],e:"un- and dis- give the opposite meaning.",f:"Un + happy = unhappy.",v:"un + happy = unhappy (không vui)."},
 {t:"mc",s:"grammar",l:"5.3",q:"dis + agree = ?",img:"🙅",o:["disagree","unagree","agreedis"],e:"disagree is the opposite of agree.",f:"Dis + agree = disagree.",v:"dis + agree = disagree (không đồng ý)."},
 {t:"mc",s:"vocab",l:"5.4",q:"Mix red and yellow to make …",img:"🟥🟨",o:["orange","green","purple"],e:"red + yellow = orange.",f:"Mix red and yellow to make orange.",v:"Trộn đỏ với vàng được màu cam."},
 {t:"mc",s:"vocab",l:"5.4",q:"Mix yellow and blue to make …",img:"🟨🟦",o:["green","orange","pink"],e:"yellow + blue = green.",f:"Mix yellow and blue to make green.",v:"Trộn vàng với xanh dương được màu xanh lá."},
 {t:"mc",s:"reading",l:"5.5",q:"Why are robots good factory workers?",img:"🏭",o:["They don't get bored or tired.","They are small.","They like to sleep."],e:"Robots can do the same thing again and again.",f:"Robots are good factory workers because they don't get bored or tired.",v:"Rô-bốt làm việc tốt ở nhà máy vì chúng không chán và không mệt."},
 {t:"mc",s:"grammar",l:"5.6",q:"The robot ___ people. (help)",img:"🤖",o:["helps","help","helping"],e:"One robot → add -s: helps. The robots help.",v:"Rô-bốt giúp đỡ mọi người."},
 {t:"mc",s:"grammar",l:"5.6",q:"The robots ___ people information.",img:"🤖🤖",o:["give","gives","giving"],e:"Many robots → no -s: give.",v:"Các rô-bốt cung cấp thông tin cho mọi người."},
 {t:"mc",s:"reading",l:"5.7",q:"Pepper robot: why does it have wheels in its feet?",img:"🛞",o:["so it can move around","so it can see","so it can hear"],e:"Wheels help it move. Cameras help it see.",f:"Pepper has wheels in its feet so it can move around.",v:"Pepper có bánh xe ở chân để di chuyển."},
 {t:"mc",s:"vocab",l:"5.7",q:"A sensor is …",img:"📷",o:["a camera or tool that helps a computer understand where it is","a type of food","a kind of song"],e:"Pepper has hearing, touch and bumper sensors.",f:"A sensor is a camera or tool that helps a computer understand where it is.",v:"Cảm biến là camera hoặc thiết bị giúp máy tính biết mình ở đâu."},
 {t:"mc",s:"reading",l:"5.8",q:"A drone is a …",img:"🛸",o:["robot","bird","boat"],e:"Some drones are as big as aeroplanes, some fit on your hand.",f:"A drone is a robot.",v:"Máy bay không người lái (drone) là một loại rô-bốt."},
 {t:"mc",s:"reading",l:"5.8",q:"Why can drones go to dangerous places?",img:"⚠️",o:["They don't have people in them.","They are very slow.","They are made of paper."],e:"The controller stays safe far away.",f:"Drones can go to dangerous places because they don't have people in them.",v:"Drone đến được nơi nguy hiểm vì bên trong không có người."},
 {t:"mc",s:"vocab",l:"5.9",q:"Hover means …",img:"🚁",o:["to stay in one place in the air","to fall down","to swim"],e:"Liang can make his drone hover.",f:"Hover means to stay in one place in the air.",v:"Hover nghĩa là lơ lửng một chỗ trên không."},
 {t:"mc",s:"phonics",l:"5.8",q:"Does 'drone' rhyme with 'bone' or 'on'?",img:"🦴",o:["bone","on"],e:"The e at the end makes the o long: drone – bone.",f:"Drone rhymes with bone.",v:"Drone vần với bone."}
]},
{id:"p6", n:"Unit 6", title:"On a journey", color:"#e11d48", icon:"🧭", q:[
 {t:"mc",s:"reading",l:"6.1",q:"Who wrote the poem Busy Day?",img:"✍️",o:["Michael Rosen","Roger McGough","Valerie Bloom"],e:"Michael Rosen also wrote Riding Down to Boxland.",f:"Michael Rosen wrote Busy Day.",v:"Michael Rosen viết bài thơ Busy Day."},
 {t:"mc",s:"reading",l:"6.1",q:"Which word is repeated again and again in Busy Day?",img:"🎈",o:["pop","stop","shop"],e:"pop in, pop out, pop over the road…",f:"The word pop is repeated in Busy Day.",v:"Từ 'pop' được lặp lại nhiều lần trong bài Busy Day."},

 {t:"mc",s:"vocab",l:"6.1",q:"A poet is …",img:"🖋️",o:["someone who writes poems","someone who sells boxes","a kind of poem"],e:"Michael Rosen is a poet.",f:"A poet is someone who writes poems.",v:"Nhà thơ là người viết thơ."},
 {t:"mc",s:"vocab",l:"6.1",q:"Repetition means …",img:"🔁",o:["words or phrases used several times","words that are very long","a picture"],e:"Busy Day uses lots of repetition.",f:"Repetition means words or phrases used several times.",v:"Sự lặp lại là các từ hoặc cụm từ được dùng nhiều lần."},
 {t:"mc",s:"reading",l:"6.2",q:"Downhill Racer is a shape poem. What shape do the words make?",img:"⛷️",o:["a skier going down a mountain","a box","a river"],e:"The words zig-zag down the page like a skier.",f:"The words make the shape of a skier going down a mountain.",v:"Các chữ xếp thành hình người trượt tuyết xuống núi."},
 {t:"mc",s:"vocab",l:"6.2",q:"Layout means …",img:"📄",o:["how the poem looks on the page","how loud you read","how long the poem is"],e:"A shape poem has a special layout.",f:"Layout means how the poem looks on the page.",v:"Bố cục là cách bài thơ được trình bày trên trang."},
 {t:"mc",s:"reading",l:"6.3",q:"Riding Down to Boxland: where do people live?",img:"📦",o:["in boxes","in trees","in boats"],e:"Where people live in boxes…",f:"In Boxland, people live in boxes.",v:"Ở Xứ Hộp, mọi người sống trong những cái hộp."},
 {t:"mc",s:"reading",l:"6.3",q:"Why are there no chickens in Boxland?",img:"🦊",o:["They have been eaten by the foxes.","They flew away.","They live in boxes."],e:"no chickens there, been eaten by the foxes.",f:"There are no chickens because they have been eaten by the foxes.",v:"Không còn gà vì đã bị cáo ăn hết."},
 {t:"fill",s:"vocab",l:"6.3",q:"box + land = ___",img:"📦🏞️",a:["boxland"],e:"A compound word is made from two smaller words.",f:"Box + land = boxland.",v:"box + land = boxland (Xứ Hộp) – một từ ghép."},
 {t:"mc",s:"reading",l:"6.4",q:"The River: the river twists and turns. He is a …",img:"🌊",o:["winder","singer","baby"],e:"winder = someone or something that twists and turns.",f:"The River's a winder.",v:"Dòng sông là kẻ uốn lượn."},
 {t:"mc",s:"vocab",l:"6.4",q:"A hoarder is someone who …",img:"💎",o:["gathers and keeps things","sings songs","is very small"],e:"The river buries treasures it wants to keep.",f:"A hoarder is someone who gathers and keeps things.",v:"Hoarder là người hay gom góp, cất giữ đồ."},
 {t:"mc",s:"reading",l:"6.4",q:"The river gurgles and hums like a …",img:"👶",o:["baby","hoarder","winder"],e:"The River's a baby, he gurgles and hums.",f:"The river gurgles and hums like a baby.",v:"Dòng sông ríu rít, ngân nga như một em bé."},
 {t:"mc",s:"reading",l:"6.4",q:"Valerie Bloom, who wrote The River, was born in …",img:"🇯🇲",o:["Jamaica","Japan","Brazil"],e:"Valerie Bloom was born in Jamaica.",f:"Valerie Bloom was born in Jamaica.",v:"Valerie Bloom sinh ra ở Jamaica."},

 {t:"mc",s:"reading",l:"6.5",q:"Which sound word goes with the steel drums?",img:"🥁",o:["Bang!","Swish!","Sink!"],e:"Bang! Go the steel drums at a music festival.",f:"Bang! Go the steel drums.",v:"Bùm! Tiếng trống thép vang lên."},
 {t:"listen",s:"listening",l:"6.4",say:"river",q:"Listen. Which word do you hear?",o:["🌊|river","📦|box","🎈|pop"],e:"You heard 'river'.",v:"river = dòng sông."}
]},

<script>
{

const app = $("#app");
const SK = {vocab:["Vocabulary","Từ vựng","#3d8bff"], grammar:["Grammar","Ngữ pháp","#7c3aed"], phonics:["Phonics & spelling","Phát âm & chính tả","#ea580c"], reading:["Reading","Đọc hiểu","#16a34a"], listening:["Listening","Nghe","#db2777"]};
const ADVICE = {
 vocab:["Look at the Key words and say them again.","Ôn lại các từ khóa (Key words, cuối sách) và chơi “Picture words”."],

 phonics:["Say the words aloud slowly. Listen to the sounds and look at the spelling.","Đọc to, chậm từng từ; chú ý âm và cách viết (bài Words and sounds)."],
 reading:["Read the story or text again and find the answer in it.","Đọc lại bài đọc/truyện cùng con và tìm câu trả lời trong bài."],
 listening:["Press 🔊 and listen again. Then say the word.","Bấm 🔊 nghe lại nhiều lần rồi cho con nhắc lại."]};
let best = {}; try{best = JSON.parse(localStorage.getItem("cge2-best")||"{}")}catch(e){}
const saveBest = (id,v)=>{ if(!(id in best) || v>best[id]) best[id]=v; try{localStorage.setItem("cge2-best",JSON.stringify(best))}catch(e){} };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase().replace(/[’']/g,"'").replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();
const pageOf = (u,l) => { if(!u||!u.page||!l) return ""; const n=+String(l).split(".")[1]||1; return u.page + 2*(n-1) + (n>=7?2:0) };
const stars = v => v==null ? "☆☆☆" : (v>=9?"★★★":v>=7?"★★☆":v>=5?"★☆☆":"☆☆☆");

/* ---------- speech ---------- */
let voice=null, voices=[];
let VS={uri:"",speed:.8}; try{VS={...VS,...JSON.parse(localStorage.getItem("cge2-voice")||"{}")}}catch(e){}
const saveVS=()=>{try{localStorage.setItem("cge2-voice",JSON.stringify(VS))}catch(e){}};
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|grandma|grandpa|rocko|shelley|flo|eddy|reed|sandy/i;
const vScore=v=>{const n=v.name; let s=0;
 if(/premium/i.test(n))s+=60; if(/enhanced|natural|neural|online/i.test(n))s+=50; if(/google/i.test(n))s+=40; if(/siri/i.test(n))s+=35;
 if(/serena|daniel|kate|ava|zoe|samantha|karen|moira|libby|sonia|ryan|aria|jenny|guy/i.test(n))s+=10;
 if(/en[-_]GB/i.test(v.lang))s+=8; else if(/en[-_]US/i.test(v.lang))s+=6; else if(/en[-_](AU|IE)/i.test(v.lang))s+=3;
 if(v.localService===false)s+=2; return s};
const vLabel=v=>{const q=vScore(v)>=35?"⭐ ":""; const c=(v.lang.split(/[-_]/)[1]||"").toUpperCase(); const flag={GB:"🇬🇧",US:"🇺🇸",AU:"🇦🇺",IE:"🇮🇪",IN:"🇮🇳",ZA:"🇿🇦",CA:"🇨🇦",NZ:"🇳🇿"}[c]||"🌐"; return `${q}${flag} ${v.name}`};
const pickVoice=()=>{try{ voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!NOVELTY.test(v.name)).sort((a,b)=>vScore(b)-vScore(a));
 voice=voices.find(v=>v.voiceURI===VS.uri)||voices[0]||null; if(document.getElementById("vsel")) fillVoices(); }catch(e){}};

const speak = (t,rate=.85) => { try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(t).replace(/_{2,}/g," blank ").replace(/[|]/g,"")); u.lang=voice?voice.lang:"en-GB"; if(voice)u.voice=voice; u.rate=Math.max(.4,Math.min(1.3,VS.speed*rate/.85)); speechSynthesis.speak(u);}catch(e){} };
function fillVoices(){ const sel=document.getElementById("vsel"); if(!sel)return;
 sel.innerHTML = voices.length? voices.map(v=>`<option value="${esc(v.voiceURI)}" ${voice&&v.voiceURI===voice.voiceURI?"selected":""}>${esc(vLabel(v))}</option>`).join("") : `<option>Đang tải giọng đọc…</option>`;
 document.getElementById("vnone").classList.toggle("hidden", voices.some(v=>vScore(v)>=35)); }
function openVoice(){
 let ov=document.getElementById("vov"); if(ov) ov.remove();
 ov=document.createElement("div"); ov.id="vov"; ov.className="ov";
 const sp=[["Slow · Chậm",.6],["Normal · Vừa",.8],["Fast · Nhanh",1]];
 ov.innerHTML=`<div class="sheet" role="dialog" aria-label="voice settings"><h2 style="margin:0 0 6px">🗣️ Chọn giọng đọc</h2>
 <p class="vn" style="margin:0 0 12px">Giọng có ⭐ là giọng chất lượng cao (Premium / Enhanced / Natural). Chọn rồi bấm Nghe thử.</p>
 <label for="vsel" class="lbl">Giọng đọc</label><select id="vsel"></select>
 <p class="vn hidden" id="vnone" style="margin:8px 0 0">Máy chưa có giọng chất lượng cao. iPhone: Cài đặt → Trợ năng → Nội dung được đọc → Giọng nói → Tiếng Anh → tải giọng “Nâng cao/Cao cấp” (Serena, Ava…), rồi mở lại trang. Máy tính: dùng Chrome hoặc Edge.</p>
 <div class="lbl" style="margin-top:14px">Tốc độ đọc</div><div class="seg">${sp.map(([l,v])=>`<button data-sp="${v}" class="${Math.abs(VS.speed-v)<.01?"on":""}">${l}</button>`).join("")}</div>
 <div class="btns" style="margin-top:16px"><button class="ghost" id="vtest">🔊 Nghe thử</button><button class="main" id="vok">Xong ✓</button></div></div>`;
 document.body.appendChild(ov); fillVoices();
 const test=()=>speak("Hello! The cat chased the mouse. Calendar, firefighter, butterfly.");
 document.getElementById("vsel").onchange=e=>{ voice=voices.find(v=>v.voiceURI===e.target.value)||voice; VS.uri=voice?voice.voiceURI:""; saveVS(); test() };
 ov.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{ VS.speed=+b.dataset.sp; saveVS(); ov.querySelectorAll("[data-sp]").forEach(x=>x.classList.toggle("on",x===b)); test() });
 document.getElementById("vtest").onclick=test;
 const close=()=>ov.remove(); document.getElementById("vok").onclick=close; ov.onclick=e=>{ if(e.target===ov) close() };
}
let actx=null;
const tone = ok => { try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(); o.connect(g);g.connect(actx.destination); const t=actx.currentTime;
 o.frequency.setValueAtTime(ok?660:220,t); if(ok)o.frequency.setValueAtTime(880,t+.12); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.35); o.start(t); o.stop(t+.36);}catch(e){} };

/* ---------- pictures ---------- */
function clockSVG(h,m){ const ha=((h%12)+m/60)*30, ma=m*6; let ticks="";
 for(let i=1;i<=12;i++){const a=i*30*Math.PI/180; ticks+=`<text x="${100+72*Math.sin(a)}" y="${100-72*Math.cos(a)+7}" font-size="20" text-anchor="middle" fill="#14213d" font-family="Fredoka,sans-serif">${i}</text>`}
 return `<svg viewBox="0 0 200 200" role="img" aria-label="clock"><circle cx="100" cy="100" r="94" fill="#fff" stroke="#3d8bff" stroke-width="10"/>${ticks}
 <line x1="100" y1="100" x2="${100+45*Math.sin(ha*Math.PI/180)}" y2="${100-45*Math.cos(ha*Math.PI/180)}" stroke="#14213d" stroke-width="9" stroke-linecap="round"/>

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function fullSentence0(q){
 const pick=x=>String(x).includes("|")?String(x).split("|").pop():String(x);
 let r=pick(q.right);
 if(q.t==="order") return q.split? q.parts.join(". ")+"." : cap(q.right)+".";
 if(q.t==="bank") return cap(r)+": "+q.q.replace(/…$/,r+".");
 if(q.odd) return q.e;
 if(q.t==="tf") return q.a===0? q.q : q.e.replace(/^['‘]|['’]$/g,"");
 if(q.t==="listen") return cap(r)+".";
 let s=q.q;
 const clean=x=>x.replace(/\s*\((?:[^()]*)\)\s*/g," ").replace(/\s+([.?!,])/g,"$1").replace(/\s{2,}/g," ").trim();
 if(/_{2,}/.test(s)){ s=s.replace(/_{2,}(\s+_{2,})*/,r); return clean(s); }
 if(/…$/.test(s)) return clean(s.replace(/…$/," "+r+"."));
 return clean(s)+" — "+r;
}

 const wrong=S.ans.filter(a=>!a.ok);
 const lessons=[...new Set(wrong.map(a=>a.q.u+"|"+(a.q.l||"")))].filter(x=>!x.endsWith("|"));
 app.innerHTML = `<div class="top"><button class="ghost" id="back">🏠 Home</button><span class="count">${esc(S.unit.n)} · ${esc(S.unit.title)}</span></div>
 <div class="card"><div class="res"><div class="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="${R}" fill="none" stroke="var(--soft)" stroke-width="22"/><circle cx="110" cy="110" r="${R}" fill="none" stroke="${col}" stroke-width="22" stroke-linecap="round" stroke-dasharray="${C*c/n} ${C}"/></svg><div class="v"><div><b>${sc}</b><small>out of 10</small><small>${c}/${n} correct · ${pct}%</small></div></div></div>
 <div><h1 style="font-size:clamp(26px,4vw,36px)">${msg}</h1><p class="vn" style="font-size:17px">${vn}</p><div style="font-size:34px;color:#f59e0b">${stars(sc)}</div></div></div>
 ${S.qs[0].sec?(()=>{const parts=[];S.ans.forEach(a=>{let p=parts.find(x=>x.h===a.q.sec);if(!p)parts.push(p={h:a.q.sec,c:0,n:0});p.n++;if(a.ok)p.c++});
  return `<h2>Parts <span class="vn">· Kết quả từng phần (${c}/${n} điểm)</span></h2>`+parts.map(p=>{const pc=Math.round(p.c/p.n*100);return `<div class="skill"><span>${esc(p.h)}</span><span class="track"><i style="width:${pc}%;background:${pc>=75?"var(--ok)":pc>=50?"#f59e0b":"var(--bad)"}"></i></span><span class="pc">${p.c}/${p.n}</span></div>`}).join("")})():""}
 <h2>Skills <span class="vn">· Kết quả theo kỹ năng</span></h2>
 ${skills.map(k=>{const p=Math.round(by[k].c/by[k].n*100);return `<div class="skill"><span>${SK[k][0]}<br><span class="vn">${SK[k][1]}</span></span><span class="track"><i style="width:${p}%;background:${p>=75?"var(--ok)":p>=50?"#f59e0b":"var(--bad)"}"></i></span><span class="pc">${by[k].c}/${by[k].n}</span></div>`}).join("")}
 <div class="advice"><b>What to practise · Nhận xét cho phụ huynh</b>
 ${weak.length? weak.map(k=>`<p style="margin:8px 0">• <b>${SK[k][0]}</b> (${by[k].c}/${by[k].n}): ${ADVICE[k][0]}<br><span class="vn">${SK[k][1]}: ${ADVICE[k][1]}</span></p>`).join("") : `<p style="margin:8px 0">All skills are strong. Try another unit! <br><span class="vn">Tất cả kỹ năng đều tốt (≥75%). Có thể chuyển sang bài tiếp theo.</span></p>`}
 ${S.unit.wp?`<p style="margin:8px 0">📗 Open the Workbook at page ${S.unit.wp} and look at the parts with red bars again.<br><span class="vn">Mở Workbook từ trang ${S.unit.wp}, ôn lại các phần có thanh màu đỏ/cam ở trên.</span></p>`:""}
 ${lessons.length?`<p style="margin:8px 0">📖 Review these lessons in the book: <b>${lessons.map(x=>{const [u,l]=x.split("|");const p=pageOf(findUnit(u),l);return `Lesson ${l}${p?` (p.${p})`:""}`}).join(", ")}</b><br><span class="vn">Nên mở sách ôn lại các bài trên.</span></p>`:""}</div>
 ${wrong.length?`<h2>Mistakes (${wrong.length}) <span class="vn">· Các câu sai</span></h2>`+wrong.map(a=>{const q=a.q; const g=String(a.given).includes("|")?a.given.split("|")[1]:a.given; const r=q.right.includes("|")?q.right.split("|")[1]:q.right;
  return `<div class="mist"><div><b>${esc(q.q)}</b></div><div class="row"><span class="chip r">Your answer: ${esc(g)}</span><span class="chip g">Correct: ${esc(r)}</span><span class="chip">${q.sec?esc(q.sec):SK[q.s][0]}${q.l?` · Lesson ${q.l}`:""}</span></div><div style="margin-top:6px">🔊 <a href="#" class="sayl" data-t="${esc((TR[q.id]||[q.f||"",q.v||""])[0]||fullSentence(q))}">${esc((TR[q.id]||[q.f||"",q.v||""])[0]||fullSentence(q))}</a>${(TR[q.id]||[q.f||"",q.v||""])[1]?`<br><span class="vn">🇻🇳 ${esc((TR[q.id]||[q.f||"",q.v||""])[1])}</span>`:""}</div><div style="margin-top:6px">💡 ${esc(q.e||"")}</div></div>`}).join(""):`<h2>No mistakes! 🎉</h2>`}
 <div class="btns">${wrong.length?`<button class="main" id="redo">Practise my mistakes</button>`:""}<button class="ghost" id="again">Try the whole quiz again</button><button class="ghost" id="home2">Choose another unit</button></div></div>`;
 $("#back").onclick=home; $("#home2").onclick=home;
 app.querySelectorAll(".sayl").forEach(a=>a.onclick=e=>{e.preventDefault();speak(a.dataset.t,.8)});
 $("#again").onclick=()=>start(S.unit.id);
 if(wrong.length) $("#redo").onclick=()=>{ const id=S.unit.id; start(id, wrong.map(a=>{const {right,opts,parts,pool,...rest}=a.q; return rest})); };
 if(sc>=9) speak("Excellent! You are a star!",1); else speak("You got "+c+" out of "+n,1);
 window.scrollTo(0,0)}

window.__cur=()=>S;
app.addEventListener("click",e=>{ if(e.target.closest("[data-voice]")) openVoice() });
home();
}

</script>
</body>
</html>
